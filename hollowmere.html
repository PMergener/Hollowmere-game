<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hollowmere</title>
<style>
  * { box-sizing:border-box; margin:0; padding:0; }
  html,body { height:100%; background:#07080b; overflow:hidden;
    font-family:"Iowan Old Style",Palatino,Georgia,serif;
    -webkit-user-select:none; user-select:none; }
  #stage { position:fixed; inset:0; display:grid; place-items:center; }
  canvas { image-rendering:pixelated; image-rendering:crisp-edges;
    display:block; background:#05060a; cursor:crosshair; }
  #hud { position:fixed; left:0; right:0; bottom:10px; text-align:center;
    color:#5d5548; font-size:11px; letter-spacing:.14em; text-transform:uppercase;
    pointer-events:none; transition:opacity 1.2s ease; }
  .fade { opacity:0; }
</style>
<div id="stage"><canvas id="c"></canvas></div>
<div id="hud">wasd move &nbsp;·&nbsp; right-click swing &nbsp;·&nbsp; e interact &nbsp;·&nbsp; i inventory &nbsp;·&nbsp; j journal &nbsp;·&nbsp; t hints &nbsp;·&nbsp; m mute</div>
<script>
const W = 576, H = 360, WORLD = 1200, TILE = 24;

const PL = {hp:150, max:150, hurt:0, heal:0, denied:0, dead:false, deadT:0};
const LAMP = {c:100, max:100, drain:2, regen:1};
let souls = 0;
const DROPS = [];
const GHOST_HP = 15, SWORD_DMG = 5, EXPOSE_LIMIT = 3.6;
// ---- how a wraith behaves before it commits.
// It notices you at STALK_SEE, then holds station around the edge of the lamp:
// backing off to STALK_FAR while you are looking at it, closing to STALK_NEAR
// the moment you are not. It never retreats once committed - see g.committed.
const STALK_SEE = 230, STALK_FAR = 118, STALK_NEAR = 34;
const STALK_SPD = 26, RUSH_SPD = 46;
// Regular enemy damage doubled. Note these are RAW: the base kit's 5 armour and
// anything bought from Ondrick comes off the top, floor of 1.
const GHOST_DMG_MIN = 24, GHOST_DMG_MAX = 40;

const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
cv.width = W; cv.height = H;
function fit(){
  const s = Math.max(1, Math.min(window.innerWidth/W, window.innerHeight/H));
  cv.style.width = Math.floor(W*s)+'px'; cv.style.height = Math.floor(H*s)+'px';
}
addEventListener('resize', fit); fit();

function rng(seed){ return function(){ seed |= 0; seed = seed + 0x6D2B79F5 | 0;
  let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
  return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

const HOUSES = [
  [834,482,140,113],[110,760,133,105],[756,812,123,93],[275,561,130,114],
  [478,830,114,103],[176,322,126,95],[463,195,147,122],[774,159,117,89],
  [736,318,153,105],[390,979,125,93],[639,954,124,122],[949,649,130,96],
  [932,794,157,88],[295,723,137,89],[295,145,112,113]
].map((h,i)=>({x:h[0], y:h[1], w:h[2], h:h[3],
  lit:[0,3,6,8,11,13].includes(i), ruin:[4,9,14].includes(i), seed:i*7+3}));

const OWL_TREES = [0,1,4];
const TREES = [
  [977,936],[962,274],[814,678],[938,383],[154,612],[773,574],[757,781],[631,750],
  [381,445],[298,853],[414,901],[339,318],[732,255],[230,551],[916,671],[473,481]
].map((t,i)=>({x:t[0], y:t[1], seed:i*13+7, bare:[2,7,11,14].includes(i),
  owl: OWL_TREES.includes(i) ? {blink:0, turn:0, next:4+Math.random()*10, look:1} : null}));

const BRAZIERS = [
  [248,600],[280,520],[392,344],[424,320],[640,272],[680,280],[816,288],[896,456],
  [920,632],[904,728],[872,784],[680,920],[640,928],[448,896],[392,856],[264,704]
].map((b,i)=>({x:b[0], y:b[1], ph:i*1.37}));

const STONES = [{x:600,y:585,r:22},{x:470,y:672,r:14},{x:722,y:690,r:15}];
const GRAVES = [[196,470],[220,500],[178,506],[232,466],[200,536],[168,466]];
const FENCES = [];
for(let i=0;i<8;i++) FENCES.push({x:700+i*19, y:760});
for(let i=0;i<6;i++) FENCES.push({x:360+i*19, y:500});
for(let i=0;i<7;i++) FENCES.push({x:876, y:540+i*19});

const props = [];
(function(){ const r = rng(1337);
  for(let i=0;i<520;i++){
    const x = r()*WORLD, y = r()*WORLD;
    if(HOUSES.some(h=>x>h.x-8&&x<h.x+h.w+8&&y>h.y-8&&y<h.y+h.h+8)) continue;
    const k = r();
    props.push({x, y, t:k<0.46?'tuft':k<0.74?'rock':k<0.90?'puddle':'bone', r:r()});
  }})();

const solids = [];
HOUSES.forEach(h=>solids.push({x:h.x, y:h.y+h.h*0.42, w:h.w, h:h.h*0.58}));
TREES.forEach(t=>solids.push({x:t.x-8, y:t.y-6, w:16, h:12}));
STONES.forEach(s=>solids.push({x:s.x-s.r, y:s.y-s.r*0.6, w:s.r*2, h:s.r*1.2}));
BRAZIERS.forEach(b=>solids.push({x:b.x-4, y:b.y-4, w:8, h:7}));

function blocked(x, y, r){
  r = r || 6;
  if(AREA.name === 'undercroft'){
    for(const d of UNDER_SOLIDS){
      if(d.src && d.src.broken) continue;   // staves on the floor block nothing
      if(x+r>d.x && x-r<d.x+d.w && y+r*0.7>d.y && y-3<d.y+d.h) return true;
    }
    if(!CHEST.taken && x+r>CHEST.x-16 && x-r<CHEST.x+16 && y+r*0.7>CHEST.y-8 && y-3<CHEST.y+8) return true;
    for(const m of UNDER_ROOMS)
      if(x-r>=m.x && x+r<=m.x+m.w && y-r*0.6>=m.y && y+4<=m.y+m.h) return false;
    return true;
  }
  if(AREA.name === 'sewer'){
    for(const d of SEWER_SOLIDS)
      if(x+r>d.x && x-r<d.x+d.w && y+r*0.7>d.y && y-3<d.y+d.h) return true;
    for(const m of SEWER_ROOMS)
      if(x-r>=m.x && x+r<=m.x+m.w && y-r*0.6>=m.y && y+4<=m.y+m.h) return false;
    return true;
  }
  if(AREA.name === 'sewer2'){
    for(const d of SEWER2_SOLIDS){
      if(d.src && d.src.broken) continue;
      if(x+r>d.x && x-r<d.x+d.w && y+r*0.7>d.y && y-3<d.y+d.h) return true;
    }
    for(const m of SEWER2_ROOMS)
      if(x-r>=m.x && x+r<=m.x+m.w && y-r*0.6>=m.y && y+4<=m.y+m.h) return false;
    return true;
  }
  if(AREA.name === 'road'){
    for(const d of ROAD_SOLIDS)
      if(x+r>d.x && x-r<d.x+d.w && y+r*0.7>d.y && y-3<d.y+d.h) return true;
    for(const m of ROAD_ROOMS)
      if(x-r>=m.x && x+r<=m.x+m.w && y-r*0.6>=m.y && y+4<=m.y+m.h) return false;
    return true;
  }
  if(AREA.name === 'house'){
    const m = HOUSE_ROOM;
    if(x-r>=m.x && x+r<=m.x+m.w && y-r*0.6>=m.y && y+4<=m.y+m.h) return false;
    if(x>HOUSE_DOOR.x-16 && x<HOUSE_DOOR.x+16 && y>=m.y+m.h && y<m.y+m.h+26) return false;
    return true;
  }
  if(AREA.name === 'shop'){
    const m = SHOP_ROOM;
    for(const d of SHOP_SOLIDS)
      if(x+r>d.x && x-r<d.x+d.w && y+r*0.7>d.y && y-3<d.y+d.h) return true;
    if(x-r>=m.x && x+r<=m.x+m.w && y-r*0.6>=m.y && y+4<=m.y+m.h) return false;
    // Overlap the room band by 12px. The room test tops out at y+4<=m.y+m.h and
    // a strip starting exactly at m.y+m.h leaves a 3px dead gap that orphans the
    // whole doorway from the flood fill.
    if(x>SHOP_DOOR.x-16 && x<SHOP_DOOR.x+16 && y>=m.y+m.h-12 && y<m.y+m.h+26) return false;
    return true;
  }
  for(const s of solids)
    if(x+r>s.x && x-r<s.x+s.w && y+r*0.7>s.y && y-3<s.y+s.h) return true;
  return x<36 || y<36 || x>WORLD-36 || y>WORLD-36;
}

// Empty hands are the ABSENCE of a weapon, not a weapon you own.
//
// This used to be built fresh inside unequipWeapon(), and because it carries
// item:'sword' every other system read it as a real blade. Unequip put your sword
// in the pack and minted a placeholder; equipping the sword back swapped that
// placeholder INTO the pack; unequip again minted another. One new sword-shaped
// object per cycle, until all fifty slots were full of Bare hands.
//
// One shared instance, flagged, and the three swap sites refuse to store it.
// `bare` is undefined on every real weapon, so those checks are simply false.
const BARE_HANDS = {item:'sword', name:'Bare hands', dmg:1, art:'short', bare:true};
const EQUIP = {
  weapon:{item:'sword', name:'Short sword', dmg:SWORD_DMG, art:'short'},
  head:{name:'Dark linen hood', armor:1},
  torso:{name:'Black tunic', armor:2},
  legs:{name:'Leather trousers', armor:1},
  boots:{name:'Leather boots', armor:1},
  armor:null,
  pack:{name:'Leather backpack'}
};
function armorTotal(){
  const worn = ['head','torso','legs','boots'].reduce((a,k)=>a+(EQUIP[k].armor||0), 0);
  return worn + (EQUIP.armor ? (EQUIP.armor.armor||0) : 0);
}
// 12 -> 50. Slots 0-8 are still the hotbar, and the panel grid is now exactly 9
// wide so the top row IS the hotbar rather than wrapping across it.
const PACK_N = 50;
const BACKPACK = (function(){
  const a = [
    {item:'lamp', name:'Dark iron lamp'},
    {item:'torch', name:'Pitch torch'},
    {item:'soul', name:'Soul powder'}
  ];
  while(a.length < PACK_N) a.push(null);
  return a;
})();
const ITEM_NAMES = {lamp:'Dark iron lamp', torch:'Pitch torch', soul:'Soul powder',
  rope:'Frayed rope', sigil:'Necromancer Sigil', tear:'Crystalized Tear',
  letter:"Aldric's Letter", key:'Sewer Key', sword:'Sword', armor:'Armour',
  shackle:'Iron shackles', bow:'Bow'};
const EQUIPPABLE = {sword:1, armor:1, lamp:1, torch:1, bow:1};
let tears = 0;
function packFree(){ for(let i=0;i<PACK_N;i++) if(!BACKPACK[i]) return i; return -1; }
function packFull(){ return packFree() < 0; }
function refusePickup(){ PL.denied = 0.5; sfx('denied'); toast('PACK IS FULL'); }
let lightKind = 'torch';
const PLAYER_NAME = 'Nestor';
let LVL = 1, XP = 0, XPNEED = 50;
const XP_PER_GHOST = 5;
const INV = {open:false, pack:false, cursor:null, hover:'', hoverSlot:-1};
let gold = 0, shackles = 0;
let TOAST = null;
function toast(txt){ TOAST = {txt, age:0, dur:3.4}; }

// --- Soul Embers: the skill currency. Deliberately NOT called Soul Points --
// "Soul Powder" (the heal) already owns that reading, and the two names sat
// three pixels apart in the same panel. Powder heals, Embers buy skills.
let soulEmbers = 0;
const SE_WRAITH = 3, SE_SKELETON = 5;
const SKILLPANE = {open:false, hover:''};
// costs[] is indexed by current rank, so rank 2/3 is a data edit, not a refactor.
const SKILLS = [
  {id:'flame', name:'Thy Flame Shines Brighter', rank:0, maxRank:1, costs:[30],
   blurb:'The dark gives more ground to the light you carry.',
   detail:r=>'+'+(25*r)+'% light radius  ('+Math.round(TORCH_R*(1+0.25*r))
     +' torch / '+Math.round(LAMP_R*(1+0.25*r))+' lamp)'},
  {id:'persev', name:'Perseverance', rank:0, maxRank:1, costs:[30],
   blurb:'The lamp drinks the dark back in faster when stowed.',
   detail:r=>'lamp regeneration '+(1+2*r)+'/s  (was 1/s)'},
  {id:'steal', name:'Soul Steal', rank:0, maxRank:1, costs:[30],
   blurb:'What you put down leaves something behind.',
   detail:r=>(5*r)+' vigour per second for 3s after a kill'}
];
function skillById(id){ return SKILLS.find(s=>s.id===id); }
function skillRank(id){ const s=skillById(id); return s ? s.rank : 0; }
function skillsOwned(){ return SKILLS.reduce((a,s)=>a+s.rank, 0); }
// Base 30, and every rank already owned makes the next 20% dearer, compounding.
// So the three rank-1 skills cost 30, 36, 44 - 110 embers for the full set
// against 45 before, which is the point: you commit to an order.
const SKILL_INFLATION = 1.2;
function skillCost(s){
  const base = s.costs[Math.min(s.rank, s.costs.length-1)];
  return Math.ceil(base * Math.pow(SKILL_INFLATION, skillsOwned()));
}
function skillMaxed(s){ return s.rank >= s.maxRank; }
function buySkill(s){
  if(skillMaxed(s)) return false;
  const c = skillCost(s);
  if(soulEmbers < c){ PL.denied=0.5; sfx('denied'); return false; }
  soulEmbers -= c; s.rank++;
  sfx('quest'); toast(s.name+' — rank '+s.rank);
  return true;
}
// Applied once, at the lighting-composite step, so every carve and tint agrees.
function lightScale(){ return 1 + 0.25*skillRank('flame'); }
function lampRegen(){ return LAMP.regen + 2*skillRank('persev'); }
const STEAL = {t:0};
const STEAL_DUR = 3, STEAL_RATE = 5;
function onKill(embersGained){
  soulEmbers += embersGained;
  if(skillRank('steal') > 0) STEAL.t = STEAL_DUR;  // refreshes, never stacks
}

const LVL_HP = 12, LVL_LAMP = 4, LVL_DMG_EVERY = 2;
// Edge earned by levelling lives on the player, not on the blade, so swapping
// swords in §1 can never silently throw away accumulated damage.
let edgeBonus = 0;
function weaponDmg(){ return EQUIP.weapon.dmg + edgeBonus; }
function applyLevelReward(){
  PL.max += LVL_HP; PL.hp = Math.min(PL.max, PL.hp + LVL_HP);
  LAMP.max += LVL_LAMP; LAMP.c = Math.min(LAMP.max, LAMP.c + LVL_LAMP);
  let dmgUp = false;
  if(LVL % LVL_DMG_EVERY === 0){ edgeBonus += 1; dmgUp = true; }
  banner('LEVEL '+LVL, '+'+LVL_HP+' VIGOUR' + (dmgUp ? '   +1 EDGE' : ''), 'gold');
}

const AREA = {name:'village'};
const UNDER_W = 1850, UNDER_H = 470;
const UNDER_ROOMS = [
  {x:120, y:150, w:240, h:210},
  {x:330, y:215, w:520, h:110},
  {x:820, y:140, w:260, h:260},
  {x:1050, y:215, w:420, h:110},
  {x:1440, y:120, w:320, h:300}
];
const HOUSE_W = 440, HOUSE_H = 300;
const HOUSE_ROOM = {x:60, y:60, w:320, h:190};
const HOUSE_DOOR = {x:220, y:250};
const CATS = [
  {x:120, y:200, ph:0.0, curl:0, dir:-1},
  {x:300, y:150, ph:2.4, curl:1, dir:1}
];
const CHEST = {x:1600, y:250, open:false, taken:false};
let rags = 0, teeth = 0;

// ---- the shop ------------------------------------------------------------
// House 8 [736,318,153,105]. Its door sits ~204px from Herbert - the closest
// of the 15 to him - so the sign is in view within the first minute of play.
// No 16th house was added.
const SHOP_HOUSE = 8;
// The standing spot in front of the door, NOT the drawn doorway. Houses carry a
// solid covering their lower 58%, so an anchor at the painted door sits inside
// that box and is unreachable - the flood fill caught exactly that.
function shopDoor(){
  const h = HOUSES[SHOP_HOUSE];
  return {x: h.x + h.w/2, y: h.y + h.h + 6};
}
const SHOP_W = 400, SHOP_H = 280;
const SHOP_ROOM = {x:50, y:56, w:300, h:172};
const SHOP_DOOR = {x:200, y:228};
const ONDRICK = {x:236, y:118, dir:1, name:'Ondrick', bob:0};
const SHOP = {open:false, hover:''};
const SEWER_KEY = {bought:false, used:false, given:false};
// The sigil thread. `known` once Herbert has named the thing and refused it;
// `stirred` once it has answered the warded door on the road, which is what
// opens the quest. Both are one-way latches so neither beat can repeat.
const SIGIL = {known:false, stirred:false};
// Buy stock. The Sewer Key used to sit here for 25g; it is now Herbert's to give
// when the sigil is delivered, so Ondrick sells armour and nothing else.
const SHOP_STOCK = [
  {id:'mail', name:'Rusted Mail', price:30,
   make:()=>({item:'armor', name:'Rusted Mail', armor:2, art:'mail'}),
   blurb:'Rings and rust. Turns a bite into a bruise.', stat:'+2 armour'},
  {id:'plate', name:"Warden's Plate", price:90,
   make:()=>({item:'armor', name:"Warden's Plate", armor:5, art:'plate'}),
   blurb:'Off a warden who stopped needing it.', stat:'+5 armour'}
];
// Ondrick has ONE of each. Buying used to leave the row on the shelf, so the
// mail and the plate could be bought over and over - the only entry that ever
// left was the key, through a bespoke SEWER_KEY.bought check. `sold` generalises
// that: nothing here restocks, and there is no way to sell armour back.
function shopStock(){ return SHOP_STOCK.filter(s=>!s.sold); }
// Soul Powder is deliberately absent: it is the heal that pays for the lamp
// risk loop, and letting it be cashed out would defuse that loop.
const SELL_PRICES = {tear:5, shackle:8};
function sellRows(){
  const rows = [];
  if(tears>0) rows.push({kind:'tear', name:'Crystalized Tear', n:tears, price:SELL_PRICES.tear});
  if(shackles>0) rows.push({kind:'shackle', name:'Iron Shackles', n:shackles, price:SELL_PRICES.shackle});
  return rows;
}
// The counter spans the full room width on purpose: the gaps at either end are
// 4px, narrower than the player's 12px circle, so there is no way round it. The
// band behind it is a deliberately sealed staff area, not an orphaned pocket.
const SHOP_SOLIDS = [
  {x:60,  y:138, w:280, h:20},
  {x:64,  y:70,  w:28,  h:24},
  {x:300, y:186, w:26,  h:22}
];

// ---- the village wall ----------------------------------------------------
// A stone curtain wall on the existing 36px world boundary, with ONE opening:
// a wooden gate centred on the north side. That gate is the intended way in and
// out of Hollowmere. The old rubble barricade at (535,112) is gone - the wall
// does that job now, and doing it twice read as clutter.
// blocked() already refuses anything outside 36..WORLD-36, so the wall is drawn
// in the band just outside that line and needs no collision of its own.
const WALL_IN = 36, WALL_T = 30;          // band runs from WALL_IN-WALL_T to WALL_IN
const GATE_W = 96;
// `unlocked` is granted by Herbert when you report the Fallen Hunter; `open` is
// the player actually pushing the leaves apart, which ends the current build.
const NORTH_GATE = {x:600-GATE_W/2, y:WALL_IN-WALL_T, w:GATE_W, h:WALL_T,
  open:false, unlocked:false};
function gateStand(){ return {x:600, y:WALL_IN+20}; }
const HINTS = {open:true};
const SHAFT = {x:215, y:236};
const UNDER_DECOR = [[142,301,"crate",1],[344,338,"crate",1],[1054,267,"barrel",1],[989,238,"crate2",1],[234,343,"crate",1],[354,258,"crate",1],[140,248,"barrel",1],[184,345,"crate2",1],[1051,359,"crate",1],[1055,179,"crate",1],[446,305,"barrel",1],[1167,369,"crate2",1],[609,311,"crate",1],[646,236,"crate",1],[981,307,"barrel",1],[225,170,"crate2",1],[528,311,"bones",0],[1052,309,"bones",0],[1268,176,"rubble",0],[1176,207,"skull",0],[772,312,"web",0],[337,291,"chain",0],[1207,155,"web",0],[340,214,"chain",0],[943,280,"rubble",0],[1252,355,"bones",0],[700,259,"bones",0],[801,292,"rubble",0],[1106,295,"skull",0],[684,314,"web",0],[1200,370,"chain",0],[877,232,"web",0],[676,227,"chain",0],[275,345,"rubble",0],[1304,231,"bones",0],[1316,288,"bones",0],[1292,272,"rubble",0],[1178,309,"skull",0],[267,166,"web",0],[132,210,"chain",0],[1068,219,"web",0],[328,251,"chain",0],[195,173,"rubble",0],[1135,229,"bones",0],[328,189,"bones",0],[879,269,"rubble",0]].map((d,i)=>({x:d[0], y:d[1], t:d[2], solid:!!d[3], seed:i*13+9}));
// `src` keeps each collision rect tied to the decor that made it, so a barrel
// that has been smashed open can stop blocking without rebuilding this array.
const UNDER_SOLIDS = UNDER_DECOR.filter(d=>d.solid)
  .map(d=>({x:d.x-10, y:d.y-8, w:20, h:12, src:d}));
const UNDER_TORCHES = [
  {x:168,y:158,ph:0.0},{x:300,y:158,ph:1.1},{x:150,y:352,ph:2.2},{x:320,y:352,ph:3.1},
  {x:420,y:223,ph:0.6},{x:600,y:223,ph:1.7},{x:780,y:223,ph:2.4},{x:960,y:223,ph:3.6},
  {x:470,y:317,ph:4.2},{x:820,y:317,ph:5.0},
  {x:1090,y:148,ph:1.4},{x:1300,y:148,ph:2.8},{x:1090,y:382,ph:4.6},{x:1300,y:382,ph:5.4}
];
const AREA_SIZE = {
  village:   ()=>[WORLD, WORLD],
  undercroft:()=>[UNDER_W, UNDER_H],
  sewer:     ()=>[SEWER_W, SEWER_H],
  sewer2:    ()=>[SEWER2_W, SEWER2_H],
  house:     ()=>[HOUSE_W, HOUSE_H],
  shop:      ()=>[SHOP_W, SHOP_H],
  road:      ()=>[ROAD_W, ROAD_H]
};
// ---- The Drowned Run (sewer, one level below the undercroft) --------------
// A zig-zag of 64px channels instead of the undercroft's rooms: every stretch
// is a corridor, and you never see more than one turn ahead. Adjacent segments
// overlap at every junction, because collision needs the player circle to fit
// entirely inside a single rect.
const SEWER_W = 1500, SEWER_H = 400;
const SEWER_ROOMS = [
  {x:70,   y:40,  w:160, h:120},   // entry sump, under the grate
  {x:190,  y:70,  w:340, h:64},

  else if(d.kind==='gold'){ gold += d.amt; toast(d.amt+' gold coin'+(d.amt>1?'s':'')); }
  else if(d.kind==='shackle'){
    if(!shackleToPack()){ refusePickup(); return; }   // leave it lying if full
    toast('Iron shackles  ('+shackles+')');
    sfx('pickup');

  else if(d.kind==='rag'){ rags+=d.amt; toast(d.amt+' old rag'+(d.amt>1?'s':'')); }
  else if(d.kind==='tooth'){ teeth+=d.amt; toast(d.amt+' rotten tooth'+(d.amt>1?'s':'')); }
  else if(d.kind==='tear'){
    const n = d.amt||1;
    let got = 0;
    while(got < n && tearToPack()) got++;
    if(got === 0){ refusePickup(); return false; }   // stays on the ground
    if(got < n){ d.amt = n-got; toast(got+' tear'+(got>1?'s':'')+' — PACK IS FULL'); sfx('pickup'); return false; }
    toast(n+' crystalized tear'+(n>1?'s':''));
  }
  else if(d.kind==='item'){
    const i = packFree();
    if(i<0){ refusePickup(); return false; }         // stays on the ground
    BACKPACK[i] = d.slot;
    toast(d.slot.name+' taken');
  }
  else souls++;
  DROPS.splice(DROPS.indexOf(d),1);
  sfx('pickup');
  return true;
}

// Eye colour by kind. The reference villagers are defined by two pale points
// floating in a black hood - it is the whole read of the character. Pale also
// keeps them distinct from Nestor and the skeletons (red), the Fallen Hunter
// (green) and the wraiths (cyan).
// One eye colour per faction, so a shape in the dark is identifiable before its
// silhouette is: villagers pale, the player and the skeletons red, the zombies a
// sick yellow-green, the Fallen Hunter a hard green. The pulse rate differs too
// - the rot is slower and dimmer, because it is decay rather than will.
function figureEye(kind){
  const ep = 0.75 + 0.25*Math.sin(t*2.3);
  if(kind === 'pale')
    return 'rgb('+(206+34*ep|0)+','+(210+34*ep|0)+','+(198+32*ep|0)+')';
  if(kind === 'rot'){
    const rp = 0.62 + 0.38*Math.sin(t*1.5);
    return 'rgb('+(150+72*rp|0)+','+(168+56*rp|0)+','+(60+40*rp|0)+')';
  }
  if(kind === 'hunter'){
    const hp = 0.7 + 0.3*Math.sin(t*2.9);
    return 'rgb('+(56*hp|0)+','+(190+34*hp|0)+','+(104+26*hp|0)+')';
  }
  return 'rgb('+(194*ep|0)+','+(42*ep|0)+','+(30*ep|0)+')';
}

const SIDE = [-3, 3, 2, -2];

// moves INWARD toward the body - the blade only ever grows away from the hand.
// The intersection sweep is re-run for every entry in this table.
const WEAPON_REACH = {short:0, long:5};
function weaponReach(){

const ARC_BASE = 20, ARC_SPAN = 4;

// ---- stamina --------------------------------------------------------------
// Ten nuggets, no numbers. Held as a FLOAT in nuggets so a third of one is a
// third of a square, and each square fills from its left edge.
const STAM_N     = 10;      // squares in the bar, and the maximum
const STAM_ATTACK = 1/3;    // a swing costs a third of a nugget
const STAM_RUN   = 1.0;     // a nugget per second while running
const RUN_MULT   = 1.5;     // shift: 50% faster
const TIRED_MULT = 0.7;     // empty: 30% slower to walk and to swing
const STAM_DELAY = 3.0;     // seconds of not spending before recovery starts
const STAM_RATE  = 1/1.5;   // then one nugget every 1.5s
// `tired` has hysteresis on purpose: it latches when the bar empties and only
// clears once a WHOLE nugget is back. Clearing it the instant regen ticked would
// flicker the penalty on and off several times a second.
const STAM = {c:STAM_N, idle:STAM_DELAY, tired:false};
function spendStamina(n){
  STAM.c = Math.max(0, STAM.c - n);
  STAM.idle = 0;                       // any spend restarts the 3s clock
  if(STAM.c <= 0) STAM.tired = true;
}
function staminaRate(){ return STAM.tired ? TIRED_MULT : 1; }
function runningNow(){
  return P.moving && !!keys['shift'] && !STAM.tired && STAM.c > 0
      && !ATK.active && !bowActive();
}
function updateStamina(dt){
  if(runningNow()) spendStamina(STAM_RUN*dt);
  if(STAM.tired && STAM.c >= 1) STAM.tired = false;
  STAM.idle += dt;
  if(STAM.idle >= STAM_DELAY && STAM.c < STAM_N)
    STAM.c = Math.min(STAM_N, STAM.c + STAM_RATE*dt);

function easeOut(p){ return 1-Math.pow(1-p, 2.4); }
function easeIn(p){ return p*p; }
function restAngle(d){ return Math.PI/2 + (SIDE[d] < 0 ? REST_TILT : -REST_TILT); }

  if(!ATK.active) return 0;

  if(ATK.phase === 'strike') return 0.55 + 0.45*(ATK.t/ATK_STRIKE);
  return Math.max(0, 1 - ATK.t/ATK_REC);
}
function arcR(){ return ARC_BASE + ARC_SPAN*swingExt() + weaponReach(); }

  if(ATK.phase === 'strike') return A + WIND_OFF + (END_OFF-WIND_OFF)*easeIn(ATK.t/ATK_STRIKE);

}

  if(ATK.phase === 'recover') return {span:1.60, fade:Math.max(0, 1-(ATK.t/ATK_REC)/0.55)};

// ---- the bow, as a SECONDARY weapon --------------------------------------
// Decisions taken here, stated rather than left implicit:
//   * arrows are INFINITE. An ammo economy needs pickups, a counter and a
//     resupply loop, and that is its own system.
//   * the 20% slowdown applies whenever the bow is ACTIVE, not only while
//     drawing. That is what makes TAB a real choice instead of a free action.
//   * a shot is a SINGLE PRESS, not hold-to-draw. Right-click already means
//     "commit an attack" for the sword and the 30% longer cooldown is already
//     the pacing lever; hold-to-charge would be a second lever doing that job.
const SWORD_CD = 0.44;
const BOW_CD = SWORD_CD * 1.3;             // 30% slower than the sword, per spec
const BOW_DMG = 10;
const BOW_RANGE = 12 * TILE;               // 12 tiles, then the arrow drops
const BOW_SLOW = 0.8;                      // -20% movement while it is active
const BOW_SPD = 190;                       // faster than the archer's - it is yours

function fireBow(){

  SHOTS.push({x:P.x+cs*10, y:P.y-14+sn*6, vx:cs*BOW_SPD, vy:sn*BOW_SPD,
    ang:A, travelled:0, dead:false});

function updateShots(dt){
  for(let i=SHOTS.length-1;i>=0;i--){
    const a=SHOTS[i];
    const dx=a.vx*dt, dy=a.vy*dt;
    a.x+=dx; a.y+=dy; a.travelled+=Math.hypot(dx,dy);
    // "travels up to 12 tiles, then drops" - it stops at range rather than
    // vanishing, so the limit is something you can see and learn.
    if(a.travelled>=BOW_RANGE || blocked(a.x,a.y,2)){ SHOTS.splice(i,1); continue; }

      if(hit || e.gone || e.dying>0) return;

  rect(x+3, wallY, h.w-6, wallH, h.ruin?'#171410':'#1e1913');
  for(let i=0;i<Math.floor(wallH/6);i++)
    rect(x+3, wallY+i*6+3, h.w-6, 1, h.ruin?'#131009':'#191409');
  for(let i=1;i<5;i++) rect(x+3+i*(h.w-6)/5, wallY, 2, wallH, '#151108');
  rect(x+3, wallY, h.w-6, 2, '#292219');
  const dw = 17, dx = x+h.w/2-dw/2, dh = 21;
  rect(dx-1, wallY+wallH-dh-1, dw+2, dh+1, '#171208');
  rect(dx, wallY+wallH-dh, dw, dh, '#0b0906');
  for(let i=1;i<4;i++) rect(dx+i*dw/4, wallY+wallH-dh, 1, dh, '#141009');
  if(!h.ruin){
    rect(dx+dw-4, wallY+wallH-11, 2, 2, '#5c5140');
    rect(dx+1, wallY+wallH-dh+3, dw-2, 1, '#251d12');
    rect(dx+1, wallY+wallH-5, dw-2, 1, '#251d12');
  }
  const winY = wallY+6;
  [[x+11, h.lit],[x+h.w-24, h.lit]].forEach(([wx, on])=>{
    rect(wx-1, winY-1, 15, 12, '#100c07');
    if(on){
      rect(wx, winY, 13, 10, '#3d2c10');
      rect(wx+1, winY+1, 11, 8, '#b87c22');
      rect(wx+2, winY+2, 9, 6, '#d99b34');
      rect(wx+4, winY+3, 4, 3, '#efc164');
    } else {
      rect(wx, winY, 13, 10, '#0a0806');

    }

    rect(wx, winY+4, 13, 1, '#241a0d');
  });
  const roofH = h.h*0.62, midX = x+h.w/2;
  for(let i=0;i<roofH;i++){
    const t2 = i/roofH, inset = (1-t2)*4;

    if(i%7===0) c = h.ruin ? '#141312' : '#191819';
    else if(i%7===1) c = h.ruin ? '#1f1e1c' : '#282729';
    rect(x-3+inset, y+i, h.w+6-inset*2, 1, c);
  }
  for(let k=0;k<Math.floor(h.w/13);k++){
    const px = x+2+k*13+((k%2)*5);
    rect(px, y+3, 1, roofH-5, h.ruin?'#151413':'#1c1b1d');
  }
  rect(x-3, y+roofH-3, h.w+6, 3, '#0f0e0d');
  rect(midX-2, y+2, 4, roofH-4, '#333234');
  rect(midX-2, y+2, 1, roofH-4, '#3d3c3f');
  if(h.ruin){
    const hx = midX-12+rr()*16;
    rect(hx, y+5, 18, roofH*0.62, '#0a0a09');
    rect(hx+3, y+3, 11, 3, '#141313');
    rect(midX+4, y+roofH*0.3, 9, roofH*0.5, '#0a0a09');
  } else {
    const cx2 = x+h.w*0.72;
    rect(cx2, y-11, 9, 14, '#1a1917');
    rect(cx2, y-13, 9, 3, '#262421');
    rect(cx2+1, y-12, 3, 1, '#0d0c0b');
    for(let s=0;s<3;s++){
      const sy2 = y-15-s*5 - (Math.sin(t*0.7+h.seed+s)*2|0);
      rect(cx2+3+Math.sin(t*0.5+s+h.seed)*3, sy2, 3-s*0.5, 2, 'rgba(60,58,54,'+(0.16-s*0.04)+')');

}
const LEAF_D='#101c0e', LEAF_M='#1a2c15', LEAF_L='#25401d', LEAF_H='#315226';
// ==========================================================================
//  THE ROAD TO YOTAN - art
// ==========================================================================
// Same tiling grammar as drawGround: a per-tile hash picks the shade, so the
// ground never repeats and never needs an asset. Three bands instead of the
// village's two - paved stone down the middle, grass margins, then the dark
// under the treeline.
function drawRoadGround(){
  const x0 = Math.floor(cam.x/TILE)*TILE, y0 = Math.floor(cam.y/TILE)*TILE;
  for(let y=y0; y<cam.y+H+TILE; y+=TILE)
    for(let x=x0; x<cam.x+W+TILE; x+=TILE){
      const rr = rng((x*73856093 ^ y*19349663)>>>0);
      const r = rr();
      const d = Math.abs(x+TILE/2 - ROAD_CX);
      let c;
      if(d < ROAD_HALF)      c = r<0.5?'#242019':r<0.8?'#201d17':'#28231a';   // paving
      else if(d < ROAD_HALF+34) c = r<0.5?'#141a10':r<0.8?'#111609':'#17200f'; // grass verge
      else                   c = r<0.5?'#0c0f08':r<0.8?'#0a0c07':'#0e1109';    // under the trees
      rect(x-cam.x, y-cam.y, TILE, TILE, c);
      const sx=x-cam.x, sy=y-cam.y;
      if(d < ROAD_HALF){
        // cobble joints, only on the paved band
        if(r>0.4) rect(sx, sy+(r*TILE|0)%TILE, TILE, 1, '#191610');
        if(r>0.7) rect(sx+(r*19|0)%TILE, sy, 1, TILE, '#191610');
      } else {
        for(let k=0;k<3;k++){ const a=rr(), b=rr();
          if(a>0.6) rect(sx+a*TILE, sy+b*TILE, 1, 2, d<ROAD_HALF+34?'#1d2a14':'#0a0d07'); }
      }
    }
  // the kerb stones that edge the paving, drawn once down the whole road
  for(let y=y0; y<cam.y+H+TILE; y+=6){
    rect(ROAD_CX-ROAD_HALF-2-cam.x, y-cam.y, 2, 4, '#2e2a20');
    rect(ROAD_CX+ROAD_HALF-cam.x,   y-cam.y, 2, 4, '#2e2a20');
  }
  drawRiver();
}
// The river runs east-west under the bridge. Purely visual - the walkable rects
// already permit nothing but the deck, so the water needs no collision.
function drawRiver(){
  const ry = RIVER.y-cam.y;
  if(ry > H+40 || ry+RIVER.h < -40) return;
  for(let y=0; y<RIVER.h; y+=4){
    const wob = Math.sin((y*0.11) + t*0.7)*3;
    const sh  = y<6 || y>RIVER.h-6;
    rect(-cam.x, ry+y, ROAD_W, 4, sh?'#0d1418':(y<14||y>RIVER.h-14?'#122029':'#16303c'));
    // slow current: pale streaks drifting sideways
    if(!sh && ((y+((t*9)|0))%20===0))
      rect(40+wob*4-cam.x + ((t*11)%60), ry+y, 22, 1, 'rgba(150,196,214,0.16)');
  }
  rect(-cam.x, ry-3, ROAD_W, 3, '#1a1a12');            // the banks
  rect(-cam.x, ry+RIVER.h, ROAD_W, 3, '#1a1a12');
  drawBridge();
}
function drawBridge(){
  const bx = BRIDGE.x-cam.x, by = BRIDGE.y-cam.y;
  if(by > H+60 || by+BRIDGE.h < -60) return;
  rect(bx-4, by, BRIDGE.w+8, BRIDGE.h, '#1c1a15');      // the span's shadow side
  rect(bx, by, BRIDGE.w, BRIDGE.h, '#2b2720');          // the deck
  for(let y=0; y<BRIDGE.h; y+=9){                        // plank-and-stone courses
    rect(bx, by+y, BRIDGE.w, 1, '#211d17');
    rect(bx+2, by+y+1, BRIDGE.w-4, 1, '#332e24');
  }
  // parapets down both sides, with posts
  [0, BRIDGE.w-7].forEach(off=>{
    rect(bx+off, by-6, 7, BRIDGE.h+12, '#39342a');
    rect(bx+off, by-6, 7, 2, '#4a443a');
    rect(bx+off, by-6, 2, BRIDGE.h+12, '#454034');
    for(let y=0; y<BRIDGE.h+10; y+=16) rect(bx+off-1, by-6+y, 9, 4, '#413b30');
  });
}
// Blocked with heavy planks and a red rune-work that is plainly still live.
// Inert by design - a hook for later content and nothing else.
// The same glyph the Necromancer Sigil carries, drawn at an arbitrary size and
// position. Reused rather than reinvented so the mark on these planks and the
// mark on that sigil are legibly THE SAME HAND.
function drawRuneGlyph(x, y, c){
  rect(x+2, y,   2, 6, c);      // the long stroke
  rect(x,   y+3, 5, 2, c);      // the bar across it
  rect(x+5, y,   2, 3, c);      // the upper hook
  rect(x+1, y+6, 2, 3, c);      // the descender
}
// A burnt-out cottage of the same construction as the village houses, with the
// planks nailed across ITS doorway. It used to be a bare slab of planks in the
// grass - the runes were sealing a hole in the air.
function drawRuin(){
  const x = RUIN.x-cam.x, y = RUIN.y-cam.y;
  if(x<-220||x>W+40||y<-220||y>H+40) return;
  const rr = rng(4471);
  // ---- THE SAME HOUSE THE VILLAGE IS BUILT FROM.
  //
  // This used to be a bespoke collapsed structure that shared no geometry with
  // anything else in the game, so the road read as a different settlement. It is
  // now drawHouse with ruin set - the same walls, courses, roof pitch, ridge and
  // sagging rafters as the ruined houses in Hollowmere - and only the things that
  // make THIS house different are drawn on top: smashed windows, and the warded
  // planks across the door.
  drawHouse({x:RUIN.x, y:RUIN.y, w:RUIN.w, h:RUIN.h, seed:4471, lit:false, ruin:true});

  // ---- the windows, broken. drawHouse has already drawn two dead ones at these
  // exact coordinates; this puts the glass through them.
  const wallY = y+RUIN.h*0.62, wallH = RUIN.h*0.38;
  const winY = wallY+6;
  [x+11, x+RUIN.w-24].forEach((wx,wi)=>{
    rect(wx, winY, 13, 10, '#070605');                 // knocked clean through
    // shards still in the frame, biting in from each corner
    const shard = wi ? [[0,0,4,3],[9,0,4,4],[0,7,3,3],[10,6,3,4]]
                     : [[0,0,3,4],[10,0,3,3],[1,7,4,3],[9,8,4,2]];
    shard.forEach(s=>{
      rect(wx+s[0], winY+s[1], s[2], s[3], '#141009');
      rect(wx+s[0], winY+s[1], s[2], 1, '#2a2118');
    });
    // two slivers of glass still catching what little light there is
    rect(wx+3+wi*4, winY+2, 1, 3, '#4a5258');
    rect(wx+7-wi*3, winY+6, 1, 2, '#3d4449');
    rect(wx+6, winY, 1, 10, '#241a0d');                // the surviving mullion
  });

  // ---- the doorway, and the warded planks across it. The door drawHouse drew is
  // 17 wide; the boards overhang it either side, nailed into the jambs.
  const dw = 17, dx = x+RUIN.w/2-dw/2, dh = 21;
  const dy = wallY+wallH-dh;
  rect(dx, dy, dw, dh, '#050404');                            // the dark inside
  for(let i=0;i<4;i++){
    const py = dy+1+i*5, lean = (i%2)?2:-2;
    rect(dx-7+lean, py, dw+14, 5, '#3a2a18');
    rect(dx-7+lean, py, dw+14, 2, '#4c3821');
    rect(dx-7+lean, py+3, dw+14, 1, '#241a0e');
    // nail heads where the plank meets the jamb
    rect(dx-5+lean, py+1, 2, 2, '#5c5140');
    rect(dx+dw+3+lean, py+1, 2, 2, '#5c5140');
  }
  // ---- boards torn off and dropped. NOT a replacement for the barricade above:
  // wood_plank_* are small angled shards, 7-12px, nothing like the 40x6 boards
  // nailed across the doorway. Used for what they actually are - debris at the
  // foot of the wall, from the same rr() sequence so they never move.
  for(let i=0;i<7;i++){
    const bx2 = x + 4 + rr()*(RUIN.w-8), by2 = y + RUIN.h - 6 + rr()*18;
    drawSprite(['plank_a','plank_b','plank_c'][i%3], bx2, by2);
  }
  drawSprite('sack', x+RUIN.w-14, y+RUIN.h+8);
  // ---- the runes. LIGHTING LAYER: drawn BEFORE the composite like everything
  // else in the world, so they dim with distance - but they carry their own
  // pulse, so they still read as burning rather than as painted marks. The
  // small light they throw is added in drawLighting.
  const gl = 0.55+0.45*Math.sin(t*1.9);
  [[dx+1, dy+4],[dx+dw-8, dy+11],[dx+dw/2-3, dy+18],[dx-4, dy+18]].forEach(([gx,gy],i)=>{
    const p = 0.42+0.58*Math.abs(Math.sin(t*1.3+i*1.7));
    drawRuneGlyph(gx, gy, 'rgb('+(150+95*gl*p|0)+','+(26*p|0)+','+(22*p|0)+')');
  });
}

const YOTAN = {archY:250, gateY:150, entered:false};

// A standing torch on the outer side of each guard, replacing the candelabrum.

function drawYotanTorch(b){

// Guards are VILLAGERS with armour layered over them, per instruction - the same

const GUARD_PAL = {cloak:'#2a2c31', hi:'#363940', lo:'#191b1f', trim:'#3a3226',

  rect(fx+2, by-24, 3, 2, figureEye('pale'));

// Heights, all in one place. The first pass built this at village-door scale and
// it read as a garden gate: Yotan is a CITY, and the entrance has to be the
// tallest thing the player has seen. The palisade is now taller than a man by
// half again, the gate leaves clear it, and the arch clears them both.
const YG_WALL_H = 96;      // palisade
const YG_LEAF_H = 104;     // each gate leaf
const YG_PIER_H = 132;     // the arch piers
const YG_LINTEL = 22;      // the stone lintel across the top
function drawYotanGate(){
  const ay = YOTAN.archY-cam.y;
  if(ay > H+160 || ay < -300) return;
  const L = 46-cam.x, Rr = ROAD_W-46-cam.x;
  const gy = YOTAN.gateY-cam.y;
  // ---- THE SAME STONE WALL AS HOLLOWMERE'S, not a wooden palisade.
  //
  // The leaves already matched the village gate; the wall around them did not,
  // which is what made this read as a different structure entirely. It is now
  // the identical dressed-block course drawn by drawWall - same palette, same
  // 22x10 blocks offset every other row, same capstone lip and the same inward
  // shadow - only taller, because Yotan is a city and Hollowmere is a village.
  const YW_T = 30;                       // wall thickness, as WALL_T in the village
  const course=(x1, x2)=>{
    if(x2 <= x1) return;
    const w = x2-x1, sy = gy-YW_T;
    rect(x1, sy, w, YW_T, WALL_M);
    const rows = Math.ceil(YW_T/10);
    for(let r=0;r<rows;r++){
      const ry = sy+r*10;
      for(let i=0;i<Math.ceil(w/22)+1;i++){
        const bx = x1+i*22-((r%2)*11);
        const rr = rng((((x1+i*37)|0)*73856093 ^ ((r*17)|0)*19349663)>>>0);
        const v = rr();
        rect(Math.max(x1,bx), ry, Math.min(21, x1+w-bx), 9,
          v<0.34?WALL_D : v<0.68?WALL_M : WALL_L);
        rect(Math.max(x1,bx), ry, Math.min(21, x1+w-bx), 1, WALL_H);
      }
      rect(x1, ry+9, w, 1, '#141210');
    }
    rect(x1, sy+YW_T-3, w, 3, WALL_L);
    rect(x1, sy+YW_T-3, w, 1, WALL_H);
    for(let i=0;i<7;i++)
      rect(x1, sy+YW_T+i, w, 1, 'rgba(0,0,0,'+((1-i/7)*0.44).toFixed(3)+')');
  };
  course(-cam.x, L+8);
  course(Rr-8, ROAD_W-cam.x);
  // ---- stone jambs and the arch over the opening, exactly as drawNorthGate
  const jw = 16;
  [[L+8-jw,'#343029'],[Rr-8,'#2a2723']].forEach(j=>{
    rect(j[0], gy-YW_T-6, jw, YW_T+10, j[1]);
    rect(j[0], gy-YW_T-6, jw, 2, WALL_H);
    for(let r=0;r<4;r++) rect(j[0], gy-YW_T-6+r*10, jw, 1, '#141210');
  });
  const aw = (Rr-8) - (L+8-jw) + jw;
  rect(L+8-jw, gy-YW_T-14, aw, 9, WALL_L);
  rect(L+8-jw, gy-YW_T-14, aw, 2, WALL_H);
  rect(L+8-jw, gy-YW_T-6,  aw, 2, '#141210');
  // ---- the gates. SAME CONSTRUCTION AS HOLLOWMERE'S NORTH GATE, per
  // instruction: timber leaves built out of vertical planks, banded twice in
  // iron with three studs per band, and a ring handle on the inner edge. Only
  // the scale differs - these are a city's, not a village's. Standing open, so
  // each leaf is drawn foreshortened against its jamb the way drawNorthGate
  // draws its own open state.
  [[L+10, 1],[Rr-34, -1]].forEach(([gx,dir])=>{
    const lw = 24;
    rect(gx, gy-YG_LEAF_H, lw, YG_LEAF_H+6, '#3a2b19');
    for(let p=0;p<Math.ceil(lw/9);p++){
      const px = gx+2+p*9;
      rect(px, gy-YG_LEAF_H, 8, YG_LEAF_H+6, p%2 ? '#42311d' : '#372817');
      rect(px, gy-YG_LEAF_H, 8, 1, '#503b23');
      rect(px+7, gy-YG_LEAF_H, 1, YG_LEAF_H+6, '#241a0e');
    }
    [gy-YG_LEAF_H+14, gy-YG_LEAF_H+YG_LEAF_H-26].forEach(by=>{
      rect(gx+1, by, lw-2, 5, '#2c2f33');                   // iron band
      rect(gx+1, by, lw-2, 1, '#434850');
      for(let s=0;s<3;s++) rect(gx+4+s*7, by+1, 2, 2, '#5c636c');   // studs
    });
    const hx = dir>0 ? gx+lw-8 : gx+4;                      // ring handle
    rect(hx, gy-YG_LEAF_H/2, 4, 4, '#2c2f33');
    rect(hx+1, gy-YG_LEAF_H/2+1, 2, 2, '#0d0f11');
  });
  // ---- the stone archway, taller than both, spanning the road

// Palette taken off the reference sheet: warm cream bone, not the cool grey it
// was. Every bone element gets BONE_OUT under it - the hard dark outline is what
// makes the reference read at this size, and its absence is most of why the old
// sprite looked like pale blocks.
const BONE_HI='#f2e9cf', BONE='#ded0ab', BONE_MID='#bda882', BONE_LO='#8a765a';
const BONE_OUT='#2b2318';
// Dark green helm. Deliberately a COLD, desaturated green - tarnished bronze
// rather than moss - because the zombie already owns warm yellow-green
// (#54762c / #7a9c42) and two green enemies in the same corridor would read as
// the same thing at a glance. Eye red keyed to the sheet's sampled #c92a27.
const HELM_HI='#4c6152', HELM='#33443a', HELM_LO='#1e2a23';
const EYE_DK='#8a1a16';
const LEATH_HI='#7a4f28', LEATH='#5c3a1e', LEATH_LO='#402715';
const CLASP='#d4a92a';   // CLASP_LO went unused when the skeleton was rebuilt
const SK_SIDE=[-4,4,3,-3];
// Body lean through the swing, in pixels along the facing: pull back on the
// wind-up, drive through on the strike. This is what gives the attack weight -
// previously only the blade moved and the skeleton stood perfectly still.
function skelLean(k){
  if(k.swing<=0) return 0;
  const p = 1-(k.swing/0.32);
  // Deeper than before: the reference drops into a wide lunge on the strike,
  // so the body travels further and lands lower.
  if(p < 0.45) return -(p/0.45)*4;
  return -4 + easeIn((p-0.45)/0.55)*11;
}
// The wind-up hauls the blade UP over the head until it is near vertical - that
// is the readable tell in the reference - and the strike then drives it down
// across the body in one long arc.
// At rest the blade hangs STRAIGHT DOWN beside him - parallel to the body, not
// angled out in front of it. PI/2 is screen-down, so this holds for every
// facing; the pivot offset is what puts it at his side rather than his middle.
// At rest the blade hangs STRAIGHT DOWN the screen beside him - parallel to the
// body, not angled out in front of it - for every facing.
const SKEL_REST_ANG = Math.PI/2;
const SKEL_REC = 0.22;             // how long the blade takes to lower after a swing
const SKEL_WIND = -2.75, SKEL_STRIKE = 3.7;   // the swing, as offsets from the facing
// The rest pose is screen-fixed but the swing is facing-relative, so the two
// live in different frames and cannot simply be lerped: DIRA is not normalised
// (DIRA[1] is -1.571), and wrapping the delta per frame makes the wrap FLIP
// direction as the target moves - the blade spins most of a turn in four frames.
// So express rest once per facing as an offset from that facing, picking the
// turn nearest whatever it has to blend against. Those are constants, so every
// runtime blend is a plain lerp in one continuous frame and nothing can flip.
const SKEL_END = SKEL_WIND + SKEL_STRIKE;     // where the strike leaves the blade
function nearestTurn(ang, near){
  let best = ang;
  for(let i=-2;i<=2;i++){
    const c = ang + i*Math.PI*2;
    if(Math.abs(c-near) < Math.abs(best-near)) best = c;
  }
  return best;
}
// Rest is expressed TWICE - once near the wind-up top so the lift is short, once
// near the follow-through so the drop is short. Same screen direction either
// way; they differ by a whole turn. Anchoring both to the lift made facing 3
// lower the blade the long way round, 5.7rad, and that was the last pop left.
const SKEL_REST_LIFT = DIRA.map(A => nearestTurn(SKEL_REST_ANG - A, SKEL_WIND));
const SKEL_REST_DROP = DIRA.map(A => nearestTurn(SKEL_REST_ANG - A, SKEL_END));
function skelSwingAng(k){
  const A = DIRA[k.dir];
  if(k.swing<=0){
    // The blade is LOWERED back to the hang rather than snapped to it: k.rec
    // runs for SKEL_REC after the swing ends and eases the follow-through down.
    if(k.rec>0){
      const drop = SKEL_REST_DROP[k.dir];
      return A + SKEL_END + (drop-SKEL_END)*easeOut(1-(k.rec/SKEL_REC));
    }
    return A + SKEL_REST_LIFT[k.dir];
  }
  const rest = SKEL_REST_LIFT[k.dir];
  const sp = 1-(k.swing/0.32);
  const target = sp < 0.45
    ? easeOut(sp/0.45)*SKEL_WIND                            // up, decelerating at the top
    : SKEL_WIND + easeIn((sp-0.45)/0.55)*SKEL_STRIKE;       // down, accelerating through
  // Ease off the rest pose across the whole wind-up, accelerating. Facing 3 has
  // to carry the blade 4.7rad from the hang to overhead, so a short linear blend
  // spent a full radian of that on frame one and read as a jump; easing in over
  // the longer window makes the lift start slow and build.
  return A + rest + (target-rest)*easeIn(Math.min(1, sp/0.45));
}
// drawFalchion was removed here. It drew the curved blade from the earlier,
// superseded reference; the sheet in Art/ shows a straight arming sword, which
// drawSkelSword now draws. Intentional deletion, not a lost identifier.
function drawSkelArc(k){
  if(k.swing<=0) return;
  const sp = 1-(k.swing/0.32);
  if(sp<0.42 || sp>0.95) return;
  const q=(sp-0.42)/0.53;
  const lead = skelSwingAng(k);
  const px = Math.round(k.x-cam.x)+SK_SIDE[k.dir];
  const py = Math.round(k.y-cam.y)-14;
  const span = 0.3+q*1.0;
  // radius 23 -> 14, to sit on the tip of the shortened blade rather than
  // trailing a hand's width past it
  for(let i=0;i<=22;i++){
    const f=i/22, ang=lead-span*(1-f);
    const taper=Math.sin(Math.PI*Math.pow(f,0.62));
    const half=0.5+taper*1.8;
    const a=(0.06+0.5*Math.pow(f,1.7))*(1-Math.max(0,(sp-0.8)/0.15));
    if(a<0.03) continue;
    const cs=Math.cos(ang), sn=Math.sin(ang);
    for(let d=-half; d<=half; d+=1)
      ctx.fillStyle='rgba(200,208,216,'+(a*(1-Math.abs(d)/(half+0.01)*0.5)).toFixed(3)+')',
      ctx.fillRect(Math.round(px+cs*(14+d)), Math.round(py+sn*(14+d)), 1, 1);
  }
}
// The bow, drawn from a pivot the same way the sword is. `pull` is 0 at rest and
// 1 at full draw. Handedness matches the melee skeleton: the bow is held in the
// SAME hand the sword occupies, and the free hand is the one that draws - so a
// player who has learned to read one skeleton reads this one too.
function drawBowAt(cx, cy, ang, pull, flash){
  const cs=Math.cos(ang), sn=Math.sin(ang), nx=-sn, ny=cs;
  const B  = flash?'#e8b0a4':'#4a3a22', Bh = flash?'#ffd8d0':'#6a5432';
  // the limbs: a shallow arc either side of the grip, opening away from the shot
  for(let s=-1; s<=1; s+=2){
    for(let i=1;i<=8;i++){
      const bend = Math.sin(i/8*1.5)*3.2;
      rect(cx+nx*i*s - cs*bend, cy+ny*i*s - sn*bend, 1, 1, i>6?Bh:B);
      if(i<7) rect(cx+nx*i*s - cs*(bend-1), cy+ny*i*s - sn*(bend-1), 1, 1, B);
    }
  }
  rect(cx-1, cy-1, 2, 3, Bh);                       // the grip
  // the string, drawn as two straight runs from the tips to the nock. The nock
  // travels backward as `pull` rises, which IS the draw animation.
  const nock = -pull*6;
  for(let s=-1; s<=1; s+=2){
    const tx = cx+nx*8*s - cs*3.2, ty = cy+ny*8*s - sn*3.2;
    const bx2 = cx+cs*nock, by2 = cy+sn*nock;
    const steps = 9;
    for(let i=0;i<=steps;i++){
      const f=i/steps;
      rect(tx+(bx2-tx)*f, ty+(by2-ty)*f, 1, 1, flash?'#ffeae4':'#9a8f78');
    }
  }
  if(pull>0.15){                                     // the arrow on the string
    const ax = cx+cs*nock, ay = cy+sn*nock;
    for(let i=0;i<=11;i++) rect(ax+cs*i, ay+sn*i, 1, 1, i>9?'#b9bfc4':'#4a3a22');
  }
}

// crossguard, and a parallel-edged steel blade with a fuller. Replaces the
// curved falchion, which was drawn from the earlier (superseded) reference.
// Roughly half its old size. It used to run 30 units from the pivot on a body

// on the ground line whatever its height.
function drawSprite(key, x, y){
  const f = SPR[key];
  if(!f || !SPR_IMG.complete || !SPR_IMG.naturalWidth) return false;
  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(SPR_IMG, f[0], f[1], f[2], f[3],
                Math.round(x - f[2]/2), Math.round(y - f[3]), f[2], f[3]);
  return true;
}

function drawChest(){
  const x = Math.round(CHEST.x-cam.x), y = Math.round(CHEST.y-cam.y);
  if(x<-50||x>W+50||y<-50||y>H+40) return;
  rect(x-17, y+1, 35, 5, 'rgba(0,0,0,0.5)');
  // The chest is the one sprite in the game that is not hand-plotted: chest_1
  // (closed) and chest_5 (open) from the castle pack, anchored by their BOTTOM so
  // they stand on the same ground line the shadow marks. 37x22 against the old
  // 35x31 - shorter, which sits better beside a 29px player.
  //
  // Drawn here, INSIDE the layers pass, so it goes under the lighting composite
  // and obeys the darkness exactly like every fillRect around it.
  if(drawSprite(CHEST.open?'chest_open':'chest_closed', x, y+1)){
    if(!CHEST.open){
      // The lock keeps its heartbeat. In a game this dark the chest has to
      // announce itself from beyond the lamp's reach, and this glow is the only
      // thing that does - the sprite on its own is a brown lump in the black.
      const gl=0.5+0.5*Math.sin(t*2.2);
      rect(x-1, y-9, 2, 2, 'rgb('+(190*gl+40|0)+','+(150*gl+30|0)+','+(50*gl|0)+')');

    return;
  }
  // --- fallback: the original hand-plotted chest, kept whole.
  // The atlas is a data URI, so it is only undecoded for the first frame or two,
  // but a missing image should be a cosmetic blip and never a hole in the world.
  rect(x-16, y-16, 33, 17, '#4a3520');
  rect(x-16, y-16, 5, 17, '#5e4429');
  rect(x+12, y-16, 5, 17, '#382718');

    rect(x-4, y-20, 9, 2, '#b09858');

    rect(x+5+tail*0.4, y-6, 5, 3, md);
    rect(x-8, y-11, 8, 6, md);
    rect(x-8, y-11, 4, 6, hi);
    rect(x-8, y-13, 3, 3, md); rect(x-4, y-13, 3, 3, md);
    if(!br){ rect(x-7, y-9, 2, 2, '#c8b040'); rect(x-3, y-9, 2, 2, '#c8b040'); }
    else { rect(x-7, y-8, 2, 1, dk); rect(x-3, y-8, 2, 1, dk); }
  } else {
    rect(x-7, y-9, 14, 8, md);
    rect(x-7, y-9, 14, 2, hi);
    rect(x-6, y-2, 3, 3, dk); rect(x+2, y-2, 3, 3, dk);
    rect(x+6, y-12+tail, 3, 8, md);
    rect(x+5, y-14+tail, 3, 3, hi);
    rect(x-9, y-16, 9, 8, md);
    rect(x-9, y-16, 4, 8, hi);
    rect(x-9, y-19, 3, 4, md); rect(x-4, y-19, 3, 4, md);
    rect(x-8, y-18, 1, 2, '#8a2a2a'); rect(x-3, y-18, 1, 2, '#8a2a2a');
    if(!br){ rect(x-8, y-13, 2, 2, '#c8b040'); rect(x-4, y-13, 2, 2, '#c8b040'); }
    else { rect(x-8, y-12, 2, 1, dk); rect(x-4, y-12, 2, 1, dk); }
    rect(x-6, y-10, 3, 1, dk);
  }
}
function boneSfx(kind, k){
  if(!actx || muted) return;
  const now = actx.currentTime;
  const pan = panAt(k.x-P.x, k.y-P.y, 46);
  pan.connect(actx.destination);
  const click = (at, freq, amp, dur)=>{
    const src = noiseBuf(dur, 0.15);
    const bp = actx.createBiquadFilter(); bp.type='bandpass';
    bp.frequency.value = freq; bp.Q.value = 6;
    const g = actx.createGain();
    g.gain.setValueAtTime(amp, now+at);
    g.gain.exponentialRampToValueAtTime(0.0001, now+at+dur);
    src.connect(bp); bp.connect(g); g.connect(pan);
    src.start(now+at); src.stop(now+at+dur+0.02);
    const o = actx.createOscillator(); o.type='triangle';
    o.frequency.setValueAtTime(freq*0.55, now+at);
    o.frequency.exponentialRampToValueAtTime(freq*0.3, now+at+dur);
    const og = actx.createGain();
    og.gain.setValueAtTime(amp*0.5, now+at);
    og.gain.exponentialRampToValueAtTime(0.0001, now+at+dur);
    o.connect(og); og.connect(pan);
    o.start(now+at); o.stop(now+at+dur+0.02);
  };
  if(kind==='step'){ click(0, 900+Math.random()*400, 0.055, 0.05); }
  else if(kind==='attack'){
    for(let i=0;i<4;i++) click(i*0.045, 1100+Math.random()*700, 0.05, 0.045);
    const src=noiseBuf(0.26,0.35);
    const bp=actx.createBiquadFilter(); bp.type='bandpass'; bp.Q.value=1.6;
    bp.frequency.setValueAtTime(2400, now+0.16);
    bp.frequency.exponentialRampToValueAtTime(700, now+0.36);
    const g=actx.createGain();
    g.gain.setValueAtTime(0.0001, now+0.16);
    g.gain.linearRampToValueAtTime(0.06, now+0.20);
    g.gain.exponentialRampToValueAtTime(0.0001, now+0.40);
    src.connect(bp); bp.connect(g); g.connect(pan);
    src.start(now+0.16); src.stop(now+0.44);
  }
  else if(kind==='hurt'){
    click(0, 1800, 0.11, 0.06); click(0.05, 700, 0.08, 0.10);
  }
  else if(kind==='die'){
    for(let i=0;i<14;i++)
      click(i*0.055+Math.random()*0.03, 1500-i*70+Math.random()*300,
            0.075*(1-i/18), 0.05+Math.random()*0.05);
  }
}
function faceDir(dx, dy){
  return Math.abs(dx) > Math.abs(dy) ? (dx>0?3:2) : (dy>0?0:1);
}
function drawFigure(wx, wy, dir, phase, moving, pal, o){
  const x = Math.round(wx-cam.x), y = Math.round(wy-cam.y);
  if(x<-44||x>W+44||y<-60||y>H+44) return null;
  const sw = moving ? Math.sin(phase) : 0;
  const bob = moving && Math.sin(phase*2) > 0.4 ? 1 : 0;
  const by = y - bob;
  const side = (dir===2 || dir===3);
  const fc = dir===3 ? 1 : dir===2 ? -1 : 0;
  const swing = Math.round(sw*3);

  ctx.fillStyle = 'rgba(0,0,0,0.5)';
  ctx.beginPath(); ctx.ellipse(x, y+1, 8, 3.2, 0, 0, 6.3); ctx.fill();

  let torch = null;
  if(o.light){
    const tdx = (dir===2) ? -9 : (dir===3) ? 9 : (dir===1 ? -9 : 9);
    torch = {x:x+tdx, y:o.light==='lamp' ? by-13 : by-22, kind:o.light};
  }
  if(o.light && dir===1) drawHeld(o.light, torch, by);

  if(side){
    const fl = Math.round(sw*3)*fc, bl = -fl;
    rect(x-2+bl, by-6, 3, 6, pal.lo);
    rect(x-2+fl, by-6, 3, 6, pal.cloak);
    rect(x-2+bl, by-2, 5, 2, '#0b0a08');
    rect(x-2+fl, by-2, 5, 2, '#0c0b09');
  } else {
    const lA = Math.max(0, Math.round(sw*3)), lB = Math.max(0, Math.round(-sw*3));
    rect(x-5, by-6, 3, 6-lA, pal.cloak); rect(x-5, by-2-lA, 5, 2, '#0b0a08');
    rect(x+2, by-6, 3, 6-lB, pal.cloak); rect(x+2, by-2-lB, 5, 2, '#0b0a08');
  }

  if(side){
    rect(x-4, by-18, 9, 12, pal.cloak);
    rect(x-4+(fc>0?6:0), by-18, 3, 12, pal.hi);
    rect(x-4+(fc>0?0:6), by-18, 3, 12, pal.fold);
    // a lighter under-tunic showing between the cloak edges, per the reference
    if(pal.tunic) rect(x-4+(fc>0?3:3), by-17, 3, 8, pal.tunic);
    rect(x-6, by-9, 13, 3, pal.lo);
    rect(x-4, by-11, 9, 2, pal.trim);
    rect(x-1, by-11, 2, 2, '#6b5a3e');
  } else {
    rect(x-6, by-18, 12, 12, pal.cloak);
    rect(x-6, by-18, 3, 12, pal.hi);
    rect(x+3, by-18, 3, 12, pal.fold);
    if(pal.tunic){
      rect(x-3, by-17, 6, 8, pal.tunic);       // the tunic panel
      rect(x-3, by-17, 6, 1, pal.hi);          // its lit collar
    }
    rect(x-1, by-17, 1, 10, pal.fold);
    rect(x-7, by-9, 14, 3, pal.lo);
    rect(x-6, by-11, 12, 2, pal.trim);
    rect(x-1, by-11, 3, 2, '#6b5a3e');
    rect(x-7, by-20, 14, 3, pal.hi);
    rect(x-7, by-20, 14, 1, pal.fold);
  }

  // Bare hands. The reference shows pale skin at the cuffs; `pal.hand` falls
  // back to the old near-black so nothing that omits it changes.
  const HAND = pal.hand || '#0e0d0b';
  if(side){
    const ax = x - 1 + fc*3 + Math.round(sw*3)*fc;
    if(!o.blade){ rect(ax, by-17, 3, 8, pal.hi); rect(ax, by-11, 3, 3, HAND); }
  } else {
    const free = dir===0 ? -9 : 6, held = dir===0 ? 6 : -9;
    if(!o.blade){
      rect(x+free, by-17+swing, 3, 8, pal.hi);
      rect(x+free, by-11+swing, 3, 3, HAND);
    }
    if(o.light){ rect(x+held, by-18, 3, 9, pal.hi); rect(x+held, by-12, 3, 3, HAND); }
    else if(!o.blade){ rect(x+held, by-17-swing, 3, 8, pal.hi); rect(x+held, by-11-swing, 3, 3, HAND); }
  }

  if(side){
    rect(x-5, by-27, 11, 10, pal.cloak);
    rect(x-4, by-29, 9, 2, pal.cloak);
    rect(x-5+(fc>0?7:0), by-27, 4, 10, pal.hi);
    rect(x-5, by-28, 11, 1, pal.fold);
    if(fc>0){ rect(x+2, by-24, 4, 5, pal.skin);
      if(o.eyes) rect(x+4, by-23, 2, 2, figureEye(o.eyes)); }
    else { rect(x-5, by-24, 4, 5, pal.skin);
      if(o.eyes) rect(x-5, by-23, 2, 2, figureEye(o.eyes)); }
    rect(x-6, by-18, 13, 2, pal.lo);
  } else if(dir===1){
    rect(x-6, by-27, 12, 10, pal.cloak);
    rect(x-5, by-29, 10, 2, pal.cloak);
    rect(x-6, by-27, 3, 10, pal.hi);
    rect(x-1, by-26, 2, 9, pal.lo);
    rect(x-6, by-28, 12, 1, pal.fold);
  } else {
    rect(x-6, by-27, 12, 10, pal.cloak);
    rect(x-5, by-29, 10, 2, pal.cloak);
    rect(x-6, by-27, 3, 10, pal.hi);
    rect(x-6, by-28, 12, 1, pal.fold);
    rect(x-4, by-24, 8, 6, pal.skin);
    rect(x-4, by-24, 8, 1, '#000000');
    if(o.eyes){
      const ec = figureEye(o.eyes);
      rect(x-3, by-23, 2, 2, ec);
      rect(x+1, by-23, 2, 2, ec);
    }
  }

  if(o.light && dir!==1) drawHeld(o.light, torch, by);
  if(o.blade){
    if(bowActive()){
      // Same handedness convention as the skeleton archer: the bow is held in
      // the hand the sword would occupy, and the free hand draws.
      const A = DIRA[dir];
      const pull = ATK.cd>0 ? Math.max(0, 1-(BOW_CD-ATK.cd)/0.18) : 0;
      const bx = x + Math.cos(A)*8, byy = by-15 + Math.sin(A)*4;
      drawBowAt(bx, byy, A, pull, false);
      const hx = bx - Math.cos(A)*(3+pull*7), hy = byy - Math.sin(A)*(3+pull*7);
      rect(hx-1, hy-1, 3, 3, pal.hand || '#0e0d0b');
    } else {
      drawArmBlade(x+SIDE[dir], by-16, bladeAngle(), pal);
    }
  }
  return torch;
}
function drawTorch(tp){
  const f = Math.sin(t*11)*0.9 + Math.sin(t*23)*0.6;
  rect(tp.x-2, tp.y+2, 3, 12, '#241a10');
  rect(tp.x-2, tp.y+2, 1, 12, '#2f2214');
  rect(tp.x-2, tp.y+1, 3, 2, '#3a2b18');
  rect(tp.x-3, tp.y-3, 6, 7, '#c2570f');
  rect(tp.x-2, tp.y-6+f*0.5, 4, 6, '#e8912b');
  rect(tp.x-1, tp.y-8+f, 2, 4, '#f3c85e');
  rect(tp.x-1, tp.y-9+f, 1, 2, '#fbe9a8');
}
function drawLamp(tp){
  const g = 0.55 + 0.45*Math.sin(t*2.6) + 0.15*Math.sin(t*6.1);
  rect(tp.x-1, tp.y-12, 3, 4, '#25262a');
  rect(tp.x-3, tp.y-9, 6, 2, '#33343a');
  rect(tp.x-6, tp.y-7, 12, 2, '#3c3d44');
  rect(tp.x-6, tp.y-7, 12, 1, '#4a4b53');
  rect(tp.x-6, tp.y-5, 12, 12, '#131418');
  rect(tp.x-4, tp.y-4, 8, 10, 'rgb('+(14+26*g|0)+','+(96+72*g|0)+','+(54+44*g|0)+')');
  rect(tp.x-3, tp.y-3, 6, 8, 'rgb('+(58+70*g|0)+','+(186+66*g|0)+','+(104+62*g|0)+')');
  rect(tp.x-2, tp.y-1, 4, 4, 'rgb('+(150+90*g|0)+',255,'+(180+55*g|0)+')');
  rect(tp.x-6, tp.y-5, 2, 12, '#2b2c32');
  rect(tp.x+4, tp.y-5, 2, 12, '#2b2c32');
  rect(tp.x-1, tp.y-5, 1, 12, '#202126');
  rect(tp.x-6, tp.y+7, 12, 2, '#3c3d44');
  rect(tp.x-3, tp.y+9, 6, 1, '#25262a');
}
function drawHeld(kind, tp, by){ if(kind==='lamp') drawLamp(tp); else drawTorch(tp); }

const embers = [];
function updateEmbers(dt, tp){
  const lamp = tp && tp.kind === 'lamp';
  if(tp && tp.kind && Math.random() < (lamp?0.18:0.5))
    embers.push({x:tp.x+(Math.random()*4-2), y:tp.y-3,
      vy:lamp?-5-Math.random()*6:-12-Math.random()*15,
      vx:(Math.random()-0.5)*(lamp?4:10), life:1, g:lamp});
  for(let i=embers.length-1;i>=0;i--){ const e = embers[i];
    e.x += e.vx*dt; e.y += e.vy*dt; e.life -= dt*(e.g?0.5:0.9);
    if(e.life<=0) embers.splice(i,1); }
}
function drawEmbers(){
  embers.forEach(e=>rect(e.x, e.y, e.life>0.6?2:1, e.life>0.6?2:1, e.g
    ? (e.life>0.55?'#7ce8a4':e.life>0.25?'#2e9a5e':'#124026')
    : (e.life>0.55?'#e0902c':e.life>0.25?'#8f4a12':'#3d2109')));
}
function drawUnderGround(){
  ctx.fillStyle='#08080a'; ctx.fillRect(0,0,W,H);
  UNDER_ROOMS.forEach(m=>{
    const x=m.x-cam.x, y=m.y-cam.y;
    rect(x-18, y-22, m.w+36, 24, '#191713');
    for(let i=0;i<Math.ceil((m.w+36)/26);i++){
      const bx=x-18+i*26+((i%2)*9);
      rect(bx, y-22, 24, 11, '#22201a');
      rect(bx, y-22, 24, 2, '#2c2922');
      rect(bx, y-11, 24, 10, '#1d1b16');
      rect(bx+23, y-22, 1, 23, '#100f0c');
    }
    rect(x-18, y-2, m.w+36, 3, '#0d0c0a');
    rect(x-18, y-22, 18, m.h+24, '#161410');
    rect(x+m.w, y-22, 18, m.h+24, '#161410');
    for(let i=0;i<Math.ceil(m.h/22);i++){
      rect(x-18, y+i*22, 16, 20, '#1e1c17');
      rect(x-18, y+i*22, 16, 2, '#272419');
      rect(x+m.w+2, y+i*22, 16, 20, '#1e1c17');
      rect(x+m.w+2, y+i*22, 16, 2, '#272419');
    }
    rect(x-18, y+m.h, m.w+36, 16, '#131210');
    rect(x-18, y+m.h, m.w+36, 3, '#1c1a15');
  });
  UNDER_ROOMS.forEach(m=>{
    const x=m.x-cam.x, y=m.y-cam.y;
    for(let i=0;i<14;i++){
      const a=(1-i/14)*0.55;
      rect(x, y+i, m.w, 1, 'rgba(0,0,0,'+a.toFixed(3)+')');
    }
    for(let i=0;i<9;i++){
      const a=(1-i/9)*0.42;
      rect(x+i, y, 1, m.h, 'rgba(0,0,0,'+a.toFixed(3)+')');
      rect(x+m.w-1-i, y, 1, m.h, 'rgba(0,0,0,'+a.toFixed(3)+')');
      rect(x, y+m.h-1-i, m.w, 1, 'rgba(0,0,0,'+(a*0.7).toFixed(3)+')');
    }
  });
  UNDER_ROOMS.forEach(m=>{
    const x0=Math.floor((cam.x)/TILE)*TILE, y0=Math.floor((cam.y)/TILE)*TILE;
    for(let wy=Math.max(m.y, y0); wy<Math.min(m.y+m.h, cam.y+H+TILE); wy+=8){
      for(let wx=Math.max(m.x, x0); wx<Math.min(m.x+m.w, cam.x+W+TILE); wx+=8){
        const rr=rng((wx*73856093 ^ wy*19349663)>>>0), r=rr();
        const c = r<0.42?'#232019' : r<0.72?'#1e1c16' : r<0.92?'#282419' : '#1a1813';
        rect(wx-cam.x, wy-cam.y, 8, 8, c);
      }
    }
    for(let wy=m.y; wy<m.y+m.h; wy+=24){
      for(let wx=m.x; wx<m.x+m.w; wx+=24){
        const rr=rng((wx*19349663 ^ wy*83492791)>>>0), r=rr();
        const sx=wx-cam.x, sy=wy-cam.y;
        if(sx<-30||sx>W+30||sy<-30||sy>H+30) continue;
        if(r>0.90){ rect(sx+2, sy+3, 9, 3, '#0f1519'); rect(sx+3, sy+3, 6, 1, '#16222a'); }
        else if(r>0.80) rect(sx+(r*14|0), sy+(r*18|0), 5, 1, '#15130f');
        else if(r>0.72) rect(sx+(r*16|0), sy+(r*12|0), 2, 2, '#2e2a1e');
      }
    }
  });
}
function drawDecor(d){
  const x = Math.round(d.x-cam.x), y = Math.round(d.y-cam.y);
  if(x<-40||x>W+40||y<-52||y>H+40) return;
  const rr = rng(d.seed);
  if(d.t==='crate' || d.t==='crate2'){
    const w = d.t==='crate' ? 20 : 16, h = d.t==='crate' ? 17 : 14;
    // Sprite first, hand-plotted crate as the fallback. The sprites are the
    // SMASHED variants from the pack - a village that has been through what this
    // one has should not be storing its grain in tidy boxes.
    const sk = d.t==='crate' ? 'crate' : 'crate2', sp = SPR[sk];
    rect(x-(sp?sp[2]:w)/2+2, y-1, sp?sp[2]:w, 4, 'rgba(0,0,0,0.45)');
    if(drawSprite(sk, x, y)) return;
    rect(x-w/2, y-h, w, h, '#39291a');
    rect(x-w/2, y-h, w, 3, '#4a3722');
    rect(x-w/2, y-h, 3, h, '#43311e');
    rect(x+w/2-3, y-h, 3, h, '#2b1e12');
    rect(x-w/2, y-3, w, 3, '#241a10');
    rect(x-w/2+1, y-h+4, w-2, 2, '#4f3b24');
    rect(x-w/2+1, y-8, w-2, 2, '#4f3b24');
    for(let i=1;i<3;i++) rect(x-w/2+i*w/3, y-h+2, 1, h-4, '#2b1e12');
    rect(x-w/2+2, y-h+2, 2, 2, '#5c4629');
    if(d.t==='crate2'){ rect(x-w/2+3, y-h-3, w-6, 4, '#332417'); rect(x-w/2+3, y-h-3, w-6, 1, '#453220'); }
  } else if(d.t==='barrel'){
    // INTACT BARRELS ALWAYS LOOK INTACT. There used to be a random quarter drawn
    // pre-smashed for variety; now that they can be broken, a barrel that starts
    // stove in would leave the player unable to tell which are worth swinging at.
    // Smashed means smashed BY YOU.
    const bk = d.broken ? 'barrel_bust' : 'barrel', bs = SPR[bk];
    rect(x-(bs?bs[2]:17)/2, y-1, bs?bs[2]:17, 4, 'rgba(0,0,0,0.45)');
    if(drawSprite(bk, x, y)) return;
    rect(x-7, y-21, 15, 21, '#3d2c1b');
    rect(x-7, y-21, 4, 21, '#4a3722');
    rect(x+5, y-21, 3, 21, '#2b1e12');
    rect(x-8, y-18, 17, 3, '#5e5040');
    rect(x-8, y-9, 17, 3, '#5e5040');
    rect(x-8, y-18, 17, 1, '#736450');
    rect(x-8, y-9, 17, 1, '#736450');
    rect(x-6, y-23, 13, 3, '#4a3722');
    rect(x-6, y-23, 13, 1, '#5c4629');
    rect(x-3, y-22, 6, 1, '#241a10');
  } else if(d.t==='web'){
    const c1='rgba(190,196,204,0.20)', c2='rgba(210,216,224,0.30)';
    for(let i=0;i<5;i++){
      const a = -Math.PI*0.5 + (i-2)*0.34;
      for(let r2=3;r2<20;r2+=1)
        rect(x+Math.cos(a)*r2, y+Math.sin(a)*r2*0.8, 1, 1, c1);
    }
    for(let ring=6; ring<20; ring+=5)
      for(let a=-Math.PI*0.5-0.72; a<=-Math.PI*0.5+0.72; a+=0.08)
        rect(x+Math.cos(a)*ring, y+Math.sin(a)*ring*0.8, 1, 1, c2);
    rect(x-1, y-2, 2, 2, 'rgba(230,234,240,0.30)');
  } else if(d.t==='chain'){
    const sway = Math.sin(t*0.6+d.seed)*0.8;
    const len = 16+Math.floor(rr()*10);
    for(let i=0;i<len;i++){
      const ox = Math.sin(t*0.5+d.seed+i*0.2)*0.5 + sway*(i/len);
      rect(x+ox, y-len*2+i*2, 3, 1, i%2 ? '#4a4640' : '#5e5951');
      rect(x+ox, y-len*2+i*2+1, 1, 1, '#332f2b');
    }
    rect(x-1, y-len*2-3, 5, 3, '#4a4640');
    rect(x-1, y-len*2-3, 5, 1, '#6b6459');
    rect(x-1, y-2, 5, 3, '#3a3630');
  } else if(d.t==='bones'){
    rect(x-9, y-1, 19, 3, 'rgba(0,0,0,0.35)');
    rect(x-8, y-4, 11, 3, '#9c9076');
    rect(x-8, y-4, 11, 1, '#c2b697');
    rect(x-9, y-5, 3, 4, '#a89c80'); rect(x+2, y-5, 3, 4, '#a89c80');
    rect(x+1, y-7, 9, 3, '#9c9076');
    rect(x+1, y-7, 9, 1, '#b8ac8e');
    rect(x-4, y-8, 3, 3, '#8a8068');
    rect(x+5, y-2, 5, 2, '#7c745f');

function ghostLampAlpha(g){
  if(g.gone || heldLight() !== 'lamp') return 0;
  const d = Math.hypot(g.x-P.x, g.y-P.y);
  // Reveal rides the lamp's actual radius, so Thy Flame widens what you can see
  // as well as how far you can see. A bigger lamp that revealed no more wraiths
  // would be a lie about what the skill does.
  const reveal = GHOST_REVEAL * lightScale();
  if(d > reveal) return 0;
  return Math.min(1, (reveal-d)/33);
}
function ghostAlpha(g){
  if(g.gone) return 0;
  let a = ghostLampAlpha(g);
  if(g.hostile){
    const d = Math.hypot(g.x-P.x, g.y-P.y);
    if(d < 45) a = Math.max(a, 0.42*(1-d/45));
  }
  if(g.dying > 0) a = Math.max(a, 0.8)*(g.dying/0.55);
  return a;
}
function nearestHostile(){
  let best = 1e9;
  GHOSTS.forEach(g=>{ if(g.hostile && !g.gone && g.dying<=0)
    best = Math.min(best, Math.hypot(g.x-P.x, g.y-P.y)); });
  return best;
}

    return 'rgba('+(r|0)+','+(gg|0)+','+(b|0)+','+(A*0.94).toFixed(3)+')';
  };

// pressure rather than heard as a sound.
let humGain=null, ambienceDeep=false, ambienceRain=true;

const WIND_VOL = 0.055, CRICKET_VOL = 0.5;

// top of this rather than scaling it, so the bed you actually heard peaked near

const HUM_VOL = 0.10;
function initAudio(){

// actually switch it off.

// The wind is noise through a narrow bandpass whose centre drifts between 300
// and 900Hz on a slow LFO. That drift is the whole trick: a fixed filter reads
// as hiss, a moving one reads as air over open ground.
//
// The crickets are NOT samples and not a loop - each chirp is scheduled on a
// timer, three pulses of a 4.2kHz sine through a fast envelope, with the gap
// randomised. Chorusing that never repeats, for the cost of one oscillator per
// chirp.
function buildRoadBed(){
  if(!actx || windGain) return;

    const g = actx.createGain(); g.gain.value = i ? 0.014 : 0.022;
    const wob = actx.createOscillator(); wob.frequency.value = 0.037+i*0.011;
    const wg = actx.createGain(); wg.gain.value = i ? 0.010 : 0.016;

// so it has air without ever becoming a texture you notice. It sits under
// everything and never resolves.
function buildDeepHum(){
  if(!actx || humGain) return;
  const now = actx.currentTime;
  humGain = actx.createGain();
  humGain.gain.setValueAtTime(0, now);
  const lp = actx.createBiquadFilter();
  lp.type='lowpass'; lp.frequency.value=120; lp.Q.value=0.7;
  // Same rule as the rain: the swell modulates this inner stage, NOT humGain.gain.

  // that value to 0 on the surface silenced nothing and the hum breathed at
  // +-0.34 - six times its own sewer level - everywhere in the game.
  const breath = actx.createGain(); breath.gain.value = 1;

// drips and gets no bed at all, and nothing but the village gets rain - so the
// hum can never be heard on the surface, indoors or in the undercroft.
function undergroundArea(){
  return AREA.name==='sewer' || AREA.name==='sewer2';

// The road keeps the village's weather at its southern end and loses it as you
// walk. roadWeather() is 1 at the gate you came out of and 0 by the bridge, and
// it drives BOTH the rain bed and the visual rain, so the sound and the sight go
// together instead of one snapping off.
const RAIN_FADE_FROM = 2400, RAIN_FADE_TO = 1650;
function roadWeather(){
  if(AREA.name!=='road') return 0;
  return Math.max(0, Math.min(1, (P.y-RAIN_FADE_TO)/(RAIN_FADE_FROM-RAIN_FADE_TO)));
}
function rainyArea(){ return AREA.name==='village' || (AREA.name==='road' && roadWeather()>0.02); }

function windyArea(){ return AREA.name==='road'; }

// frame; only touches the graph when the target actually changes.
function updateAmbience(){
  if(!actx) return;

  const now = actx.currentTime;
  // ---- On the ROAD the rain does not switch, it FADES: its level tracks the
  // player's distance from the village gate, so walking north thins it out and
  // walking back brings it in. Set every frame, which is why it is handled here
  // and not behind the changed-target guard below.
  if(AREA.name==='road' && rainGain && !muted){
    const w = roadWeather();
    rainGain.gain.cancelScheduledValues(now);
    rainGain.gain.setTargetAtTime(baseVol*w, now, 0.6);
  }
  if(deep === ambienceDeep && wet === ambienceRain && windy === ambienceWind) return;
  ambienceDeep = deep; ambienceRain = wet; ambienceWind = windy;
  if(rainGain && AREA.name!=='road'){
    rainGain.gain.cancelScheduledValues(now);
    rainGain.gain.setValueAtTime(Math.max(0.0001, rainGain.gain.value), now);
    rainGain.gain.linearRampToValueAtTime(wet ? (muted?0:baseVol) : 0, now + (wet?2.0:1.1));
  }

    humGain.gain.cancelScheduledValues(now);
    humGain.gain.setValueAtTime(Math.max(0.0001, humGain.gain.value), now);
    humGain.gain.linearRampToValueAtTime(deep ? (muted?0:HUM_VOL) : 0, now + (deep?2.4:0.9));

  // rather than announcing itself.
  if(windGain){
    windGain.gain.cancelScheduledValues(now);
    windGain.gain.setValueAtTime(Math.max(0.0001, windGain.gain.value), now);
    windGain.gain.linearRampToValueAtTime(windy ? (muted?0:WIND_VOL) : 0, now + (windy?5.0:1.2));
  }
  if(cricketGain){
    cricketGain.gain.cancelScheduledValues(now);
    cricketGain.gain.setValueAtTime(Math.max(0.0001, cricketGain.gain.value), now);
    cricketGain.gain.linearRampToValueAtTime(windy ? (muted?0:CRICKET_VOL) : 0, now + (windy?4.0:0.8));

function toggleMute(){

  // belongs to the area the player is currently standing in.
  if(rainGain) rainGain.gain.linearRampToValueAtTime(
    muted ? 0 : (ambienceRain ? baseVol : 0), now+0.35);
  if(humGain) humGain.gain.linearRampToValueAtTime(
    muted ? 0 : (ambienceDeep ? HUM_VOL : 0), now+0.35);
  if(windGain) windGain.gain.linearRampToValueAtTime(
    muted ? 0 : (ambienceWind ? WIND_VOL : 0), now+0.35);
  if(cricketGain) cricketGain.gain.linearRampToValueAtTime(
    muted ? 0 : (ambienceWind ? CRICKET_VOL : 0), now+0.35);

  if(!rainGain || muted || !ambienceRain) return;  // nothing to duck when it is silent
  rainGain.gain.cancelScheduledValues(actx.currentTime);
  rainGain.gain.setValueAtTime(rainGain.gain.value, actx.currentTime);

  for(let i=0;i<n;i++){ const w=Math.random()*2-1; l=l*smooth+w*(1-smooth); c[i]=l*(smooth>0.7?2.2:1); }

function ghostSfx(kind, g){

  const pan = panAt(g.x-P.x, g.y-P.y, 40);
  pan.connect(actx.destination);

    lp.frequency.setValueAtTime(520, now);

    osc.frequency.setValueAtTime(58, now);

    const vib=actx.createOscillator(); vib.frequency.value=17;
    const vg=actx.createGain(); vg.gain.value=7;

    env.gain.linearRampToValueAtTime(0.13, now+0.34);
    env.gain.exponentialRampToValueAtTime(0.0001, now+dur);

    osc.connect(olp); olp.connect(og); og.connect(env);
    env.connect(pan);
    src.start(now); src.stop(now+dur+0.05);
    osc.start(now); osc.stop(now+dur+0.05);
  } else if(kind==='whisper'){
    // Breath with a voice almost inside it. Deliberately near-formant and short
    // of words: it should read as someone about to speak rather than as speech.
    // Volume is passed in through g.__wv, set from distance by the caller, so a
    // wraith is HEARD well before the lamp could ever show it.
    const dur=1.25, vol=(g && g.__wv) || 0.05;
    const src=noiseBuf(dur,0.5);
    const bp=actx.createBiquadFilter(); bp.type='bandpass'; bp.Q.value=6.5;

    const fg=actx.createGain(); fg.gain.value=110;
    fm.connect(fg); fg.connect(bp.frequency); fm.start(now); fm.stop(now+dur);
    const env=actx.createGain();

    env.gain.linearRampToValueAtTime(vol, now+0.42);
    env.gain.linearRampToValueAtTime(vol*0.7, now+0.8);
    env.gain.exponentialRampToValueAtTime(0.0001, now+dur);
    src.connect(bp); bp.connect(env); env.connect(pan);
    src.start(now); src.stop(now+dur+0.05);
  } else if(kind==='whimper'){
    const dur=0.85;
    const o=actx.createOscillator(); o.type='sine';
    o.frequency.setValueAtTime(430, now);
    o.frequency.exponentialRampToValueAtTime(268, now+0.30);
    o.frequency.exponentialRampToValueAtTime(112, now+dur);
    const tr=actx.createOscillator(); tr.frequency.value=11;
    const tg=actx.createGain(); tg.gain.value=22;
    tr.connect(tg); tg.connect(o.frequency); tr.start(now); tr.stop(now+dur);
    const bp=actx.createBiquadFilter(); bp.type='bandpass'; bp.Q.value=1.4;
    bp.frequency.setValueAtTime(900, now);
    bp.frequency.exponentialRampToValueAtTime(340, now+dur);
    const env=actx.createGain();
    env.gain.setValueAtTime(0.0001, now);
    env.gain.linearRampToValueAtTime(0.085, now+0.06);
    env.gain.linearRampToValueAtTime(0.055, now+0.34);
    env.gain.exponentialRampToValueAtTime(0.0001, now+dur);
    const air=noiseBuf(dur,0.55);
    const ahp=actx.createBiquadFilter(); ahp.type='highpass'; ahp.frequency.value=700;
    const ag=actx.createGain();
    ag.gain.setValueAtTime(0.05, now);

const WHISPERS = ['Follow me...', "I'm...Lost...Help...me...",

for(let i=whisperOrder.length-1;i>0;i--){

function playWhisper(angle){
  if(!actx || muted) return 3.2;
  const now = actx.currentTime;
  const src = noiseBuf(4, 0.45);
  src.playbackRate.value = 0.9+Math.random()*0.2;
  const hp=actx.createBiquadFilter(); hp.type='highpass'; hp.frequency.value=360;
  const f1=actx.createBiquadFilter(); f1.type='bandpass'; f1.frequency.value=780; f1.Q.value=3.2;
  const f2=actx.createBiquadFilter(); f2.type='bandpass'; f2.frequency.value=2000; f2.Q.value=5.5;
  const g1=actx.createGain(); g1.gain.value=0.85;
  const g2=actx.createGain(); g2.gain.value=0.42;
  const env=actx.createGain(); env.gain.setValueAtTime(0.0001, now);
  let tt=now+0.08;
  const syl=6+Math.floor(Math.random()*4);
  for(let i=0;i<syl;i++){
    const up=0.05+Math.random()*0.05, hold=0.05+Math.random()*0.07, down=0.10+Math.random()*0.13;
    const peak=0.30+Math.random()*0.35;
    env.gain.linearRampToValueAtTime(peak, tt+up);
    env.gain.linearRampToValueAtTime(peak*0.62, tt+up+hold);
    env.gain.linearRampToValueAtTime(0.015, tt+up+hold+down);
    tt += up+hold+down+0.05+Math.random()*0.13;
  }
  env.gain.linearRampToValueAtTime(0.0001, tt+0.35);
  const total = (tt+0.45)-now;
  f1.frequency.linearRampToValueAtTime(660+Math.random()*280, now+total);
  f2.frequency.linearRampToValueAtTime(1750+Math.random()*550, now+total);
  const pan = actx.createPanner();
  pan.panningModel='HRTF'; pan.distanceModel='inverse';
  pan.refDistance=1; pan.maxDistance=30; pan.rolloffFactor=1.3;
  const r0=2.2, r1=1.1;
  const a1=angle+(Math.random()<0.5?-1:1)*(1.1+Math.random()*1.5);
  if(pan.positionX){
    pan.positionX.setValueAtTime(Math.cos(angle)*r0, now);
    pan.positionY.setValueAtTime(0.1, now);
    pan.positionZ.setValueAtTime(Math.sin(angle)*r0, now);
    pan.positionX.linearRampToValueAtTime(Math.cos(a1)*r1, now+total);
    pan.positionZ.linearRampToValueAtTime(Math.sin(a1)*r1, now+total);
  } else if(pan.setPosition) pan.setPosition(Math.cos(angle)*r0, 0.1, Math.sin(angle)*r0);
  const out=actx.createGain(); out.gain.value=0.9;
  src.connect(hp); hp.connect(f1); hp.connect(f2);
  f1.connect(g1); f2.connect(g2); g1.connect(env); g2.connect(env);
  env.connect(out); out.connect(pan); pan.connect(actx.destination);
  src.start(now); src.stop(now+total+0.15);
  duckRain(0.5, total+0.9);
  return total;
}

function drawDigit(d, x, y, c, sc){
  sc = sc||1; const g = DIGITS[d]; if(!g) return;

const BAR_N = 9, SLOT_W = 26, SLOT_GAP = 3;
const BAR_W = BAR_N*SLOT_W + (BAR_N-1)*SLOT_GAP;
const BAR_X = Math.round((W-BAR_W)/2), BAR_Y = H-32;
function slotRect(i){ return {x:BAR_X+i*(SLOT_W+SLOT_GAP), y:BAR_Y, w:SLOT_W, h:SLOT_W}; }
function hitSlot(px,py){
  for(let i=0;i<BAR_N;i++){ const s=slotRect(i);
    if(px>=s.x-1&&px<=s.x+s.w+1&&py>=s.y-2&&py<=s.y+s.h+2) return i; }
  return -1;
}
// ---- the stamina bar: ten squares above the action bar, no numbers ---------
// Genuinely square, 8x8, so the row is 98px and sits well inside the 252px
// action bar rather than shouting over it. Each square fills from its left edge,
// so a third of a nugget is visibly a third.
//
// Drawn AFTER the lighting composite with the rest of the HUD: this is a readout,
// not an object in the world, and it must stay legible in full darkness.
const STAM_SQ = 8, STAM_GAPX = 2;
const STAM_W = STAM_N*STAM_SQ + (STAM_N-1)*STAM_GAPX;
const STAM_X = Math.round(BAR_X + (BAR_W-STAM_W)/2), STAM_Y = BAR_Y - 13;
function drawStamina(){
  // Exhausted: the whole row breathes, which is the only signal that the 30%
  // penalty is on. Nothing else on screen says it.
  const pulse = STAM.tired ? 0.55 + 0.45*Math.sin(t*6.2) : 1;
  for(let i=0;i<STAM_N;i++){
    const x = STAM_X + i*(STAM_SQ+STAM_GAPX);
    rect(x-1, STAM_Y-1, STAM_SQ+2, STAM_SQ+2, 'rgba(6,8,7,0.85)');
    rect(x, STAM_Y, STAM_SQ, STAM_SQ, '#141815');
    const f = Math.max(0, Math.min(1, STAM.c - i));
    if(f > 0){
      const w = Math.max(1, Math.round(STAM_SQ*f));
      const g = STAM.tired
        ? 'rgb('+(70*pulse|0)+','+(120*pulse|0)+','+(84*pulse|0)+')'
        : '#3f8a5c';
      rect(x, STAM_Y, w, STAM_SQ, g);
      rect(x, STAM_Y, w, 1, STAM.tired
        ? 'rgb('+(110*pulse|0)+','+(180*pulse|0)+','+(126*pulse|0)+')'
        : '#5fbe80');
      rect(x, STAM_Y+STAM_SQ-1, w, 1, '#24513a');
    }
    const bc = STAM.tired ? 'rgb('+(90*pulse|0)+','+(70*pulse|0)+','+(60*pulse|0)+')' : '#2b2f2a';
    rect(x, STAM_Y, STAM_SQ, 1, bc);
    rect(x, STAM_Y+STAM_SQ-1, STAM_SQ, 1, bc);
  }
}
