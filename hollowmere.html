const SOUL_HEAL = 40;
function consumeSoul(){
  if(souls<=0 || PL.dead) return false;
  if(PL.hp>=PL.max){ PL.denied=0.5; return false; }
  souls--; PL.hp=Math.min(PL.max, PL.hp+SOUL_HEAL); PL.heal=0.7; sfx('heal');
  return true;
}
// Equipping is an explicit act. Nothing a slot does may destroy what it
// displaces: the outgoing sword/armour lands back in the slot it came from.
function slotAction(i){
  const sl = BACKPACK[i];
  if(!sl) return;
  if(sl.item==='soul'){ consumeSoul(); return; }
  if(sl.item==='lamp'){
    if(lightKind==='lamp') lightKind=null;
    else {
      if(LAMP.c<1){ PL.denied=0.5; sfx('denied'); return; }
      lightKind='lamp';
    }
    embers.length=0; return;
  }
  if(sl.item==='torch'){
    lightKind = (lightKind==='torch') ? null : 'torch';
    embers.length=0; return;
  }
  if(sl.item==='sword'){
    const out = EQUIP.weapon;
    EQUIP.weapon = sl;
    BACKPACK[i] = out.bare ? null : out;   // never stow empty hands as an item
    sfx('swing'); toast(EQUIP.weapon.name+'   '+weaponDmg()+' dmg');
    return;
  }
  if(sl.item==='armor'){
    const out = EQUIP.armor;
    EQUIP.armor = sl;
    BACKPACK[i] = out;              // null when nothing was worn: slot frees
    sfx('pickup'); toast(EQUIP.armor.name+'   +'+EQUIP.armor.armor+' armour');
    return;
  }
  if(sl.item==='bow'){
    const out = SECOND.weapon;
    SECOND.weapon = sl;
    BACKPACK[i] = out;
    sfx('pickup'); toast(SECOND.weapon.name+'   TAB to draw it');
    return;
  }
  // §4 wants the letter readable from the inventory panel, §1 lists it among the
  // inert items. Reading wins: an unreadable letter is a worse bug than a lost
  // blip, and the Tear and Key are still genuinely inert below.
  if(sl.item==='letter'){ readAldricLetter(); return; }
  PL.denied = 0.5; sfx('denied');   // tear, key, rope, sigil: not equippable
}

}

const ORB_R = 24;
const ORB_L = {cx:BAR_X-ORB_R-9, cy:BAR_Y+SLOT_W-ORB_R, fill:1, phase:0,
  hi:[255,110,92], mid:[186,32,32], lo:[74,10,10], glow:[150,30,26]};
const ORB_R2 = {cx:BAR_X+BAR_W+ORB_R+9, cy:BAR_Y+SLOT_W-ORB_R, fill:1, phase:2.1,
  hi:[124,255,158], mid:[26,158,78], lo:[8,58,30], glow:[30,150,80]};
function lerp3(a,b,k){
  return 'rgb('+((a[0]+(b[0]-a[0])*k)|0)+','+((a[1]+(b[1]-a[1])*k)|0)+','+((a[2]+(b[2]-a[2])*k)|0)+')';
}
function drawOrb(o){
  const r=ORB_R, cx=o.cx, cy=o.cy;
  const surf = cy + r - 2*r*Math.max(0,Math.min(1,o.fill));
  for(let dy=-r; dy<=r; dy++) for(let dx=-r; dx<=r; dx++){
    const d = Math.hypot(dx,dy);
    if(d>r) continue;
    const px=cx+dx, py=cy+dy;
    if(d>r-1.5){ rect(px,py,1,1,'#0a0a0c'); continue; }
    if(d>r-4.5){
      const sh=(dx+dy)/(r*2);
      rect(px,py,1,1, sh<-0.18?'#5a5a62': sh>0.2?'#1c1c20':'#3a3a41'); continue;
    }
    const wave = Math.sin(t*1.9+dx*0.26+o.phase)*1.7 + Math.sin(t*3.3+dx*0.15+o.phase)*1.1;
    const top = surf+wave;
    if(py>=top){
      const depth=Math.min(1,(py-top)/(r*1.9));
      let col = depth<0.16 ? lerp3(o.hi,o.mid,depth/0.16) : lerp3(o.mid,o.lo,(depth-0.16)/0.84);
      if(dx<-r*0.30 && dx>-r*0.72 && dy<r*0.1 && dy>-r*0.55 && d<r-6)
        col = lerp3(o.hi,[255,255,255],0.35);
      rect(px,py,1,1,col);
    } else {
      const v = 1-(top-py)/(r*1.6);
      rect(px,py,1,1, v>0.55?'#171a1e':'#0d0f12');
    }
  }
  rect(cx-r*0.42, cy-r*0.66, 5, 2, 'rgba(255,255,255,0.30)');
  rect(cx-r*0.54, cy-r*0.48, 3, 1, 'rgba(255,255,255,0.18)');
  ctx.globalCompositeOperation='lighter';
  const gl=ctx.createRadialGradient(cx,cy,r*0.4,cx,cy,r*1.7);
  const p=0.5+0.5*Math.sin(t*1.4+o.phase);
  gl.addColorStop(0,'rgba('+o.glow[0]+','+o.glow[1]+','+o.glow[2]+','+(0.10+0.05*p).toFixed(3)+')');
  gl.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=gl; ctx.beginPath(); ctx.arc(cx,cy,r*1.7,0,6.3); ctx.fill();
  ctx.globalCompositeOperation='source-over';
}

function drawStealPulse(){
  const p = 0.5+0.5*Math.sin(t*7.5);

  for(let i=0;i<10;i++){

  const vw = (W/WORLD)*(MM_S-4), vh = (H/WORLD)*(MM_S-4);
  const vp = mmPt(cam.x, cam.y);
  ctx.strokeStyle='rgba(180,160,110,0.35)'; ctx.lineWidth=1;
  ctx.strokeRect(Math.round(vp.x)+0.5, Math.round(vp.y)+0.5, Math.round(vw), Math.round(vh));

  const wm = wellMarker();
  if(wm){
    const wp = mmPt(STONES[1].x, STONES[1].y);
    const b2 = Math.round(Math.sin(t*3.2)*1.5);
    rect(wp.x-3, wp.y-9+b2, 7, 10, 'rgba(0,0,0,0.65)');
    rect(wp.x-1, wp.y-8+b2, 2, 5, '#f0d055');
    rect(wp.x-1, wp.y-2+b2, 2, 2, '#f0d055');
  }
  drawShopMinimapMark();   // above the props, below the player dot
  const hm = herbertMarker();
  if(hm){
    const hp2 = mmPt(HERBERT.x, HERBERT.y);
    const b = Math.round(Math.sin(t*3.2)*1.5);
    const c = hm==='!' ? '#f0d055' : '#8fd6f0';
    rect(hp2.x-3, hp2.y-9+b, 7, 10, 'rgba(0,0,0,0.65)');
    if(hm==='!'){
      rect(hp2.x-1, hp2.y-8+b, 2, 5, c);
      rect(hp2.x-1, hp2.y-2+b, 2, 2, c);
    } else {
      rect(hp2.x-2, hp2.y-8+b, 4, 1, c);
      rect(hp2.x+1, hp2.y-7+b, 1, 2, c);
      rect(hp2.x-1, hp2.y-5+b, 2, 1, c);
      rect(hp2.x-1, hp2.y-4+b, 1, 2, c);
      rect(hp2.x-1, hp2.y-1+b, 1, 1, c);
    }
    rect(hp2.x-1, hp2.y+1+b, 2, 1, 'rgba(0,0,0,0.6)');
  }
  const me = mmPt(P.x, P.y);
  const pulse = 0.65+0.35*Math.sin(t*3.4);
  rect(me.x-2, me.y-2, 5, 5, 'rgba(0,0,0,0.7)');
  rect(me.x-1, me.y-1, 3, 3, 'rgb('+(230*pulse|0)+','+(215*pulse|0)+','+(160*pulse|0)+')');
  const fd = [[0,3],[0,-3],[-3,0],[3,0]][P.dir];
  rect(me.x+fd[0], me.y+fd[1], 1, 1, '#e8ddc0');
}

// Character sheet on the left, backpack immediately to its right, both always
// visible. 260 + 10 + 240 = 510 wide, centred in 576 with a 33px margin either
// side. The pack used to overlay the sheet, which meant you could never see what
// you were equipping and what you were equipping it from at the same time.
// IPX 33 -> 22 and the pack 240 -> 268 wide, to fit a 9-across slot grid at
// hotbar scale now that the pack holds 50. 22 + 260 + 10 + 268 = 560 in 576.
const IPX = 22, IPY = 16, IPW = 260, IPH = 316;
// Row pitch tightened 54 -> 46 to fit the new body-armour slot as a 4th row on
// the left without colliding with the portrait or the ARMOR/DMG footer line.
// ARMOUR SITS DIRECTLY UNDER THE WEAPON, and the four garment slots are marked
// fixed. The reported bug was "equipping armour puts it in a non-armour slot":
// the swap logic was always correct, but head/torso/legs/boots are never
// assigned ANYWHERE in this file - they are the starting clothes - and they were
// drawn as interactive slots with the same frame and hover as the real armour
// slot, with `torso` sitting immediately above it. Picking up a chest piece and
// watching it skip the slot named "torso" is indistinguishable from the bug.
const EQ_FIXED = {head:1, torso:1, legs:1, boots:1, pack:1};
// THE TWO LIVE SLOTS ARE ALONE ON THE LEFT, AT FULL SIZE. Putting `torso` -
// which draws a tunic and can never be changed - directly beneath the slot
// labelled BODY meant the sheet showed two chest slots side by side and only
// one of them took your armour. The worn-for-good kit is now a separate,
// visibly smaller column on the right: still there, still counted in ARMOUR,
// but plainly not somewhere you put anything.
const EQ_L = ['weapon','armor'];
const EQ_R = ['head','torso','legs','boots','pack'];
const EQ_SZ = 36, EQ_SZ_R = 26;
function eqRect(col, row){
  return col===0
    ? {x: IPX+14, y: IPY+96+row*46, w:EQ_SZ, h:EQ_SZ}
    : {x: IPX+IPW-14-EQ_SZ_R, y: IPY+96+row*30, w:EQ_SZ_R, h:EQ_SZ_R};
}
const PPX = IPX+IPW+10, PPY = 16, PPW = 268, PPH = 316;
// 9 across at 25px, one pixel under the hotbar's 26 - so the top row of the
// grid is visibly the belt you are already looking at.
const PACK_COLS = 9, PACK_SLOT = 25, PACK_PITCH = 28;
function packRect(i){
  return {x: PPX+10+(i%PACK_COLS)*PACK_PITCH,
          y: PPY+46+((i/PACK_COLS)|0)*PACK_PITCH,
          w: PACK_SLOT, h: PACK_SLOT};
}
const PACK_X = {x:PPX+PPW-26, y:PPY+6, w:19, h:19};
// The secondary weapon, under the backpack grid. The bow lands here on pickup
// and TAB swaps to it; before this it had no home on the sheet at all, so the
// only way to know you were carrying one was the toast. Declared HERE and not
// up with the equipment slots because it is positioned off PPX, which is
// declared below them - putting it there threw at load and killed the file.
const SEC_RECT = {x: PPX+10, y: PPY+236, w:36, h:36};
function inR(px,py,r){ return px>=r.x && px<=r.x+r.w && py>=r.y && py<=r.y+r.h; }
function dropCursor(){
  if(!INV.cursor) return;
  for(let i=0;i<PACK_N;i++) if(!BACKPACK[i]){ BACKPACK[i]=INV.cursor; INV.cursor=null; return; }
  INV.cursor = null;
}

  rect(cx-6,cy-5,3,9,'#2f3039');
}

  rect(cx-6,cy-6,12,12,'#1c1d24'); rect(cx-9,cy-6,3,6,'#1c1d24'); rect(cx+6,cy-6,3,6,'#1c1d24');
  rect(cx-6,cy-6,3,12,'#26272f'); rect(cx-3,cy-8,6,2,'#0d0d10');

}

function drawBootsIcon(cx,cy){

}
function drawPackIcon(cx,cy){
  rect(cx-6,cy-4,13,11,'#4a3820'); rect(cx-5,cy-8,11,4,'#3c2d19');
  rect(cx-3,cy-1,7,5,'#2e2213'); rect(cx-1,cy+1,2,2,'#c9ab68');
  rect(cx-6,cy-4,2,11,'#5c4629'); rect(cx-6,cy+5,13,2,'#37280f');
}
function drawEquipIcon(k,cx,cy){
  if(k==='weapon') drawSwordIcon(cx,cy+1,true,EQUIP.weapon && EQUIP.weapon.art);
  else if(k==='head') drawHoodIcon(cx,cy);
  else if(k==='torso') drawTunicIcon(cx,cy);
  else if(k==='legs') drawTrousersIcon(cx,cy);
  else if(k==='boots') drawBootsIcon(cx,cy);
  else if(k==='pack') drawPackIcon(cx,cy);
  else if(k==='armor'){
    if(EQUIP.armor) drawArmorIcon(cx,cy,EQUIP.armor.art);
    else {
      rect(cx-6,cy-6,12,1,'#2e2a20'); rect(cx-6,cy+5,12,1,'#2e2a20');
      rect(cx-6,cy-6,1,12,'#2e2a20'); rect(cx+5,cy-6,1,12,'#2e2a20');
      rect(cx-1,cy-1,3,3,'#2e2a20');
    }
  }
}
function equipLabel(k){
  const e = EQUIP[k];
  if(k==='armor') return e
    ? e.name+'   +'+e.armor+' armour   —  click to stow'
    : 'Body armour  —  empty. Armour you find or buy goes here.';
  if(EQ_FIXED[k]) return (e?e.name:'')+'   —  worn, cannot be changed';
  if(!e) return '';
  return e.name + (e.armor?'   +'+e.armor+' armour':'')
    + (k==='weapon'?'   '+weaponDmg()+' dmg':'')
    + (k==='pack'?'   (click to open)':'')
    + (k==='armor'?'   (click to remove)':'');
}
function drawPortraitFigure(cx, cy){
  const s = 3;
  const breathe = Math.sin(t*1.15);
  const bob = breathe > 0.35 ? 1 : 0;
  const sway = Math.sin(t*0.62)*1;
  const R = (x,y,w,h,c)=>rect(cx+x*s+sway, cy+y*s-bob*s*0.34, w*s, h*s, c);
  ctx.fillStyle='rgba(0,0,0,0.45)';
  ctx.beginPath(); ctx.ellipse(cx, cy+3, 30, 8, 0, 0, 6.3); ctx.fill();
  R(-5,-6,3,6,PAL_P.lo); R(2,-6,3,6,PAL_P.lo);
  R(-5,-2,5,2,'#0b0a08'); R(2,-2,5,2,'#0b0a08');
  R(-6,-18,12,12,PAL_P.cloak);
  R(-6,-18,3,12,PAL_P.hi); R(3,-18,3,12,PAL_P.fold);
  R(-1,-17,1,10,PAL_P.fold);
  R(-7,-9,14,3,PAL_P.lo);
  R(-6,-11,12,2,PAL_P.trim); R(-1,-11,3,2,'#6b5a3e');
  R(-7,-20,14,3,PAL_P.hi); R(-7,-20,14,1,PAL_P.fold);
  R(-9,-17,3,8,PAL_P.hi); R(-9,-11,3,3,'#0e0d0b');
  R(6,-17,3,8,PAL_P.hi); R(6,-11,3,3,'#0e0d0b');
  R(-6,-27,12,10,PAL_P.cloak); R(-5,-29,10,2,PAL_P.cloak);
  R(-6,-27,3,10,PAL_P.hi); R(-6,-28,12,1,PAL_P.fold);
  R(-4,-24,8,6,PAL_P.skin); R(-4,-24,8,1,'#000000');
  const ep = 0.7+0.3*Math.sin(t*2.1);
  const ec = 'rgb('+(200*ep|0)+','+(44*ep|0)+','+(32*ep|0)+')';
  R(-3,-23,2,2,ec); R(1,-23,2,2,ec);
  R(-11,-13,2,1,GUARD_C);
  R(-11,-12,1,8,STEEL_HI); R(-10,-12,1,8,STEEL);
  R(-11,-4,1,1,'#ffffff');
}
function panel(x,y,w,h,titleH){
  rect(x-3,y-3,w+6,h+6,'#0b0906');
  rect(x,y,w,h,'#17130c');
  const bd='#6a5423', bl='#8a6f34';
  rect(x,y,w,3,bd); rect(x,y+h-3,w,3,bd); rect(x,y,3,h,bd); rect(x+w-3,y,3,h,bd);
  rect(x+1,y+1,w-2,1,bl); rect(x+1,y+h-2,w-2,1,'#3f3116');
  [[0,0],[w-7,0],[0,h-7],[w-7,h-7]].forEach(c=>{
    rect(x+c[0],y+c[1],7,7,'#8a6f34'); rect(x+c[0]+2,y+c[1]+2,3,3,'#4a3a18'); });
  if(titleH){ rect(x+3,y+3,w-6,titleH,'#221a10'); rect(x+3,y+3+titleH,w-6,1,'#3f3116'); }
}
function miniBar(x,y,w,fill,cHi,cLo,label){
  rect(x-2,y-2,w+4,14,'#0b0a08');
  rect(x-2,y-2,w+4,1,'#5a4a26'); rect(x-2,y+11,w+4,1,'#5a4a26');
  rect(x-2,y-2,1,14,'#5a4a26'); rect(x+w+1,y-2,1,14,'#5a4a26');
  rect(x,y,w,10,'#131108');
  const fw=Math.round(w*Math.max(0,Math.min(1,fill)));
  if(fw>0){ rect(x,y,fw,10,cLo); rect(x,y,fw,3,cHi); rect(x,y+9,fw,1,'rgba(0,0,0,0.4)'); }
  ctx.font='9px monospace'; ctx.textBaseline='top';
  ctx.fillStyle='rgba(0,0,0,0.75)';
  ctx.fillText(label, x+Math.round(w/2-label.length*2.7)+1, y+2);
  ctx.fillStyle='#f0e6cc';
  ctx.fillText(label, x+Math.round(w/2-label.length*2.7), y+1);
}
function label(txt, x, y, size, col){
  ctx.font = size+'px monospace'; ctx.textBaseline='top';
  ctx.fillStyle='rgba(0,0,0,0.8)'; ctx.fillText(txt, x+1, y+1);
  ctx.fillStyle=col; ctx.fillText(txt, x, y);
}
function centered(txt, cx, y, size, col){
  ctx.font = size+'px monospace';
  label(txt, Math.round(cx - ctx.measureText(txt).width/2), y, size, col);
}
// Text only. The shield is gone: at 18px it read as a grey smear with a digit
// buried in it, and the word does the job the picture was failing to do. Bold,
// grey, centred above the character.
function drawArmourBadge(cx, cy){
  const txt = 'ARMOR  ' + armorTotal();
  const x = Math.round(cx), y = Math.round(cy);
  ctx.font = 'bold 13px monospace'; ctx.textBaseline = 'top';
  const w = ctx.measureText(txt).width;
  ctx.fillStyle = 'rgba(0,0,0,0.85)'; ctx.fillText(txt, Math.round(x-w/2)+1, y+1);
  ctx.fillStyle = '#b9bfc6';          ctx.fillText(txt, Math.round(x-w/2),   y);
}
function drawInventory(){
  ctx.fillStyle='rgba(4,5,8,0.76)'; ctx.fillRect(0,0,W,H);
  panel(IPX, IPY, IPW, IPH, 20);
  centered(PLAYER_NAME, IPX+IPW/2, IPY+7, 13, '#e5cd8c');
  miniBar(IPX+20, IPY+32, 96, PL.hp/PL.max, '#e8695a', '#8c231b', (PL.hp|0)+' / '+PL.max);
  miniBar(IPX+IPW-20-96, IPY+32, 96, LAMP.c/LAMP.max, '#6fe8a0', '#1c7a46', (LAMP.c|0)+' / '+LAMP.max);
  centered('LEVEL '+LVL, IPX+IPW/2, IPY+52, 11, '#d9bd70');
  const xw=120, xx=IPX+Math.round((IPW-xw)/2);
  rect(xx-1, IPY+68, xw+2, 8, '#0b0a08');
  rect(xx, IPY+69, xw, 6, '#161208');
  rect(xx, IPY+69, Math.round(xw*XP/XPNEED), 6, '#8a6f34');
  rect(xx, IPY+69, Math.round(xw*XP/XPNEED), 2, '#b5934a');
  centered(XP+' / '+XPNEED+' xp', IPX+IPW/2, IPY+80, 9, '#9a8a64');
  // Centred, above the character, between the two equipment columns.
  drawArmourBadge(IPX+IPW/2, IPY+120);
  drawPortraitFigure(IPX+IPW/2, IPY+248);
  INV.hover='';
  [EQ_L,EQ_R].forEach((col,ci)=>col.forEach((k,ri)=>{
    const r=eqRect(ci,ri), fixed=!!EQ_FIXED[k], hov=inR(mouse.x,mouse.y,r);
    rect(r.x-2,r.y-2,r.w+4,r.h+4,'#0b0906');
    // The two slots you can actually change are lit; the fixed garments are sunk
    // and never brighten, so the panel says which is which before you click.
    rect(r.x,r.y,r.w,r.h, fixed ? '#0b0906' : (hov?'#2a2214':'#100d08'));
    const bc = fixed ? '#241f16' : (hov?'#b59446':'#4a3f26');
    rect(r.x,r.y,r.w,2,bc); rect(r.x,r.y+r.h-2,r.w,2,bc);
    rect(r.x,r.y,2,r.h,bc); rect(r.x+r.w-2,r.y,2,r.h,bc);
    drawEquipIcon(k, r.x+r.w/2, r.y+r.h/2);
    if(hov) INV.hover = equipLabel(k);
  }));
  // and the live slots are named, so there is no guessing where a piece goes
  label('WEAPON', eqRect(0,0).x, eqRect(0,0).y-11, 9, '#8a7343');
  label('BODY',   eqRect(0,1).x, eqRect(0,1).y-11, 9, '#8a7343');
  label('WORN',   eqRect(1,0).x-8, eqRect(1,0).y-11, 8, '#5f5742');
  // ARMOUR moved out of this line and onto the badge above the character.
  label('DMG  '+weaponDmg(), IPX+18, IPY+IPH-46, 10, '#c2a86e');
  ctx.font='10px monospace';
  const g1='GOLD '+gold;
  label(g1, IPX+IPW-18-ctx.measureText(g1).width, IPY+IPH-46, 10, '#d6b45e');
  const s1='SOULS '+souls+(tears?'   TEARS '+tears:'')+(shackles?'   SHACKLES '+shackles:'');
  label(s1, IPX+18, IPY+IPH-33, 10, '#8ad4a6');
  ctx.font='10px monospace';
  const e1='EMBERS '+soulEmbers;
  label(e1, IPX+IPW-18-ctx.measureText(e1).width, IPY+IPH-33, 10, '#c98a5a');
  drawPackPanel();                     // always beside the sheet now
  if(INV.hover) centered(INV.hover, PPX+PPW/2, PPY+PPH-34, 9, '#d6c496');
  if(INV.cursor){
    drawItemIcon(INV.cursor.item, mouse.x, mouse.y, true, INV.cursor);
    const cs3 = stackCount(INV.cursor.item);
    if(cs3>0) drawCount(cs3, mouse.x+8, mouse.y+6, stackColour(INV.cursor.item));
  }
}
function drawPackPanel(){
  panel(PPX, PPY, PPW, PPH, 22);
  label('BACKPACK', PPX+14, PPY+8, 12, '#e5cd8c');
  INV.hoverSlot = -1;
  const xh=inR(mouse.x,mouse.y,PACK_X);
  rect(PACK_X.x,PACK_X.y,PACK_X.w,PACK_X.h, xh?'#4a2018':'#241410');
  const xb = xh?'#c98b6a':'#6a5423';
  rect(PACK_X.x,PACK_X.y,PACK_X.w,2,xb); rect(PACK_X.x,PACK_X.y+PACK_X.h-2,PACK_X.w,2,xb);
  rect(PACK_X.x,PACK_X.y,2,PACK_X.h,xb); rect(PACK_X.x+PACK_X.w-2,PACK_X.y,2,PACK_X.h,xb);
  for(let i=4;i<PACK_X.w-4;i++){
    rect(PACK_X.x+i, PACK_X.y+i, 2, 2, '#e0b09a');
    rect(PACK_X.x+PACK_X.w-2-i, PACK_X.y+i, 2, 2, '#e0b09a');
  }
  for(let i=0;i<PACK_N;i++){
    const r=packRect(i), sl=BACKPACK[i], hov=inR(mouse.x,mouse.y,r);
    if(hov) INV.hoverSlot = i;
    const canEquip = hov && sl && !!EQUIPPABLE[sl.item];
    rect(r.x-2,r.y-2,r.w+4,r.h+4,'#0b0906');
    rect(r.x,r.y,r.w,r.h, hov?'#2a2214':'#0f0c08');
    const bc = canEquip?'#d8b45c':hov?'#b59446':(i<9?'#4a3f26':'#332c1c');
    rect(r.x,r.y,r.w,2,bc); rect(r.x,r.y+r.h-2,r.w,2,bc);
    rect(r.x,r.y,2,r.h,bc); rect(r.x+r.w-2,r.y,2,r.h,bc);
    if(i<9) drawDigit(i+1, r.x+4, r.y+4, '#665c44');
    if(sl){
      drawItemIcon(sl.item, r.x+r.w/2, r.y+r.h/2, true, sl);
      const stack = stackCount(sl.item);
      if(stack>0)
        drawCount(stack, r.x+r.w-7-String(stack).length*4, r.y+r.h-11, stackColour(sl.item));
      if(hov) INV.hover = packLabel(sl)
        + (EQUIPPABLE[sl.item] ? '     [E] equip' : '');
    }
  }
  drawSecondarySlot();
  label('hover + E to equip  ·  or drag onto a slot', PPX+14, PPY+PPH-20, 8, '#7a6a4c');
}
function drawSecondarySlot(){
  const r = SEC_RECT, hov = inR(mouse.x, mouse.y, r);
  const live = !!SECOND.weapon;
  rect(PPX+10, r.y-16, PPW-20, 1, '#2a2418');           // a rule off the grid
  label('SECONDARY', PPX+10, r.y-13, 9, '#8a7343');

  rect(r.x, r.y, r.w, r.h, hov?'#2a2214':'#100d08');
  // it glows while it is the weapon in hand, so TAB has a visible state
  const bc = bowActive() ? '#d8b45c' : hov ? '#b59446' : live ? '#4a3f26' : '#332c1c';
  rect(r.x, r.y, r.w, 2, bc); rect(r.x, r.y+r.h-2, r.w, 2, bc);
  rect(r.x, r.y, 2, r.h, bc); rect(r.x+r.w-2, r.y, 2, r.h, bc);
  if(live) drawItemIcon(SECOND.weapon.item, r.x+r.w/2, r.y+r.h/2, bowActive(), SECOND.weapon);
  else {
    rect(r.x+8, r.y+8, r.w-16, 1, '#2e2a20');           // an empty-slot cross

    ? SECOND.weapon.name+'   '+SECOND.weapon.dmg+' dmg   —  click to stow'

// One place that knows which items stack and what their counter looks like, so
// adding shackles did not mean editing four separate ternaries.
function stackCount(kind){
  return kind==='soul' ? souls : kind==='tear' ? tears : kind==='shackle' ? shackles : 0;
}
function stackColour(kind){
  return kind==='tear' ? '#a8dcec' : kind==='shackle' ? '#b9b3a2' : '#9ee0b6';
}
function packLabel(sl){
  const n = sl.name || ITEM_NAMES[sl.item] || '';
  if(sl.item==='shackle') return n+'   x'+shackles+'   Ondrick pays '+SELL_PRICES.shackle+'g each';
  if(sl.item==='sword') return n+'   '+(sl.dmg+edgeBonus)+' dmg   (equip)';
  if(sl.item==='armor') return n+'   +'+sl.armor+' armour   (equip)';
  if(sl.item==='tear')  return n+'   worthless to you. Ondrick pays 5g.';
  if(sl.item==='letter')return n+'   (read it in the journal)';
  if(sl.item==='key')   return n+'   opens the grate below';
  if(sl.item==='soul')  return n+'   restores '+SOUL_HEAL+' vigour';
  if(sl.item==='sigil') return n+'   It pulses with a strange energy';

}
// Which equipment slot, if any, accepts this item kind.
function equipSlotFor(kind){
  if(kind==='sword') return 'weapon';
  if(kind==='armor') return 'armor';
  if(kind==='bow') return 'second';
  return null;
}
// Drop the held cursor item onto an equipment slot. Swaps rather than discards,
// exactly like activating the slot does.
function dropOnEquip(slotKey){
  const held = INV.cursor;
  if(!held) return false;
  if(equipSlotFor(held.item) !== slotKey){
    PL.denied=0.5; sfx('denied');
    // Say WHERE it goes rather than just refusing. Dropping a chest piece on the
    // slot marked "torso" is the most natural mistake the panel invites.
    if(held.item==='armor' && EQ_FIXED[slotKey]) toast('Armour goes in the BODY slot');
    return false;
  }
  if(slotKey==='weapon'){
    const out = EQUIP.weapon;
    EQUIP.weapon = held;
    INV.cursor = out.bare ? null : out;    // same rule as the slot-activate path
    sfx('swing'); toast(EQUIP.weapon.name+'   '+weaponDmg()+' dmg');
  } else {
    const out = EQUIP.armor;
    EQUIP.armor = held; INV.cursor = out;   // null if nothing was worn
    sfx('pickup'); toast(EQUIP.armor.name+'   +'+EQUIP.armor.armor+' armour');
  }
  if(!INV.cursor) INV.cursor = null;
  return true;
}
// E over a hovered pack slot equips or uses it, without picking it up first.
function equipHovered(){
  if(!INV.open) return false;
  const i = INV.hoverSlot;
  if(i == null || i < 0) return false;
  if(INV.cursor) return false;            // hands full: place it first
  if(!BACKPACK[i]) return false;
  slotAction(i);
  return true;
}
function invClick(px,py){
  if(inR(px,py,PACK_X)){ INV.open=false; INV.pack=false; dropCursor(); return; }
  if(inR(px,py,SEC_RECT)){
    if(INV.cursor) dropOnSecondary();
    else unequipSecondary();
    return;
  }
  // equipment slots: drop-to-equip when carrying, click-to-remove when not
  const eqHit = [[EQ_L,0],[EQ_R,1]].reduce((acc,pair)=>{
    if(acc) return acc;
    const col=pair[0], ci=pair[1];
    for(let ri=0;ri<col.length;ri++) if(inR(px,py,eqRect(ci,ri))) return col[ri];
    return null;
  }, null);
  if(eqHit){
    if(INV.cursor){ dropOnEquip(eqHit); return; }
    if(eqHit==='armor'){ unequipArmor(); return; }
    if(eqHit==='weapon'){ unequipWeapon(); return; }
    PL.denied=0.5; sfx('denied');     // a fixed garment: say so instead of nothing
    toast('Worn for good — cannot be removed');
    return;
  }
  for(let i=0;i<PACK_N;i++) if(inR(px,py,packRect(i))){ pickPlace(i); return; }
  const hs=hitSlot(px,py); if(hs>=0){ pickPlace(hs); return; }
}
function unequipWeapon(){
  // Already empty-handed: there is nothing to stow. Without this the placeholder
  // itself went into the pack, which was the third way to mint a phantom sword.
  if(EQUIP.weapon.bare){ PL.denied=0.5; sfx('denied'); toast('Your hands are already empty'); return; }
  const i = packFree();
  if(i<0){ refusePickup(); return; }
  BACKPACK[i] = EQUIP.weapon;
  EQUIP.weapon = BARE_HANDS;               // the shared sentinel, not a new item
  sfx('pickup'); toast('Weapon stowed — you are unarmed');
}
function unequipArmor(){
  if(!EQUIP.armor){ PL.denied=0.5; sfx('denied'); return; }
  const i = packFree();
  if(i<0){ refusePickup(); return; }
  BACKPACK[i] = EQUIP.armor; EQUIP.armor = null;
  sfx('pickup'); toast('Armour stowed');
}

function wrapText(txt, maxW, font){
  ctx.font = font;
  const words = txt.split(' '), lines = [];
  let cur = '';
  words.forEach(w=>{
    const test = cur ? cur+' '+w : w;
    if(ctx.measureText(test).width > maxW && cur){ lines.push(cur); cur = w; }
    else cur = test;
  });
  if(cur) lines.push(cur);
  return lines;
}
function startDialogue(npc, name, pages, dots){
  dialogue = {npc, name, pages, pi:0, age:0, dots:!!dots, choice:null,
    scroll:0, userScrolled:false};
  syncChoice();
}
function syncChoice(){
  const pg = dialogue.pages[dialogue.pi];
  dialogue.choice = (pg && pg.choice) ? pg.choice : null;
}
function advanceDialogue(){
  if(!dialogue || dialogue.choice) return;
  const pg = dialogue.pages[dialogue.pi];
  const full = pg && pg.text ? pg.text.length : 0;
  if(!dialogue.dots && dialogue.age*44 < full){ dialogue.age = full/44 + 0.05; return; }
  // If there is still text below the fold, the first E scrolls to the end
  // rather than skipping past unread lines.
  if(!dialogue.dots && (dialogue.scroll||0) < dialogueMaxScroll()){
    dialogue.scroll = dialogueMaxScroll(); dialogue.userScrolled = true; return;
  }
  dialogue.pi++;
  dialogue.age = 0;
  dialogue.scroll = 0; dialogue.userScrolled = false;
  if(dialogue.pi >= dialogue.pages.length){
    const end = dialogue.onEnd; dialogue = null;
    if(end) end();
    return;
  }
  syncChoice();
}
// Anchored under the text block rather than off the box bottom. The old form
// put a third option 10px BELOW the frame; laid out from the top of the choice
// region, any number of them stays inside it.
function choiceRects(){
  const b = dlgBox();

  return dialogue.choice.map((o,i)=>({x:b.x+22, y:top+i*15, w:b.w-44, h:14, opt:o, i}));
}
function pickChoice(i){
  if(!dialogue || !dialogue.choice) return;
  const o = dialogue.choice[i];
  if(!o) return;
  const fn = o.fn;
  if(o.close !== false){ dialogue = null; }
  if(fn) fn();
}
function choiceClick(px, py){

// hands over the Sewer Key - which is why the key is no longer in Ondrick's

function deliverSigil(){
  // HE WILL NOT TAKE IT. He used to take the sigil off the player and keep it,
  // which closed the thread on the spot; now he recoils, and the player leaves
  // still carrying it. The key is still his to give - that was never about the
  // sigil, it was about his brother - so progression is untouched.
  startDialogue(HERBERT, 'Herbert', [
    {text:'A sigil? Yes, yes, I knew one of these...Keep it away from me'},
    {text:'Do not bring it into my house. Do not set it on my table. I have seen its like before and I have no wish to learn any more than I already know.'},
    {text:'You have done what was asked and more. The bones are down. Whatever that thing is, it is yours to carry, and I am sorry for it.'},
    {text:'Take this. It was my brothers, and it opens the old grate below the undercroft - the run beneath the run. He went down there once. He came back up wrong, and then he did not come back up at all.'},
    {text:'If you go, go with the lamp lit. And do not take anything that is offered to you down there.'}
  ]);
  dialogue.onEnd = ()=>{
    SIGIL.known = true;                 // he named it; it is a sigil from here on
    toast('The sigil shivers in your pocket, emanating a strange energy');

// It was a fixed 140px - 39% of a 360px screen - whether the page was a long
// paragraph or a single "...". Now it SIZES TO ITS CONTENT and caps at
// DLG_MAXVIS lines, leaning on the scroll already wired to the wheel, the
// arrows and E. A "..." beat is 62px now instead of 140.
const DLG_LINE = 14, DLG_TOP = 36, DLG_PAD = 16, DLG_MAXVIS = 4;
function dlgVis(){
  if(!dialogue) return DLG_MAXVIS;
  const n = dialogueLines().length || 1;
  // Choices come out of the same budget: a page carrying them shows fewer lines
  // and scrolls the rest, rather than growing the box to fit both. Nothing in
  // the game ships more than two, but three would otherwise push the box back
  // past the old height, so they cost another line.
  const budget = !dialogue.choice ? DLG_MAXVIS : (dialogue.choice.length>=3 ? 1 : 2);
  return Math.max(1, Math.min(budget, n));
}
function dlgChoiceH(){ return dialogue && dialogue.choice ? dialogue.choice.length*15+8 : 0; }
function dlgH(){
  if(!dialogue || dialogue.dots) return 62;
  // no E prompt is drawn on a choice page, so it needs less room at the foot
  return DLG_TOP + dlgVis()*DLG_LINE + dlgChoiceH() + (dialogue.choice?12:DLG_PAD);
}
function dlgBox(){ const bh = dlgH(); return {x:52, y:H-bh-56, w:W-104, h:bh}; }
function dialogueLines(){
  if(!dialogue) return [];
  const pg = dialogue.pages[dialogue.pi];
  if(!pg || !pg.text) return [];
  return wrapText(pg.text, W-104-40, '12px monospace');
}
function dialogueMaxScroll(){
  return Math.max(0, dialogueLines().length - dlgVis());
}
function scrollDialogue(d){
  if(!dialogue || dialogue.dots) return;
  const max = dialogueMaxScroll();
  if(max<=0) return;
  dialogue.scroll = Math.max(0, Math.min(max, (dialogue.scroll||0) + d));
  dialogue.userScrolled = true;      // stop auto-following once they take over
}
function drawDialogue(){
  const b=dlgBox(), bx=b.x, bw=b.w, bh=b.h, by=b.y;
  const VIS=dlgVis();
  rect(bx-2,by-2,bw+4,bh+4,'rgba(4,4,6,0.85)');
  rect(bx,by,bw,bh,'rgba(9,10,13,0.95)');
  const bd='#4a4234';
  rect(bx,by,bw,2,bd); rect(bx,by+bh-2,bw,2,bd);
  rect(bx,by,2,bh,bd); rect(bx+bw-2,by,2,bh,bd);
  rect(bx+2,by+2,bw-4,1,'#16150f');
  label(dialogue.name.toUpperCase(), bx+16, by+11, 12, '#c2a86e');
  rect(bx+16, by+29, 78, 1, '#3a3324');
  const pg = dialogue.pages[dialogue.pi];
  if(dialogue.dots){
    const n=Math.min(3,Math.floor(dialogue.age*3.2));
    for(let i=0;i<n;i++) rect(bx+17+i*10, by+46, 4, 4, '#bfae8c');
  } else if(pg && pg.text){
    const font='12px monospace';
    const lines=dialogueLines();
    const total=Math.floor(dialogue.age*44);
    // which line the typewriter is currently on
    let acc=0, typing=0;
    for(let i=0;i<lines.length;i++){
      if(total <= acc+lines[i].length){ typing=i; break; }
      acc+=lines[i].length; typing=i;
    }
    const max=Math.max(0, lines.length-VIS);
    if(!dialogue.userScrolled)
      dialogue.scroll = Math.max(0, Math.min(max, typing-VIS+1));
    const top = Math.max(0, Math.min(max, dialogue.scroll||0));
    ctx.font=font; ctx.textBaseline='top';
    let ly=by+DLG_TOP;
    let before=0;
    for(let i=0;i<top;i++) before+=lines[i].length;
    let shown=total-before;
    for(let i=top; i<Math.min(lines.length, top+VIS); i++){
      if(shown<=0) break;
      const part=lines[i].slice(0, shown);
      ctx.fillStyle='rgba(0,0,0,0.8)'; ctx.fillText(part, bx+19, ly+1);
      ctx.fillStyle='#ddd2b6'; ctx.fillText(part, bx+18, ly);
      shown-=lines[i].length; ly+=DLG_LINE;
    }
    // scrollbar, only when there is something to scroll to
    if(max>0){
      const tx=bx+bw-11, ty=by+DLG_TOP-2, th=VIS*DLG_LINE;
      rect(tx, ty, 3, th, '#1a1810');
      const kh=Math.max(8, Math.round(th*VIS/lines.length));
      const kp=Math.round((th-kh)*(top/max));
      rect(tx, ty+kp, 3, kh, '#6a5c42');
      rect(tx, ty+kp, 3, 1, '#8a7a58');
      // a nudge that there is more below, while the player has not scrolled
      if(top<max && Math.sin(t*4)>0){
        rect(tx-4, ty+th+3, 3, 1, '#8a7a58');
        rect(tx-3, ty+th+4, 1, 1, '#8a7a58');
      }
    }
  }
  if(dialogue.choice){
    choiceRects().forEach((r,i)=>{
      const hov=inR(mouse.x,mouse.y,r);
      rect(r.x-4, r.y-1, r.w+8, r.h, hov?'rgba(58,48,26,0.9)':'rgba(20,18,12,0.7)');
      if(hov){ rect(r.x-4,r.y-1,r.w+8,1,'#8a7343'); rect(r.x-4,r.y+r.h-2,r.w+8,1,'#8a7343'); }
      drawDigit(i+1, r.x-1, r.y+3, hov?'#e8cd88':'#8a7d5c');
      label(r.opt.label, r.x+12, r.y+1, 11, hov?'#f0e2bc':'#b8ab8c');
    });
  } else if(dialogue.age>1.0){
    const a=Math.sin(t*3)>0?'#6a5c42':'#3a3225';
    rect(bx+bw-24,by+bh-18,8,3,a); rect(bx+bw-23,by+bh-15,6,3,a); rect(bx+bw-22,by+bh-12,3,3,a);
    label('E', bx+bw-38, by+bh-20, 10, a);
  }
}

function drawLighting(tp){
  lctx.globalCompositeOperation='source-over';
  lctx.fillStyle='#04050a'; lctx.fillRect(0,0,W,H);
  lctx.globalCompositeOperation='destination-out';
  const kind = tp && tp.kind;
  const flick = kind==='lamp'
    ? 1+Math.sin(t*2.6)*0.045+Math.sin(t*5.9)*0.022
    : 1+Math.sin(t*8.3)*0.035+Math.sin(t*17.1)*0.02+Math.sin(t*3.3)*0.03;
  const dK = whisper ? (1-0.13*Math.min(1,whisper.age*1.5)) : 1;
  const dJ = whisper ? 1+Math.sin(t*21.7)*0.03+Math.sin(t*13.1)*0.025 : 1;
  // Thy Flame Shines Brighter scales the radius HERE, once, at the composite,
  // so every carve, tint and reveal downstream agrees on how far the light goes.
  const BASE = (kind==='lamp' ? LAMP_R : TORCH_R) * lightScale();
  const R = kind ? BASE*flick*dK*dJ : 0;
  const carve=(x,y,r,a0,a1)=>{
    const g=lctx.createRadialGradient(x,y,1,x,y,r);
    g.addColorStop(0,'rgba(255,255,255,'+a0+')');
    g.addColorStop(0.5,'rgba(255,255,255,'+a1+')');
    g.addColorStop(1,'rgba(255,255,255,0)');
    lctx.fillStyle=g; lctx.beginPath(); lctx.arc(x,y,r,0,6.3); lctx.fill();
  };
  if(kind){
    const g=lctx.createRadialGradient(tp.x,tp.y,6,tp.x,tp.y,R);
    g.addColorStop(0,'rgba(255,255,255,1)'); g.addColorStop(0.30,'rgba(255,255,255,0.93)');
    g.addColorStop(0.58,'rgba(255,255,255,0.55)'); g.addColorStop(0.82,'rgba(255,255,255,0.18)');
    g.addColorStop(1,'rgba(255,255,255,0)');
    lctx.fillStyle=g; lctx.beginPath(); lctx.arc(tp.x,tp.y,R,0,6.3); lctx.fill();
  }
  if(AREA.name==='house') drawHouseLight();
  if(AREA.name==='shop') drawShopLight();
  if(AREA.name==='undercroft'){
    UNDER_TORCHES.forEach(b=>{
      const bx=b.x-cam.x, by=b.y-cam.y-14;
      if(bx<-90||bx>W+90||by<-90||by>H+90) return;
      carve(bx, by, 34*(1+Math.sin(t*4.1+b.ph)*0.07), 0.42, 0.16);
    });
    const sx2=SHAFT.x-cam.x, sy2=SHAFT.y-cam.y-16;
    carve(sx2, sy2, 76, 0.58, 0.22);
    // A small pool at the gate so the ironwork reads once you are on top of it.
    // Deliberately r20 and dim: enough to see the lock when you are there, not
    // enough to spot the door from across the chamber.
    const gx2=SEWER_GRATE.x-cam.x, gy2=SEWER_GRATE.y-cam.y-8;
    if(gx2>-60&&gx2<W+60&&gy2>-60&&gy2<H+60) carve(gx2, gy2, 20, 0.26, 0.10);
  }
  if(AREA.name==='sewer'){
    // Dimmer and smaller than the undercroft's: r26 at 0.30 against r34 at 0.42.
    // Three of them in the whole level. This is where the lamp has to earn its
    // keep and where the 25g key has to feel like it bought you something.
    SEWER_TORCHES.forEach(b=>{
      const bx=b.x-cam.x, by=b.y-cam.y-12;
      if(bx<-90||bx>W+90||by<-90||by>H+90) return;
      carve(bx, by, 26*(1+Math.sin(t*4.4+b.ph)*0.08), 0.30, 0.11);
    });
    carve(SEWER_SHAFT.x-cam.x, SEWER_SHAFT.y-cam.y+14, 44, 0.30, 0.10);
    carve(DEEP_GATE.x-cam.x, DEEP_GATE.y-cam.y+14, 30, 0.26, 0.09);
  }
  if(AREA.name==='sewer2'){
    // Dimmer again than the run above: four torches in the whole level, and the
    // hall is deliberately the darkest room in the game.
    SEWER2_TORCHES.forEach(b=>{
      const bx=b.x-cam.x, by=b.y-cam.y-12;
      if(bx<-90||bx>W+90||by<-90||by>H+90) return;
      carve(bx, by, 24*(1+Math.sin(t*4.4+b.ph)*0.08), 0.28, 0.10);
    });
    carve(SEWER2_ENTRY.x-cam.x, SEWER2_ENTRY.y-cam.y+14, 34, 0.28, 0.10);
    // his eyes throw just enough light to find him by
    if(hunterAlive() && HUNTER.seen)
      carve(HUNTER.x-cam.x, HUNTER.y-cam.y-28, 20, 0.22, 0.08);
  }
  if(AREA.name==='village') BRAZIERS.forEach(b=>{
    const bx=b.x-cam.x, by=b.y-cam.y-24;
    if(bx<-100||bx>W+100||by<-100||by>H+100) return;
    carve(bx, by, 51*(1+Math.sin(t*6.1+b.ph)*0.05), 0.80, 0.32);
  });
  const pf=STONES[0], pfx=pf.x-cam.x, pfy=pf.y-cam.y;
  if(AREA.name==='village')
  if(pfx>-140&&pfx<W+140&&pfy>-140&&pfy<H+140)
    carve(pfx, pfy-6, 69*(1+Math.sin(t*4.7)*0.06), 0.85, 0.35);
  if(AREA.name==='village') HOUSES.forEach(h=>{ if(!h.lit) return;
    [h.x-cam.x+17, h.x-cam.x+h.w-17].forEach(wx=>{
      const wy=h.y-cam.y+h.h*0.62+11;
      if(wx<-90||wx>W+90||wy<-90||wy>H+90) return;
      carve(wx, wy, 39, 0.55, 0.2); }); });
  if(AREA.name==='village') GHOSTS.forEach(g=>{ const a=ghostAlpha(g);
    if(a<=0.02) return;
    carve(g.x-cam.x, g.y-cam.y-24, 24, (0.34*a).toFixed(3), (0.15*a).toFixed(3)); });
  DROPS.forEach(d=>{
    const dx=d.x-cam.x, dy=d.y-cam.y-3;

    carve(dx, dy, 24*(0.85+0.15*Math.sin(d.age*2.6+d.ph)), 0.62, 0.25); });

  // them out of the ground instead of swallowing them. Half the reach of a drop.
  notesHere().forEach(n=>{

    const nx2=n.x-cam.x, ny2=n.y-cam.y-3;
    if(nx2<-40||nx2>W+40||ny2<-40||ny2>H+40) return;
    carve(nx2, ny2, 13, 0.30, 0.12); });
  const cl=cleaveTip();
  if(cl) [[cl.tx,cl.ty,45,0.92],[cl.mx,cl.my,33,0.62]].forEach(v=>

  ctx.globalCompositeOperation='source-over';
  ctx.drawImage(light,0,0);

  const tint=(x,y,r,c0,c1)=>{

  if(kind) tint(tp.x, tp.y, R*0.95,

  if(AREA.name==='village') BRAZIERS.forEach(b=>{

  if(AREA.name==='house') drawHouseLight();

  }
  if(AREA.name==='undercroft'){
    UNDER_TORCHES.forEach(b=>{
      const bx=b.x-cam.x, by=b.y-cam.y-14;
      if(bx<-80||bx>W+80||by<-80||by>H+80) return;

    tint(SHAFT.x-cam.x, SHAFT.y-cam.y-16, 78, 'rgba(66,84,120,0.26)','rgba(20,28,46,0)');

  if(AREA.name==='sewer'){
    SEWER_TORCHES.forEach(b=>{

    tint(SEWER_SHAFT.x-cam.x, SEWER_SHAFT.y-cam.y+14, 46, 'rgba(52,70,104,0.20)','rgba(16,24,40,0)');
  }
  if(AREA.name==='sewer2'){
    SEWER2_TORCHES.forEach(b=>{
      const bx=b.x-cam.x, by=b.y-cam.y-12;
      if(bx<-80||bx>W+80||by<-80||by>H+80) return;
      tint(bx,by,26,'rgba(22,72,104,0.24)','rgba(6,20,34,0)'); });
    tint(SEWER2_ENTRY.x-cam.x, SEWER2_ENTRY.y-cam.y+14, 36, 'rgba(52,70,104,0.18)','rgba(16,24,40,0)');
    // the only green light in the game, and it is looking at you
    if(hunterAlive() && HUNTER.seen)
      tint(HUNTER.x-cam.x, HUNTER.y-cam.y-28, 26, 'rgba(40,170,96,0.26)','rgba(10,48,26,0)');
  }
  if(AREA.name==='road'){
    // Two torches flanking the gate - the only fire on the whole road, and what

      const bx=b.x-cam.x, by=b.y-cam.y-38;
      if(bx<-100||bx>W+100||by<-100||by>H+100) return;
      tint(bx, by, 58, 'rgba(150,92,30,0.34)','rgba(40,20,6,0)'); });
    // the sealed runes throw a little of their own red back onto the boards
    const rz = RUIN.y-cam.y+RUIN.h-16;
    if(rz>-90 && rz<H+90)
      tint(RUIN.x-cam.x+RUIN.w/2, rz, 34,
        'rgba(150,26,20,'+(0.17+0.10*Math.sin(t*1.9)).toFixed(3)+')','rgba(40,6,6,0)');
  }
  if(AREA.name==='village') GHOSTS.forEach(g=>{ const a=ghostAlpha(g); if(a<=0.02) return;
    tint(g.x-cam.x, g.y-cam.y-24, 26, 'rgba(46,150,92,'+(0.30*a).toFixed(3)+')','rgba(12,50,28,0)'); });
  DROPS.forEach(d=>{
    const dx=d.x-cam.x, dy=d.y-cam.y-3;
    if(dx<-60||dx>W+60||dy<-60||dy>H+60) return;
    if(d.kind==='tear') tint(dx,dy,26,'rgba(64,150,190,0.30)','rgba(14,42,60,0)');
    else tint(dx,dy,26,'rgba(52,168,102,0.30)','rgba(12,50,28,0)'); });
  if(cl) tint(cl.tx, cl.ty, 45, 'rgba(96,116,140,'+(0.42*cl.fade).toFixed(3)+')','rgba(40,52,68,0)');
  ctx.globalCompositeOperation='source-over';
}

// LIGHTING LAYER: AFTER the composite, deliberately. Everything else on the
// ground obeys the dark; a Crystalized Tear does not. It is a crystallised
// soul, and the design wants it findable from across a black room. It still
// gets a small pre-composite carve so the floor under it is lit too - the
// post-composite pass is only the self-luminous core and its motes.
function drawTearShimmer(){
  for(let i=0;i<DROPS.length;i++){
    const d = DROPS[i];
    if(d.kind!=='tear') continue;
    const x=Math.round(d.x-cam.x), y=Math.round(d.y-cam.y)-2;
    if(x<-24||x>W+24||y<-24||y>H+24) continue;
    const pu=0.5+0.5*Math.sin(d.age*2.3+d.ph);
    const rr=13+3*pu;
    ctx.globalCompositeOperation='lighter';
    const g=ctx.createRadialGradient(x,y,1,x,y,rr);
    g.addColorStop(0,'rgba(150,214,238,'+(0.34+0.18*pu).toFixed(3)+')');
    g.addColorStop(1,'rgba(40,92,124,0)');
    ctx.fillStyle=g; ctx.beginPath(); ctx.arc(x,y,rr,0,6.3); ctx.fill();
    ctx.globalCompositeOperation='source-over';
    rect(x-1, y-3, 2, 2, 'rgba(230,250,255,'+(0.55+0.45*pu).toFixed(2)+')');
    for(let k=0;k<3;k++){
      const a=d.age*1.6+k*2.09+d.ph;
      rect(x+Math.cos(a)*7, y+Math.sin(a)*4-1, 1, 1,
        'rgba(180,232,248,'+(0.28+0.34*pu).toFixed(2)+')');
    }
  }
}
function hurtPlayer(dmg){
  if(PL.dead) return;
  dmg = Math.max(1, dmg - armorTotal());
  PL.hp = Math.max(0, PL.hp - dmg);
  PL.hurt = 0.55; camShake = Math.max(camShake, 1.7);
  sfx('hurt');
  if(PL.hp<=0){ PL.dead=true; PL.deadT=0; }
}
// Straight-line walkability check, sampled every ~10px. Not pathfinding - just
// enough to stop a wanderer picking a spot on the far side of a house and then
// grinding into the wall for the next minute.
function losClear(x0, y0, x1, y1, r){
  const d = Math.hypot(x1-x0, y1-y0);
  const n = Math.max(2, Math.ceil(d/10));
  for(let i=1;i<=n;i++){
    const f=i/n;
    if(blocked(x0+(x1-x0)*f, y0+(y1-y0)*f, r)) return false;
  }
  return true;
}
function pickTarget(o, radius){
  // Was clamped to WORLD (1200) in every area, which quietly pinned wandering
  // for anything east of x=1150 in the 1850-wide undercroft. Clamp per area.
  const AW = areaW(), AH = areaH();
  let fallback = null;
  for(let k=0;k<18;k++){
    const a=Math.random()*6.283, r=30+Math.random()*radius;
    const tx=Math.max(24,Math.min(AW-24,o.hx+Math.cos(a)*r));
    const ty=Math.max(24,Math.min(AH-24,o.hy+Math.sin(a)*r));
    if(AREA.name==='village' && Math.hypot(tx-HERBERT.x, ty-HERBERT.y) < 58) continue;
    if(blocked(tx,ty,8)) continue;
    if(!fallback) fallback={tx,ty};
    if(losClear(o.x, o.y, tx, ty, 7)){ o.tx=tx; o.ty=ty; return true; }
  }
  if(fallback){ o.tx=fallback.tx; o.ty=fallback.ty; return true; }
  // Last resort used to be home, which can itself be unreachable from here and
  // produces exactly the permanent grind we are fixing. Aim somewhere we can
  // actually walk to from where we are standing right now.
  for(let k=0;k<24;k++){
    const a=Math.random()*6.283, r=16+Math.random()*70;
    const tx=Math.max(24,Math.min(AW-24,o.x+Math.cos(a)*r));
    const ty=Math.max(24,Math.min(AH-24,o.y+Math.sin(a)*r));
    if(!blocked(tx,ty,8) && losClear(o.x,o.y,tx,ty,7)){ o.tx=tx; o.ty=ty; return true; }
  }
  o.tx=o.x; o.ty=o.y; return false;
}
// Failsafe: if anything ends up inside geometry (spawn, knockback, a shifting
// solid), spiral outward until it finds air rather than freezing forever.
function unstick(o, r){
  if(!blocked(o.x, o.y, r)) return false;
  for(let ring=4; ring<=64; ring+=4){
    for(let k=0;k<16;k++){
      const a = k*0.3927 + ring*0.7;
      const x = o.x+Math.cos(a)*ring, y = o.y+Math.sin(a)*ring;
      if(!blocked(x,y,r)){ o.x=x; o.y=y; return true; }
    }
  }
  return false;
}
// Steps o toward (ux,uy) and returns the distance ACTUALLY covered.
// The old inline version set moved=true whenever an assignment happened, but for
// axis-aligned travel the cross-axis candidate equals the current coordinate and
// is therefore always walkable - so "moved" was true while the entity stood
// still, and no stall was ever detected. Measuring displacement fixes that.
// On a stall it tries sliding both ways along the wall, not just one.
function moveEntity(o, ux, uy, step, r){
  const px=o.x, py=o.y;
  if(!blocked(o.x+ux*step, o.y, r)) o.x += ux*step;
  if(!blocked(o.x, o.y+uy*step, r)) o.y += uy*step;
  let gained = Math.hypot(o.x-px, o.y-py);
  if(gained < step*0.35){
    o.x=px; o.y=py;
    const slides = [[-uy,ux],[uy,-ux]];
    for(let i=0;i<slides.length;i++){
      const sx=px+slides[i][0]*step*1.15, sy=py+slides[i][1]*step*1.15;
      if(!blocked(sx,sy,r)){ o.x=sx; o.y=sy; gained=Math.hypot(o.x-px,o.y-py); break; }
    }
  }
  return gained;
}
// Two independent watchdogs: a short one for "not moving", and a long one for
// "moving but never getting closer" - the sliding-forever case the old timer
// could not see because sliding counts as movement.
function trackStall(o, distToTarget, gained, step, dt){
  if(o.bestD === undefined || distToTarget < o.bestD - 1){ o.bestD = distToTarget; o.noProg = 0; }
  else o.noProg = (o.noProg||0) + dt;
  if(gained < step*0.35) o.stuck = (o.stuck||0) + dt;
  else o.stuck = Math.max(0, (o.stuck||0) - dt*2);
  if(o.stuck > 0.6 || o.noProg > 3){
    o.stuck = 0; o.noProg = 0; o.bestD = undefined;
    return true;
  }
  return false;
}
function updateNPC(n, dt){
  if(unstick(n,7)){ n.stuck=0; n.noProg=0; n.bestD=undefined; pickTarget(n,110); }
  if(n.wait>0){ n.wait-=dt; n.moving=false; return; }
  const dx=n.tx-n.x, dy=n.ty-n.y, d=Math.hypot(dx,dy);
  if(d<4){ n.wait=1+Math.random()*4; n.moving=false;
    n.stuck=0; n.noProg=0; n.bestD=undefined; pickTarget(n,110); return; }
  const ux=dx/d, uy=dy/d;
  const step=n.spd*dt;
  const gained = moveEntity(n, ux, uy, step, 7);
  if(trackStall(n, d, gained, step, dt)){ n.wait=0.2; pickTarget(n,110); }
  n.dir=faceDir(ux,uy); n.moving=true; n.step+=dt;
}
function updateGhost(g, dt){
  g.drift+=dt;
  if(g.hurt>0) g.hurt=Math.max(0,g.hurt-dt*3);
  if(g.dying>0){
    g.dying-=dt;
    if(g.dying<=0 && !g.gone){ g.gone=true; g.respawn=15+Math.random()*12;
      DROPS.push({x:g.x, y:g.y, age:0, ph:Math.random()*6.283, kind:'soul'});
      // Tear goes straight to the pack; grantTear drops it here if there is no room.
      if(grantTear(g.x+11, g.y+5)) toast('Crystalized Tear');
    }
    return;
  }
  if(g.gone){
    g.respawn-=dt;
    if(g.respawn<=0){
      for(let k=0;k<40;k++){
        const a=Math.random()*6.283, r=240+Math.random()*250;
        const nx=600+Math.cos(a)*r, ny=600+Math.sin(a)*r;
        if(nx<70||ny<70||nx>WORLD-70||ny>WORLD-70) continue;
        if(blocked(nx,ny,12)) continue;
        if(Math.hypot(nx-P.x, ny-P.y) < 260) continue;
        g.x=nx; g.y=ny; g.hx=nx; g.hy=ny; g.tx=nx; g.ty=ny;
        g.gone=false; g.hp=GHOST_HP; g.exp=0; g.hostile=false; g.committed=false;
        g.hurt=0; g.atkCd=0; g.wait=1+Math.random()*3;
        g.spd=14+Math.random()*10;
        break;
      }
      if(g.gone) g.respawn=3;
    }
    return;
  }
  // ---- the whisper. It rides distance, not sight: the closer it is the louder
  // and the more often, so the first thing that tells you one is out there is a
  // sound, several seconds before the lamp could pick it out. Its own timer, so
  // several wraiths do not chorus.
  if(!PL.dead){
    const wd = Math.hypot(g.x-P.x, g.y-P.y);
    if(wd < STALK_SEE){
      g.wsp = (g.wsp===undefined) ? 0.8+Math.random()*2.2 : g.wsp-dt;
      if(g.wsp <= 0){
        const near = 1 - wd/STALK_SEE;             // 0 far, 1 on top of you
        g.__wv = 0.012 + near*near*0.085;
        ghostSfx('whisper', g);
        g.wsp = 2.6 - near*1.5 + Math.random()*1.6;
      }
    } else g.wsp = undefined;
  }
  const lit=ghostLampAlpha(g);
  if(lit>0.35) g.exp+=dt*lit; else g.exp=Math.max(0,g.exp-dt*0.4);
  if(!g.hostile && g.exp>=EXPOSE_LIMIT){
    g.hostile=true; g.spd=39+Math.random()*15;
    sfx('shriek'); ghostSfx('growl',g);
  }
  if(g.atkCd>0) g.atkCd-=dt;
  // Exposure commits it: once the lamp has held on it long enough to turn it
  // hostile, it stops playing and comes straight in.
  if(g.hostile) g.committed = true;
  if(g.committed && !PL.dead){
    const dx=P.x-g.x, dy=P.y-g.y, d=Math.hypot(dx,dy)||1;
    g.dir=faceDir(dx/d,dy/d);
    if(d>16){ g.x+=dx/d*g.spd*dt; g.y+=dy/d*g.spd*dt; }
    else if(g.atkCd<=0){
      g.atkCd=1.5+Math.random()*0.5;
      ghostSfx('growl',g);
      hurtPlayer(GHOST_DMG_MIN+Math.floor(Math.random()*(GHOST_DMG_MAX-GHOST_DMG_MIN+1)));
    }
    return;
  }
  // ---- STALKING. Not yet committed, but it has seen you.
  //
  // It wants to sit just outside the lamp. Look at it and it gives ground; look
  // away and it closes. Because facing follows the cursor, this is entirely the
  // player's doing - turning to check a noise is what buys the distance back,
  // and turning away to run is what lets it in.
  if(!PL.dead){
    const px=P.x-g.x, py=P.y-g.y, pd=Math.hypot(px,py)||1;
    if(pd < STALK_SEE){
      g.dir = faceDir(px/pd, py/pd);
      // is the player looking at it? P.dir uses the same encoding as faceDir.
      const watched = faceDir(-px/pd, -py/pd) === P.dir;
      const want = watched ? STALK_FAR : STALK_NEAR;
      const spd  = watched ? STALK_SPD : RUSH_SPD;
      const err  = pd - want;
      if(Math.abs(err) > 5){
        // toward the player when too far, away when too close
        const s2 = (err>0 ? 1 : -1) * spd * dt;
        const nx = g.x + px/pd*s2, ny = g.y + py/pd*s2;
        if(!blocked(nx, ny, 9)){ g.x=nx; g.y=ny; }
        else { g.wait = 0.4; pickTarget(g, 90); }
      }
      // close enough to touch you, and unwatched: it takes the opening. Landing
      // a blow commits it - it has shown itself, so it stops backing away.
      if(pd <= 18 && g.atkCd<=0 && !watched){
        g.atkCd = 1.5+Math.random()*0.5;
        g.committed = true;
        sfx('shriek'); ghostSfx('growl',g);
        hurtPlayer(GHOST_DMG_MIN+Math.floor(Math.random()*(GHOST_DMG_MAX-GHOST_DMG_MIN+1)));
      }
      return;
    }
  }
  if(g.wait>0){ g.wait-=dt; return; }
  const dx=g.tx-g.x, dy=g.ty-g.y, d=Math.hypot(dx,dy);
  if(d<6){ g.wait=1.5+Math.random()*4; pickTarget(g,150); return; }
  g.x+=dx/d*g.spd*dt; g.y+=dy/d*g.spd*dt;
  g.dir=faceDir(dx/d,dy/d);
}
function updateSkeleton(k, dt){
  if(k.gone) return;
  if(k.hurt>0) k.hurt=Math.max(0,k.hurt-dt*3);
  if(k.rec>0) k.rec=Math.max(0,k.rec-dt);   // blade lowering back to the hang
  if(k.dying>0){
    k.dying-=dt;
    if(k.dying<=0){
      k.gone=true;
      if(Math.random()<0.62){
        DROPS.push({x:k.x, y:k.y, age:0, ph:Math.random()*6.283,
          kind:'gold', amt:1+Math.floor(Math.random()*5)});
      } else {
        DROPS.push({x:k.x, y:k.y, age:0, ph:Math.random()*6.283, kind:'shackle'});
      }
      countUndercroftKill();
    }
    return;
  }
  if(k.swing>0){
    k.swing-=dt;
    if(k.swing<=0) k.rec = SKEL_REC;
    if(k.swing<=0.16 && !k.hitDone){
      k.hitDone=true;
      // 28 -> 24, to match the shortened blade. Its visible reach is now about
      // 23px from centre, so hitting at 28 would connect with thin air.
      if(Math.hypot(P.x-k.x,P.y-k.y)<24)
        hurtPlayer(SKEL_DMG_MIN+Math.floor(Math.random()*(SKEL_DMG_MAX-SKEL_DMG_MIN+1)));
    }
    return;
  }
  if(k.atkCd>0) k.atkCd-=dt;
  const dp = Math.hypot(P.x-k.x, P.y-k.y);
  if(dp < 190) k.aggro = true;
  if(k.aggro && !PL.dead){
    const dx=P.x-k.x, dy=P.y-k.y, d=Math.max(1,dp);
    k.dir=faceDir(dx/d,dy/d);
    if(d>22){
      moveEntity(k, dx/d, dy/d, k.spd*dt, 8);   // slides round corners now
      k.moving=true; k.step+=dt;
      k.stepT-=dt;
      if(k.stepT<=0){ k.stepT=0.46; boneSfx('step',k); }
    } else {
      k.moving=false;
      if(k.atkCd<=0){
        k.atkCd=SKEL_CD; k.swing=0.32; k.hitDone=false;
        boneSfx('attack',k);
      }
    }
    return;
  }
  if(k.wait>0){ k.wait-=dt; k.moving=false; return; }
  const dx=k.tx-k.x, dy=k.ty-k.y, d=Math.hypot(dx,dy);
  if(d<6){ k.wait=1.4+Math.random()*2.6; k.moving=false;
    k.stuck=0; k.noProg=0; k.bestD=undefined; pickTarget(k,140); return; }
  const ux=dx/d, uy=dy/d, step=k.spd*0.7*dt;
  const gained = moveEntity(k, ux, uy, step, 8);
  if(trackStall(k, d, gained, step, dt)){ k.wait=0.4; pickTarget(k,140); }
  k.dir=faceDir(ux,uy); k.moving=true; k.step+=dt;
  k.stepT-=dt;
  if(k.stepT<=0){ k.stepT=0.62; boneSfx('step',k); }
}
// ==========================================================================
//  THE GRAVEYARD AMBUSH
// ==========================================================================
// Five skeletons buried under the road. They share the ordinary skeleton state
// shape so drawSkeleton, updateSkeleton and the hit tests all work unmodified -
// the only additions are `rise` (the climb out of the dirt) and, on one of them,
// `archer`.
const AMBUSH_SPOTS = [
  [128,1088],[196,1052],[306,1074],[142,1258],[292,1240]
];
const ARCHER_INDEX = 2;                  // the one at the back, centre-right
const ROAD_SKELS = AMBUSH_SPOTS.map((s,i)=>({
  x:s[0], y:s[1], hx:s[0], hy:s[1], tx:s[0], ty:s[1],
  dir:0, step:0, spd:22, wait:0, moving:false,
  hp: i===ARCHER_INDEX ? 24 : SEWER_SKEL_HP, atkCd:0, swing:0, rec:0,
  hurt:0, dying:0, gone:false, aggro:false, stepT:0, seed:i*17+61,
  rise: 0,                               // 0 = buried, 1 = fully out
  archer: i===ARCHER_INDEX, draw:0, shots:0
}));
const ARROWS = [];
// Arrows are FAST BUT DODGEABLE, which is the whole tuning requirement. At
// 132px/s an arrow crosses the 190px mid-range engagement in ~1.44s; the player
// moves 78px/s, so lateral movement clears the 5px shaft by a body width in
// about 0.15s. Moving sideways at mid range reliably beats one.
const ARROW_SPD = 132, ARROW_R = 5;
const ARROW_LIFE = 3.4;
const ARCHER_MIN = 110, ARCHER_MAX = 210;   // the band it tries to hold
function ambushLive(){ return ROAD_SKELS.some(k=>!k.gone && k.dying<=0); }
function startAmbush(){
  if(ROAD.ambush!=='idle') return;
  ROAD.ambush='rising';
  ROAD_SKELS.forEach((k,i)=>{ k.rise=0.0001; k.wait=i*0.16; });
  sfx('vow'); camShake=Math.max(camShake,2.2);
  banner('THE GROUND GIVES UP ITS DEAD', null, 'red');
}
function fireArrow(k){
  const dx=P.x-k.x, dy=P.y-k.y, d=Math.max(1,Math.hypot(dx,dy));
  ARROWS.push({x:k.x, y:k.y-14, vx:dx/d*ARROW_SPD, vy:dy/d*ARROW_SPD,
    age:0, ang:Math.atan2(dy,dx), dead:false});
  boneSfx('attack',k);
}
function updateArrows(dt){
  for(let i=ARROWS.length-1;i>=0;i--){
    const a=ARROWS[i];
    a.age+=dt;
    a.x+=a.vx*dt; a.y+=a.vy*dt;
    // Arrows respect the world: a shot into a tree or a parapet stops there,
    // so the treeline is cover rather than decoration.
    if(a.age>ARROW_LIFE || blocked(a.x,a.y,2)){ ARROWS.splice(i,1); continue; }
    if(!PL.dead && Math.hypot(P.x-a.x, P.y-a.y) < 9+ARROW_R){
      // Same damage as a melee skeleton hit, per spec.
      hurtPlayer(SKEL_DMG_MIN+Math.floor(Math.random()*(SKEL_DMG_MAX-SKEL_DMG_MIN+1)));
      ARROWS.splice(i,1);
    }
  }
}
// LIGHTING LAYER: AFTER the composite. Two red points in the black, so you know
// where the shots are coming from and can put a tree between you and them. It
// brightens as it draws, which is the wind-up tell every other enemy has and
// this one had no way to show at range.
function drawArcherTell(){
  ROAD_SKELS.forEach(k=>{
    if(!k.archer || k.gone || k.dying>0 || k.rise<1 || !k.aggro) return;
    const x = Math.round(k.x-cam.x), y = Math.round(k.y-cam.y)-23;
    if(x<-20||x>W+20||y<-20||y>H+20) return;
    const drawing = k.draw>0 ? 1-(k.draw/0.55) : 0;
    const p = (0.55+0.45*Math.sin(t*2.4+k.seed)) * (1+drawing*1.4);
    const c = 'rgb('+Math.min(255,150*p|0)+','+Math.min(255,34*p|0)+','+Math.min(255,28*p|0)+')';
    const side = (k.dir===2||k.dir===3);
    if(side) rect(x+(k.dir===3?2:-4), y, 3, 2, c);
    else { rect(x-4, y, 3, 2, c); rect(x+1, y, 3, 2, c); }
    if(drawing>0.35){                        // the nocked head catches the light
      const ang = Math.atan2(P.y-k.y, P.x-k.x);
      rect(x+Math.cos(ang)*13, y+8+Math.sin(ang)*7, 2, 2,
        'rgba(200,214,224,'+(0.3+0.5*drawing).toFixed(2)+')');
    }
  });
}
function drawArrow(a){
  const x=Math.round(a.x-cam.x), y=Math.round(a.y-cam.y);
  if(x<-20||x>W+20||y<-20||y>H+20) return;
  const cs=Math.cos(a.ang), sn=Math.sin(a.ang), nx=-sn, ny=cs;
  for(let i=-7;i<=4;i++)                                  // the shaft
    rect(x+cs*i, y+sn*i, 1, 1, i<-4?'#c8bfa4':'#4a3a22');
  rect(x+cs*5, y+sn*5, 2, 2, '#b9bfc4');                  // the head
  rect(x+cs*4+nx, y+sn*4+ny, 1, 1, '#8a9096');
  [-6,-7].forEach(f=>{                                    // fletching
    rect(x+cs*f+nx*2, y+sn*f+ny*2, 1, 1, '#8a7f6a');
    rect(x+cs*f-nx*2, y+sn*f-ny*2, 1, 1, '#8a7f6a');
  });
}
// Ranged behaviour: hold the band, never close. It walks BACKWARD when the
// player closes, which is what stops it collapsing into a melee skeleton, and
// it strafes rather than standing still so it is not free to shoot at.
function updateArcher(k, dt){
  const dx=P.x-k.x, dy=P.y-k.y, d=Math.max(1,Math.hypot(dx,dy));
  k.dir=faceDir(dx/d,dy/d);
  if(k.draw>0){                       // committed to a shot: stand and release
    k.draw-=dt; k.moving=false;
    if(k.draw<=0){ fireArrow(k); k.atkCd=1.9+Math.random()*0.6; k.shots++; }
    return;
  }
  if(k.atkCd>0) k.atkCd-=dt;
  let ux=0, uy=0;
  if(d < ARCHER_MIN){ ux=-dx/d; uy=-dy/d; }              // too close: back off
  else if(d > ARCHER_MAX){ ux=dx/d; uy=dy/d; }           // too far: close up
  else {                                                 // in the band: strafe
    const s = Math.sin(t*0.9 + k.seed) > 0 ? 1 : -1;
    ux = -dy/d*s; uy = dx/d*s;
  }
  const step=k.spd*0.9*dt;
  const gained = moveEntity(k, ux, uy, step, 8);
  k.moving = gained > step*0.3;
  if(k.moving){ k.step+=dt; k.stepT-=dt;
    if(k.stepT<=0){ k.stepT=0.5; boneSfx('step',k); } }
  // only draw when it has a clear line - it will not shoot the treeline
  if(k.atkCd<=0 && d>=ARCHER_MIN-20 && d<=ARCHER_MAX+30 && losClear(k.x,k.y,P.x,P.y,3))
    k.draw = 0.55;
}

// No speaker, no portrait, no name - the dialogue box carries an empty title so
// the frame is there but nobody is in it. Control is locked and the screen dims
// for the duration, and both are released the moment the last line closes.
const VOICE = {on:false, dim:0, y:820};
const VOICE_LINES = [
  {text:'Your past is no mystery for me... I can see the sorrow within you... Regret... Guilt... Doubt... You know me, don’t you?'},
  {text:'I have what you need... You’re not like the others. Fragile, predictable... Be my ally...'},
  {text:'Let...me...IN'}
];
function startVoice(){
  if(ROAD.voiceDone || VOICE.on) return;
  VOICE.on = true; ROAD.voiceDone = true;
  P.moving = false;
  ATK.active=false; ATK.phase='idle';
  startDialogue(null, '', VOICE_LINES);
  dialogue.onEnd = ()=>{ VOICE.on = false; };
  voiceSfx();
}
// Something breathing in at the bottom of the register. Deliberately not a
// voice - the words are on screen; this is the pressure underneath them.
function voiceSfx(){
  if(!actx || muted) return;
  const now = actx.currentTime;
  [41, 61.5, 27].forEach((f,i)=>{
    const o=actx.createOscillator(); o.type = i===2?'sine':'triangle';
    o.frequency.setValueAtTime(f, now);
    o.frequency.linearRampToValueAtTime(f*0.94, now+7);
    const g=actx.createGain();
    g.gain.setValueAtTime(0.0001, now);
    g.gain.linearRampToValueAtTime(i===2?0.10:0.045, now+1.4);
    g.gain.linearRampToValueAtTime(0.0001, now+8.5);
    o.connect(g); g.connect(actx.destination); o.start(now); o.stop(now+8.6);
  });
}
// LIGHTING LAYER: AFTER the composite, on purpose. This is not a light in the
// world - it is the world being taken away from you, and it has to darken the
// already-lit foreground too or the effect does nothing in a lit stretch.
function drawVoiceDim(){
  if(VOICE.dim<=0.01) return;
  ctx.fillStyle='rgba(2,2,4,'+(VOICE.dim*0.82).toFixed(3)+')';
  ctx.fillRect(0,0,W,H);
  // a slow crawl of darker banding, so the dim is not a flat sheet
  for(let y=0; y<H; y+=6){
    const a = 0.10*VOICE.dim*(0.5+0.5*Math.sin(y*0.06 + t*0.8));
    ctx.fillStyle='rgba(0,0,0,'+a.toFixed(3)+')';
    ctx.fillRect(0, y, W, 3);
  }
}
function takeRoad(){
  AREA.name='road';
  P.x=ROAD_ENTER.x; P.y=ROAD_ENTER.y; P.dir=1;
  if(blocked(P.x,P.y,6)) unstick(P,6);

function backToVillage(){
  AREA.name='village';
  P.x=gateStand().x; P.y=gateStand().y+16; P.dir=0;
  if(blocked(P.x,P.y,6)) unstick(P,6);

function updateRoad(dt){
  // the dim follows the sequence in and out rather than snapping
  const want = VOICE.on ? 1 : 0;
  VOICE.dim += (want - VOICE.dim) * Math.min(1, dt*2.6);
  // ---- the graveyard ambush, on proximity
  if(ROAD.ambush==='idle' && P.y > GRAVEYARD.y && P.y < GRAVEYARD.y+GRAVEYARD.h
     && P.x > GRAVEYARD.x && P.x < GRAVEYARD.x+GRAVEYARD.w) startAmbush();
  if(ROAD.ambush==='rising' && ROAD_SKELS.every(k=>k.rise>=1)) ROAD.ambush='live';
  // ---- the Voice, past the graveyard. Gated on the ambush being finished, so
  // it can never fire while five skeletons are still swinging at you.
  if(!ROAD.voiceDone && ROAD.ambush==='done' && P.y < VOICE.y) startVoice();
  // ---- the sigil answers the warded door.
  // Gated on Herbert having named it, so the beat cannot fire before the player
  // knows what they are carrying, and latched so it happens exactly once.
  if(SIGIL.known && !SIGIL.stirred && hasItem('sigil')){
    const rs = ruinStand();
    if(Math.hypot(rs.x-P.x, rs.y-P.y) < 64){
      SIGIL.stirred = true;
      sfx('shriek');
      toast('Your sigil shivers once more');
      startDialogue(P, 'Nestor', [
        {text:'I know nothing about this thing yet, I should find someone who does.'}
      ]);
      dialogue.onEnd = ()=>{
        const sq = questById('sigils');
        if(sq.state==='hidden'){
          sq.state='active';
          SCROLL.open=true; SCROLL.quest=sq;
          banner('SIGILS', 'THE MARKS ANSWER ONE ANOTHER', 'red');
          sfx('quest');
        }
      };
    }
  }
  // ---- Yotan
  if(!YOTAN.entered && P.y < YOTAN.gateY){
    YOTAN.entered = true;
    sfx('quest');
    ENDING.open = true;      // the panel replaces the old bare banner
  }
}
function onRoadSkelDown(k){
  if(k.archer){
    // The bow, which is the whole point of the encounter.
    DROPS.push({x:k.x, y:k.y, age:0, ph:Math.random()*6.283, kind:'bow'});
  } else if(Math.random()<0.62){
    DROPS.push({x:k.x, y:k.y, age:0, ph:Math.random()*6.283,
      kind:'gold', amt:1+Math.floor(Math.random()*5)});
  } else {
    DROPS.push({x:k.x, y:k.y, age:0, ph:Math.random()*6.283, kind:'shackle'});
  }
  if(!ambushLive() && ROAD.ambush==='live'){ ROAD.ambush='done'; sfx('quest'); }
}
function updateRoadSkel(k, dt){
  if(k.gone) return;
  // ---- the climb out of the dirt. Nothing hits and nothing can be hit until
  // it is fully up, so the ambush cannot open by killing the player instantly.
  if(k.rise>0 && k.rise<1){
    if(k.wait>0){ k.wait-=dt; return; }
    k.rise=Math.min(1, k.rise+dt/1.1);
    if(k.rise>=1){ k.aggro=true; boneSfx('attack',k); }
    return;
  }
  if(k.rise<=0) return;                       // still buried
  // Death is handled HERE rather than in updateSkeleton, because these drop a
  // bow instead of gold and must not run the undercroft kill counter.
  if(k.dying>0){
    if(k.hurt>0) k.hurt=Math.max(0,k.hurt-dt*3);
    k.dying-=dt;
    if(k.dying<=0){ k.gone=true; onRoadSkelDown(k); }
    return;
  }
  if(k.archer){
    if(k.hurt>0) k.hurt=Math.max(0,k.hurt-dt*3);
    updateArcher(k, dt);
    return;
  }
  updateSkeleton(k, dt);                      // the four melee ones, unmodified
}
function updateZombie(z, dt){
  if(z.gone) return;
  if(z.hurt>0) z.hurt=Math.max(0,z.hurt-dt*3);
  if(z.dying>0){
    z.dying-=dt;
    if(z.dying<=0){
      z.gone=true;
      const n=2+Math.floor(Math.random()*5);
      DROPS.push({x:z.x-10, y:z.y, age:0, ph:Math.random()*6.283, kind:'gold', amt:n});
      DROPS.push({x:z.x+8, y:z.y-4, age:0, ph:Math.random()*6.283, kind:'rag',
        amt:1+Math.floor(Math.random()*2)});
      DROPS.push({x:z.x+2, y:z.y+8, age:0, ph:Math.random()*6.283, kind:'tooth',
        amt:1+Math.floor(Math.random()*2)});
      countUndercroftKill();
    }
    return;
  }
  z.growlT-=dt;
  if(z.growlT<=0){ z.growlT=5+Math.random()*7; if(Math.hypot(z.x-P.x,z.y-P.y)<340) zomSfx('growl',z); }
  if(z.swing>0){
    z.swing-=dt;
    if(z.swing<=ZOM_WIND*0.28 && !z.hitDone){
      z.hitDone=true;
      if(Math.hypot(P.x-z.x,P.y-z.y)<34) hurtPlayer(ZOM_DMG);
    }
    return;
  }
  if(z.atkCd>0) z.atkCd-=dt;
  const dp=Math.hypot(P.x-z.x,P.y-z.y);
  if(dp<210) z.aggro=true;
  if(z.aggro && !PL.dead){
    const dx=P.x-z.x, dy=P.y-z.y, d=Math.max(1,dp);
    z.dir=faceDir(dx/d,dy/d);
    if(d>26){
      moveEntity(z, dx/d, dy/d, z.spd*dt, 9);   // slides round corners now
      z.moving=true; z.step+=dt;
    } else {
      z.moving=false;
      if(z.atkCd<=0){
        z.atkCd=ZOM_CD; z.swing=ZOM_WIND; z.hitDone=false;
        zomSfx('growl',z);
      }
    }
    return;
  }
  if(z.wait>0){ z.wait-=dt; z.moving=false; return; }
  const dx=z.tx-z.x, dy=z.ty-z.y, d=Math.hypot(dx,dy);
  if(d<7){ z.wait=2+Math.random()*3; z.moving=false;
    z.stuck=0; z.noProg=0; z.bestD=undefined; pickTarget(z,120); return; }
  const ux=dx/d, uy=dy/d, step=z.spd*0.7*dt;
  const gained = moveEntity(z, ux, uy, step, 9);
  if(trackStall(z, d, gained, step, dt)){ z.wait=0.5; pickTarget(z,120); }
  z.dir=faceDir(ux,uy); z.moving=true; z.step+=dt;
}
function countUndercroftKill(){

  if(AREA.name!=='undercroft') return;

function updateOwls(dt){

    o.next-=dt;
    if(o.blink>0) o.blink-=dt;
    else if(Math.random()<dt*0.55) o.blink=0.16;
    if(o.turn>0){ o.turn-=dt; }
    else if(Math.random()<dt*0.3){ o.turn=1.2; o.look=(Math.random()<0.5?-1:1); }
    if(o.turn<=0) o.look += (0-o.look)*Math.min(1,dt*3);
    if(o.next<=0){
      o.next = 16+Math.random()*26;
      const d=Math.hypot(tr.x-P.x, tr.y-P.y);
      if(d<520) owlHoot(tr);
    }
  });
}

const SHPW = 428, SHPH = 250;
const SHP = {x: Math.round((W-SHPW)/2), y: Math.round((H-SHPH)/2)-4, w:SHPW, h:SHPH};
function shopColW(){ return Math.floor((SHP.w-36)/2); }
function shopBuyRect(i){
  return {x:SHP.x+12, y:SHP.y+66+i*50, w:shopColW(), h:44};
}
function shopSellRect(i){
  return {x:SHP.x+24+shopColW(), y:SHP.y+66+i*50, w:shopColW(), h:44};
}
function shopX(){ return {x:SHP.x+SHP.w-30, y:SHP.y+5, w:19, h:19}; }
function shopClick(px,py){
  if(inR(px,py,shopX())){ SHOP.open=false; return; }
  const stock = shopStock();
  for(let i=0;i<stock.length;i++)
    if(inR(px,py,shopBuyRect(i))){ buyStock(stock[i]); return; }
  const rows = sellRows();
  for(let i=0;i<rows.length;i++)
    if(inR(px,py,shopSellRect(i))){ sellOne(rows[i]); return; }
}
function buyStock(s){
  if(gold < s.price){ PL.denied=0.5; sfx('denied'); toast('Not enough gold'); return false; }
  const i = packFree();
  if(i<0){ refusePickup(); return false; }
  gold -= s.price;
  BACKPACK[i] = s.make();
  s.sold = true;                              // off the shelf, for everything
  if(s.id==='key') SEWER_KEY.bought = true;
  sfx('coin'); toast(s.name+' bought  —  '+s.price+'g');
  return true;
}
function sellOne(row){
  if(row.kind==='tear'){
    if(tears<=0) return false;
    tears--;
    if(tears===0) BACKPACK.forEach((b,i)=>{ if(b && b.item==='tear') BACKPACK[i]=null; });
  } else if(row.kind==='shackle'){
    if(shackles<=0) return false;
    shackles--;
    // the slot is released only when the last one goes, same as tears
    if(shackles===0) BACKPACK.forEach((b,i)=>{ if(b && b.item==='shackle') BACKPACK[i]=null; });
  } else return false;
  gold += row.price;
  sfx('coin'); toast('Sold for '+row.price+'g');
  return true;
}

    if(hov) SHOP.hover = 'Click to sell one';
  });
  const xb = shopX(), xh = inR(mouse.x, mouse.y, xb);
  rect(xb.x, xb.y, xb.w, xb.h, xh?'#4a2018':'#241410');
  const xc = xh?'#c98b6a':'#6a5423';

// ==========================================================================
//  THE DROWNED RUN
// ==========================================================================
// Both transitions land on a pre-validated standing spot, never on the wall line.
// The old ascend put the player at grate.y+26 = y401, five pixels past the room's
// highest walkable y of 396 - inside geometry, unable to move, permanently stuck.
function descendSewer(){
  AREA.name='sewer';
  P.x=SEWER_STAND.x; P.y=SEWER_STAND.y; P.dir=0;
  if(blocked(P.x,P.y,6)) unstick(P,6);      // belt and braces
  embers.length=0; DRIPS.length=0;
  sewerWalk=0; nextSewerDrip=1.4; nextSewerChain=7;
  toast('The water is up to your ankles.');
  sfx('quest');
}
function ascendSewer(){
  AREA.name='undercroft';
  P.x=GRATE_STAND.x; P.y=GRATE_STAND.y; P.dir=1;
  if(blocked(P.x,P.y,6)) unstick(P,6);
  DRIPS.length=0; embers.length=0;
  sfx('quest');
}
let sewerWalk = 0, nextSewerDrip = 2, nextSewerChain = 9;
// Walk-time gated, exactly like the whisper timer: standing still never
// advances the ambience, so the level cannot be farmed for atmosphere.
function updateSewerAmbience(dt){
  if(!P.moving) return;
  sewerWalk += dt;
  if(sewerWalk >= nextSewerDrip){
    nextSewerDrip = sewerWalk + 1.8 + Math.random()*5.2;
    spawnDrip(SEWER_ROOMS);
  }
  if(sewerWalk >= nextSewerChain){
    nextSewerChain = sewerWalk + 12 + Math.random()*17;
    const ch = SEWER_DECOR.filter(d=>d.t==='chain');
    if(ch.length) chainSfx(ch[Math.floor(Math.random()*ch.length)]);
  }
}
function chainSfx(src){
  if(!actx || muted) return;
  const now=actx.currentTime;
  const pan=panAt(src.x-P.x, src.y-P.y, 90);
  pan.connect(actx.destination);
  // 5-9 iron links knocking, bandpassed high and rolled off: distance, not menace
  const n=5+Math.floor(Math.random()*5);
  for(let i=0;i<n;i++){
    const at=now+i*(0.045+Math.random()*0.07);
    const s=noiseBuf(0.05,0.1);
    const bp=actx.createBiquadFilter(); bp.type='bandpass'; bp.Q.value=7;
    bp.frequency.value=1700+Math.random()*1500;
    const g=actx.createGain();
    g.gain.setValueAtTime(0.0001, at);
    g.gain.linearRampToValueAtTime(0.020+Math.random()*0.014, at+0.004);
    g.gain.exponentialRampToValueAtTime(0.0001, at+0.09);
    s.connect(bp); bp.connect(g); g.connect(pan);
    s.start(at); s.stop(at+0.1);
  }
  const o=actx.createOscillator(); o.type='triangle';
  o.frequency.setValueAtTime(150, now);
  o.frequency.exponentialRampToValueAtTime(88, now+0.5);
  const og=actx.createGain();
  og.gain.setValueAtTime(0.0001, now);
  og.gain.linearRampToValueAtTime(0.016, now+0.05);
  og.gain.exponentialRampToValueAtTime(0.0001, now+0.6);
  o.connect(og); og.connect(pan);
  o.start(now); o.stop(now+0.62);
}
function drawSewerGround(){
  ctx.fillStyle='#07090a'; ctx.fillRect(0,0,W,H);
  SEWER_ROOMS.forEach(m=>{
    const x=m.x-cam.x, y=m.y-cam.y;
    if(x>W+40||x+m.w<-40||y>H+40||y+m.h<-40) return;
    // brick courses on the channel walls
    for(let i=0;i<Math.ceil(m.w/24);i++){
      const bx=x-14+i*24+((i%2)*8);
      rect(bx, y-14, 22, 14, '#20242a');
      rect(bx, y-14, 22, 2, '#2b3038');
      rect(bx+21, y-14, 1, 14, '#14171c');
    }
  });
  // wet brick floor
  const x0=Math.floor(cam.x/TILE)*TILE, y0=Math.floor(cam.y/TILE)*TILE;
  for(let wy=y0-TILE; wy<y0+H+TILE; wy+=TILE){
    for(let wx=x0-TILE; wx<x0+W+TILE; wx+=TILE){
      if(!SEWER_ROOMS.some(m=>wx>=m.x-TILE&&wx<m.x+m.w&&wy>=m.y-TILE&&wy<m.y+m.h)) continue;
      const rr=rng((wx*73856093 ^ wy*19349663)>>>0), r=rr();
      const c = r<0.38?'#171c1c' : r<0.68?'#141918' : r<0.9?'#1b201f' : '#111514';
      rect(wx-cam.x, wy-cam.y, TILE, TILE, c);
      // the specular row that makes it read as WET brick rather than dry stone
      rect(wx-cam.x, wy-cam.y+TILE-3, TILE, 1, 'rgba(122,158,168,0.10)');
      if(rr()<0.30)
        rect(wx-cam.x+2+rr()*14, wy-cam.y+TILE-6, 3+rr()*7, 1, 'rgba(150,190,204,0.13)');
      rect(wx-cam.x+TILE-1, wy-cam.y, 1, TILE, 'rgba(0,0,0,0.28)');
      rect(wx-cam.x, wy-cam.y+TILE-1, TILE, 1, 'rgba(0,0,0,0.24)');
    }
  }
  // standing water down the middle of every channel
  SEWER_ROOMS.forEach((m,mi)=>{
    const x=m.x-cam.x, y=m.y-cam.y;
    if(x>W+40||x+m.w<-40||y>H+40||y+m.h<-40) return;
    const horiz = m.w >= m.h;
    const cx = horiz ? x : x+m.w/2-9, cy = horiz ? y+m.h/2-9 : y;
    const ww = horiz ? m.w : 18, wh = horiz ? 18 : m.h;
    rect(cx, cy, ww, wh, 'rgba(22,44,48,0.55)');
    rect(cx, cy, ww, 1, 'rgba(90,140,150,0.16)');
    for(let i=0;i<6;i++){
      const q=rng(mi*97+i*13)();
      const gx = horiz ? x+((t*9+q*m.w)%m.w) : cx+2+q*14;
      const gy = horiz ? cy+3+q*12 : y+((t*9+q*m.h)%m.h);
      rect(gx, gy, 2, 1, 'rgba(140,190,200,'+(0.10+0.10*Math.sin(t*2+i)).toFixed(3)+')');
    }
  });
  // occlusion bands
  SEWER_ROOMS.forEach(m=>{
    const x=m.x-cam.x, y=m.y-cam.y;
    if(x>W+40||x+m.w<-40||y>H+40||y+m.h<-40) return;
    for(let i=0;i<12;i++) rect(x, y+i, m.w, 1, 'rgba(0,0,0,'+((1-i/12)*0.52).toFixed(3)+')');
    for(let i=0;i<7;i++){
      rect(x+i, y, 1, m.h, 'rgba(0,0,0,'+((1-i/7)*0.40).toFixed(3)+')');
      rect(x+m.w-1-i, y, 1, m.h, 'rgba(0,0,0,'+((1-i/7)*0.40).toFixed(3)+')');
      rect(x, y+m.h-1-i, m.w, 1, 'rgba(0,0,0,'+((1-i/7)*0.34).toFixed(3)+')');
    }
  });
}

// An iron gate set into a stone wall, with a lock plate and a keyhole. Shared by
// both sides of the passage: `flip` mirrors it vertically for the sewer side,
// where the gate is in the north wall and the player stands below it.
// LIGHTING LAYER: before the composite - it is masonry and iron, it obeys the dark.
function drawIronGate(gx, gy, open, flip, seed){
  const x=Math.round(gx-cam.x), y=Math.round(gy-cam.y);
  if(x<-60||x>W+60||y<-60||y>H+60) return;
  const s = flip ? -1 : 1;              // s=1: opening rises away from the player
  const HW = 19;                        // half width of the opening
  const DEPTH = 22;                     // how far into the wall it reads
  // --- stone surround, dressed blocks around the arch
  for(let i=0;i<3;i++){
    rect(x-HW-8, y - s*(DEPTH) + (flip?0:0) - (flip?0:0) + (s>0? -i*8 : i*8-8), 8, 8, i%2?'#2b2f34':'#333840');
    rect(x+HW,   y - (s>0? i*8+8 : -i*8), 8, 8, i%2?'#333840':'#2b2f34');
  }
  rect(x-HW-8, y-(s>0?DEPTH+8:0), 8, DEPTH+8, '#2b3036');
  rect(x+HW,   y-(s>0?DEPTH+8:0), 8, DEPTH+8, '#262b31');
  rect(x-HW-8, y-(s>0?DEPTH+8:0)+(s>0?0:DEPTH), HW*2+16, 6, '#353b43');
  rect(x-HW-8, y-(s>0?DEPTH+8:0)+(s>0?0:DEPTH), HW*2+16, 2, '#454c55');
  // --- the dark passage behind
  const py0 = s>0 ? y-DEPTH : y;
  rect(x-HW, py0, HW*2, DEPTH, open ? '#04060a' : '#0a0e11');
  if(open){
    // An open doorway has to read as a doorway, not as an absence. Brighter
    // jambs, a lit threshold on the floor side, and a cool draught from below.
    for(let i=0;i<6;i++)
      rect(x-HW+2+i, py0+(s>0?2:DEPTH-3-i), HW*2-4-i*2, 1,
        'rgba(104,148,170,'+(0.20-i*0.028).toFixed(3)+')');
    rect(x-HW, py0, 2, DEPTH, '#3d454e');            // lit inner jambs
    rect(x+HW-2, py0, 2, DEPTH, '#2a3037');
    rect(x-HW, py0+DEPTH-2, HW*2, 2, '#4a535c');     // threshold stone
    rect(x-HW, py0+DEPTH-2, HW*2, 1, '#606b76');
    const dr = 0.5+0.5*Math.sin(t*1.1+seed);
    rect(x-HW+3, py0+DEPTH-4, HW*2-6, 1, 'rgba(120,168,190,'+(0.10+0.08*dr).toFixed(3)+')');
  }
  // --- the gate itself
  if(open){
    // swung inward on its hinges: bars bunched against the left jamb, foreshortened
    for(let i=0;i<5;i++){
      const bx = x-HW+1+i*3;
      rect(bx, py0+2, 2, DEPTH-4, i<2?'#4d565e':'#3a4147');
      rect(bx, py0+2, 2, 1, '#5e6970');
    }
    rect(x-HW+1, py0+2, 14, 2, '#4d565e');
    rect(x-HW+1, py0+DEPTH-5, 14, 2, '#3a4147');
    // hinge pins still in the jamb
    rect(x-HW-2, py0+4, 3, 4, '#5e6970');
    rect(x-HW-2, py0+DEPTH-9, 3, 4, '#5e6970');
  } else {
    // five vertical bars, two cross-braces, rivets
    for(let i=0;i<5;i++){
      const bx = x-HW+3+i*7;
      rect(bx, py0+1, 3, DEPTH-2, '#3a4147');
      rect(bx, py0+1, 3, 1, '#525b64');
      rect(bx+2, py0+1, 1, DEPTH-2, '#22272b');
    }
    [py0+4, py0+DEPTH-7].forEach(by=>{
      rect(x-HW+1, by, HW*2-2, 3, '#434b53');
      rect(x-HW+1, by, HW*2-2, 1, '#59636c');
      for(let i=0;i<5;i++) rect(x-HW+4+i*7, by+1, 1, 1, '#6e7a83');
    });
    // --- lock plate with a key slot, on the near side so it reads at a glance
    const ly = s>0 ? py0+DEPTH-14 : py0+4;
    rect(x+4, ly, 12, 12, '#20252a');
    rect(x+4, ly, 12, 1, '#39424a');
    rect(x+4, ly, 1, 12, '#39424a');
    rect(x+15, ly, 1, 12, '#12171a');
    // keyhole: round bore over a tapered slot
    rect(x+9, ly+3, 3, 3, '#05070a');
    rect(x+10, ly+6, 1, 4, '#05070a');
    rect(x+9, ly+8, 3, 2, '#05070a');
    // a dull brass glint so the slot is findable in lamplight
    const gl = 0.45+0.35*Math.sin(t*1.7+seed);
    rect(x+9, ly+3, 1, 1, 'rgba('+(150*gl+60|0)+','+(120*gl+46|0)+','+(50*gl|0)+',0.9)');
  }
  rect(x-HW-8, y-(s>0?DEPTH+8:0)-(s>0?2:0)+(s>0?0:DEPTH+6), HW*2+16, 2, 'rgba(0,0,0,0.45)');
}

// Aldric is HERBERT'S BROTHER, and this is not a dispatch - it is the last thing

// the coin-giver looks like, the warning not to listen - has moved into
// yotanDialogue(), into Herbert's own memory. He was here ten years ago when it

];

// The sewer reuses the skeleton AI and sprite wholesale; only the roster and

function activeSkeletons(){
  return AREA.name==='sewer' ? SEWERS
       : AREA.name==='sewer2' ? []
       : AREA.name==='road' ? ROAD_SKELS
       : AREA.name==='village' ? []
       : SKELETONS;
}
// Everything in the current area an arrow can hit. One list, so the bow does not
// need its own copy of the per-area target rules the melee arc already encodes.
function hostilesHere(){
  const out = activeSkeletons().slice();
  if(AREA.name==='undercroft') ZOMBIES.forEach(z=>out.push(z));
  if(AREA.name==='sewer2' && hunterAlive()) out.push(HUNTER);
  return out.filter(e=>!e.gone && e.dying<=0);

// Shared kill path for arrow hits, mirroring what the melee arc does per type.

  if(e === HUNTER){ e.hp=0; e.dying=1.4; e.swing=0; return; }
  if(ZOMBIES.indexOf(e)>=0){ e.dying=1.1; e.swing=0; zomSfx('moan',e); gainXP(16); onKill(SE_SKELETON); return; }

}

// ==========================================================================
//  THE FALLEN HUNTER  —  Elphric, of the Order of the Waning Light

// HP 75 -> 150, damage +50%, and 25% faster on both the cooldown and the
// wind-up (divide by 1.25) so the speed increase is felt in the tell as well as
// the interval. Roughly 13 Long sword hits now, against 7.
const HUNTER_HP = 150, HUNTER_DMG = 30, HUNTER_CD = 1.52, HUNTER_WIND = 0.368;

  x:700, y:200, hx:700, hy:200, tx:700, ty:200,
  dir:1, step:0, spd:34, moving:false, wait:0,
