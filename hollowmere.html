// wind-up. HUNT_EYE_D is the dark rim under it and is still drawn.
const HUNT_EYE_D='#1f7a3e';
function drawFallenHunter(){
  const k = HUNTER;
  const x = Math.round(k.x-cam.x), y = Math.round(k.y-cam.y);
  if(x<-60||x>W+60||y<-70||y>H+50) return;
  if(k.gone && k.dying<=0){
    // the heap he leaves, with the emblem still catching light
    const f = 1;
    ctx.fillStyle='rgba(0,0,0,0.5)';
    ctx.beginPath(); ctx.ellipse(x, y+2, 20, 6, 0, 0, 6.3); ctx.fill();
    rect(x-16, y-7, 32, 7, HUNT_LO);
    rect(x-16, y-7, 32, 2, HUNT_FOLD);
    rect(x-13, y-11, 12, 5, BONE_MID);
    rect(x+2, y-10, 10, 4, BONE_LO);
    rect(x-6, y-13, 9, 7, BONE);          // the skull, fallen sideways
    rect(x-6, y-13, 9, 2, BONE_HI);
    rect(x-4, y-9, 2, 2, '#0a0d0b');
    const gl=0.45+0.35*Math.sin(t*1.6);
    rect(x+4, y-16, 8, 8, '#1a1f1b');     // the emblem
    rect(x+5, y-15, 6, 6, 'rgb('+(90*gl+30|0)+','+(150*gl+40|0)+','+(110*gl+34|0)+')');
    rect(x+7, y-15, 2, 6, '#1a1f1b');
    return;
  }
  const dying = k.dying>0;
  const sink = dying ? Math.min(1, 1-(k.dying/1.4)) : 0;
  // ---- the Fallen Hunter -------------------------------------------------
  // Built ON drawFigure like the skeleton and the zombie. He was 42px against a
  // 29px villager; that scale is exactly what the build notes blame for the old
  // skeleton reading as a scarecrow, and it was making the boss read as a prop
  // rather than as a man who wore this same coat. Nestor's silhouette IS the
  // point of him, and drawFigure is the routine that draws Nestor.
  //
  // What separates him from the other two: he is the only one still WEARING the
  // order - deep hood, belt, the waning crescent on his chest - and the only one
  // whose eyes flare before he commits. He is armed like Nestor, not like a
  // skeleton: one long blade, a slow heavy haul rather than a snap.
  const A     = DIRA[k.dir];
  const wind  = k.swing>0 ? 1-(k.swing/HUNTER_WIND) : 0;
  const hlean = k.swing>0
    ? (wind<0.5 ? -(wind/0.5)*5 : -5 + easeIn((wind-0.5)/0.5)*13) : 0;
  const hrec  = k.hurt>0 ? k.hurt*5 : 0;              // rocks, does not stagger
  const wx = k.x + Math.cos(A)*hlean - Math.cos(A)*hrec;
  const wy = k.y + Math.sin(A)*hlean*0.6 - Math.sin(A)*hrec*0.6 + sink*7;
  const flash = k.hurt>0;
  // The slowest stride in the game - slower than the zombie's 3.4, half the
  // skeleton's 7. He has mass and he is not hurrying after you.
  const phase = k.step*2.6;

  const pal = {
    cloak: flash?'#6a4a44':HUNT_ROBE,
    hi:    flash?'#7a5a52':HUNT_HI,
    lo:    flash?'#4a3230':HUNT_LO,
    trim:  flash?'#5a4038':'#3d2f1c',      // the order's belt
    skin:  flash?'#3a2422':'#0a0d0b',      // the hood is a cavity, not a face
    fold:  flash?'#5a3e3a':HUNT_FOLD
  };
  drawFigure(wx, wy, k.dir, phase, k.moving, pal, {eyes:false, light:null, blade:false});

  const fx = Math.round(wx-cam.x), fy = Math.round(wy-cam.y);
  if(fx<-44||fx>W+44||fy<-60||fy>H+44) return;
  const sw   = k.moving ? Math.sin(phase) : 0;
  const bob  = k.moving && Math.sin(phase*2) > 0.4 ? 1 : 0;
  const by   = fy - bob;
  const side = (k.dir===2||k.dir===3);
  const fc   = k.dir===3?1:k.dir===2?-1:0;

  // ---- bare bone shins under the hem. Nothing else in the game shows bone
  // below the cloth, and it is the first thing that tells you what he is.
  const lA=Math.max(0,Math.round(sw*3)), lB=Math.max(0,Math.round(-sw*3));
  if(!side){
    rect(fx-4, by-5-lA, 1, 3, BONE_MID);
    rect(fx+3, by-5-lB, 1, 3, BONE_MID);
  } else {
    rect(fx-1+Math.round(sw*3)*fc, by-5, 1, 3, BONE_MID);
  }

  // ---- heavy pauldrons. Broader at the shoulder than anything else that walks,
  // which is the whole silhouette cue that he outranks the corridor.
  const pw = side ? 4 : 3;
  rect(side ? fx-5 : fx-8, by-21, pw, 4, flash?'#7a5a52':HUNT_HI);
  rect(side ? fx-5 : fx-8, by-21, pw, 1, BONE_MID);
  rect(side ? fx+2 : fx+5, by-21, pw, 4, flash?'#5a3e3a':HUNT_FOLD);
  rect(side ? fx+2 : fx+5, by-21, pw, 1, BONE_LO);

  // ---- two ribs through the open front of the robe. Deliberately NOT the
  // skeleton's full cage: on him it is a glimpse, not the whole chest.
  if(!side){
    rect(fx-3, by-16, 6, 5, '#080b09');
    rect(fx-3, by-15, 6, 1, BONE);
    rect(fx-3, by-13, 6, 1, BONE);
    rect(fx-1, by-16, 1, 5, BONE_MID);            // sternum
  }

  // ---- the waning crescent, same emblem as Aldric's. His signature.
  if(!side){
    const eg = 0.5+0.5*Math.sin(t*1.4);
    rect(fx-3, by-20, 6, 4, '#141a15');
    rect(fx-2, by-19, 4, 2, 'rgb('+(70*eg+34|0)+','+(140*eg+50|0)+','+(96*eg+40|0)+')');
    rect(fx-1, by-19, 2, 2, '#141a15');
  }

  // ---- the hood cavity and what burns in it
  if(!dying && k.dir!==1){
    const ep = 0.7+0.3*Math.sin(t*2.6+k.seed);
    // The eyes FLARE as he commits to a swing - the tell you learn to read, and
    // the reason his are drawn here rather than handed to figureEye.
    const glare = 1 + wind*0.9;
    const ec = 'rgb('+Math.min(255,76*ep*glare|0)+','+Math.min(255,224*ep*glare|0)+','+Math.min(255,122*ep*glare|0)+')';
    if(side){
      const ex = fc>0 ? fx+3 : fx-5;
      rect(ex, by-24, 4, 5, '#050706');
      rect(ex+(fc>0?0:1), by-23, 3, 2, ec);
      rect(ex+(fc>0?0:1), by-24, 3, 1, HUNT_EYE_D);
    } else {
      rect(fx-4, by-24, 8, 6, '#050706');
      rect(fx-4, by-23, 3, 2, ec); rect(fx+1, by-23, 3, 2, ec);
      rect(fx-4, by-24, 3, 1, HUNT_EYE_D); rect(fx+1, by-24, 3, 1, HUNT_EYE_D);
    }
  }
  if(!dying) drawHunterBlade();
}
// Same construction as the skeleton's, with his own numbers: his blade also
// hangs parallel to the body at rest rather than jutting out in front, and it
// is lowered rather than snapped. See SKEL_REST_LIFT for why rest is anchored
// twice instead of wrapped at runtime.
const HUNT_WIND_A = -1.35, HUNT_STRIKE_A = 2.7;
const HUNT_END_A = HUNT_WIND_A + HUNT_STRIKE_A;
const HUNT_REST_LIFT = DIRA.map(A => nearestTurn(SKEL_REST_ANG - A, HUNT_WIND_A));
const HUNT_REST_DROP = DIRA.map(A => nearestTurn(SKEL_REST_ANG - A, HUNT_END_A));
const HUNT_REC = 0.3;                 // slower to lower than the skeleton
function hunterSwingAng(){
  const k = HUNTER, A = DIRA[k.dir];
  if(k.swing<=0){
    if(k.rec>0)
      return A + HUNT_END_A + (HUNT_REST_DROP[k.dir]-HUNT_END_A)*easeOut(1-(k.rec/HUNT_REC));
    return A + HUNT_REST_LIFT[k.dir];
  }
  const p = 1-(k.swing/HUNTER_WIND);
  const rest = HUNT_REST_LIFT[k.dir];
  const target = p < 0.45
    ? HUNT_WIND_A*(p/0.45)
    : HUNT_WIND_A + HUNT_STRIKE_A*easeIn((p-0.45)/0.55);
  return A + rest + (target-rest)*easeIn(Math.min(1, p/0.45));
}
function drawHunterBlade(){
  const k = HUNTER;
  // follows the body's lean and recoil so the blade never detaches from the hand
  const A = DIRA[k.dir];
  const wind = k.swing>0 ? 1-(k.swing/HUNTER_WIND) : 0;
  const hlean = k.swing>0
    ? (wind<0.5 ? -(wind/0.5)*5 : -5 + easeIn((wind-0.5)/0.5)*13) : 0;
  const hrec = k.hurt>0 ? Math.round(k.hurt*5) : 0;
  const step2 = k.moving && Math.sin(k.step*10)>0.3 ? 2 : 0;
  const cx = Math.round(k.x-cam.x) + Math.round(Math.cos(A)*hlean)
             - Math.round(Math.cos(A)*hrec) + SIDE[k.dir]*1.4;
  const cy = Math.round(k.y-cam.y) + Math.round(Math.sin(A)*hlean*0.6)
             - Math.round(Math.sin(A)*hrec*0.6) - step2 - 14;
  const ang = hunterSwingAng();
  const cs=Math.cos(ang), sn=Math.sin(ang), nx=-sn, ny=cs;
  const flash = k.hurt>0;
  // A long straight order blade, notched and dulled. Was 30 units from the
  // pivot on a body that is now 29px tall - the same overlong blade the
  // skeleton had. Now 20: still visibly the longest weapon in the game, which
  // is his reach advantage made readable, but no longer taller than he is.
  for(let i=4;i<=8;i++) rect(cx+cs*i-1, cy+sn*i-1, 3, 3, i<6?HUNT_ROBE:'#2a2e2c');
  for(let g=-3;g<=3;g++)
    rect(cx+cs*9+nx*g, cy+sn*9+ny*g, 1, 1, Math.abs(g)<=1?'#7f8a72':'#4c5445');
  for(let i=10;i<=20;i++){
    const near = i>18;
    rect(cx+cs*i, cy+sn*i, 1, 1, flash?'#ffd8d0':(near?'#eafff0':'#9fb9a6'));
    if(i<19) rect(cx+cs*i+nx, cy+sn*i+ny, 1, 1, flash?'#e8b0a4':'#71856f');
    if(i<17 && i%4!==0) rect(cx+cs*i+nx*2, cy+sn*i+ny*2, 1, 1, '#4e5c4d');
  }
}
function hunterSfx(kind){
  if(!actx || muted) return;
  const now = actx.currentTime;
  const pan = panAt(HUNTER.x-P.x, HUNTER.y-P.y, 50);
  pan.connect(actx.destination);
  if(kind==='notice'){
    // a low bell under a breath: something old standing up
    [220,146].forEach((fr,i)=>{
      const o=actx.createOscillator(); o.type='triangle';
      o.frequency.setValueAtTime(fr, now+i*0.10);
      o.frequency.exponentialRampToValueAtTime(fr*0.72, now+i*0.10+0.9);
      const g=actx.createGain();
      g.gain.setValueAtTime(0.0001, now+i*0.10);
      g.gain.linearRampToValueAtTime(0.06, now+i*0.10+0.05);
      g.gain.exponentialRampToValueAtTime(0.0001, now+i*0.10+1.1);
      o.connect(g); g.connect(pan); o.start(now+i*0.10); o.stop(now+i*0.10+1.2);
    });
  } else if(kind==='swing'){
    const s=noiseBuf(0.34,0.3);
    const bp=actx.createBiquadFilter(); bp.type='bandpass'; bp.Q.value=1.6;
    bp.frequency.setValueAtTime(520, now);
    bp.frequency.exponentialRampToValueAtTime(2100, now+0.2);
    const g=actx.createGain();
    g.gain.setValueAtTime(0.0001, now);
    g.gain.linearRampToValueAtTime(0.07, now+0.06);
    g.gain.exponentialRampToValueAtTime(0.0001, now+0.34);
    s.connect(bp); bp.connect(g); g.connect(pan); s.start(now); s.stop(now+0.36);
  } else if(kind==='die'){
    // the bell again, falling, with the breath going out of it
    const o=actx.createOscillator(); o.type='sine';
    o.frequency.setValueAtTime(196, now);
    o.frequency.exponentialRampToValueAtTime(58, now+2.0);
    const vib=actx.createOscillator(); vib.frequency.value=4.2;
    const vg=actx.createGain(); vg.gain.value=7;
    vib.connect(vg); vg.connect(o.frequency); vib.start(now); vib.stop(now+2.1);
    const g=actx.createGain();
    g.gain.setValueAtTime(0.0001, now);
    g.gain.linearRampToValueAtTime(0.075, now+0.12);
    g.gain.exponentialRampToValueAtTime(0.0001, now+2.1);
    o.connect(g); g.connect(pan); o.start(now); o.stop(now+2.2);
    const air=noiseBuf(2.0,0.55);
    const hp=actx.createBiquadFilter(); hp.type='highpass'; hp.frequency.value=440;
    const ag=actx.createGain();
    ag.gain.setValueAtTime(0.0001, now);
    ag.gain.linearRampToValueAtTime(0.03, now+0.3);
    ag.gain.exponentialRampToValueAtTime(0.0001, now+2.0);
    air.connect(hp); hp.connect(ag); ag.connect(pan); air.start(now); air.stop(now+2.05);
  }
}
function updateHunter(dt){
  const k = HUNTER;
  if(k.gone) return;
  if(k.hurt>0) k.hurt=Math.max(0,k.hurt-dt*3);
  if(k.rec>0) k.rec=Math.max(0,k.rec-dt);   // blade lowering back to the hang
  if(k.dying>0){
    k.dying-=dt;
    if(k.dying<=0){ k.gone=true; onHunterDown(); }
    return;
  }
  if(k.swing>0){
    k.swing-=dt;
    if(k.swing<=0) k.rec = HUNT_REC;
    if(k.swing<=HUNTER_WIND*0.30 && !k.hitDone){
      k.hitDone=true;
      // 34 -> 30, to match the shortened blade. He still outreaches everything
      // else in the game, which is the point of him.
      if(Math.hypot(P.x-k.x, P.y-k.y) < 30) hurtPlayer(HUNTER_DMG);
    }
    return;
  }
  if(k.atkCd>0) k.atkCd-=dt;
  const dp = Math.hypot(P.x-k.x, P.y-k.y);
  if(!k.aggro && dp < 230){
    k.aggro=true; k.seen=true;
    hunterSfx('notice'); camShake=Math.max(camShake,1.6);
    banner('THE FALLEN HUNTER', 'HE STILL WEARS THE COAT', 'red');
  }
  if(k.aggro && !PL.dead){
    const dx=P.x-k.x, dy=P.y-k.y, d=Math.max(1,dp);
    k.dir=faceDir(dx/d, dy/d);
    if(d>26){
      moveEntity(k, dx/d, dy/d, k.spd*dt, 9);
      k.moving=true; k.step+=dt;
      k.stepT-=dt;
      if(k.stepT<=0){ k.stepT=0.40; boneSfx('step',k); }
    } else {
      k.moving=false;
      if(k.atkCd<=0){
        k.atkCd=HUNTER_CD; k.swing=HUNTER_WIND; k.hitDone=false;
        hunterSfx('swing');
      }
    }
    return;
  }
  k.moving=false;
}
// LIGHTING LAYER: AFTER the composite. A boss bar is HUD, not world.
function drawHunterBar(){
  if(AREA.name!=='sewer2') return;
  if(!HUNTER.seen || HUNTER.gone) return;
  const bw=280, bx=Math.round((W-bw)/2), by=14;
  const frac=Math.max(0, HUNTER.hp/HUNTER.max);
  rect(bx-3, by-3, bw+6, 20, 'rgba(6,8,7,0.86)');
  const bd='#4a5a48';
  rect(bx-3, by-3, bw+6, 2, bd); rect(bx-3, by+15, bw+6, 2, bd);
  rect(bx-3, by-3, 2, 20, bd); rect(bx+bw+1, by-3, 2, 20, bd);
  rect(bx, by, bw, 12, '#140f10');
  const fw=Math.round(bw*frac);
  if(fw>0){
    rect(bx, by, fw, 12, '#6e1c18');
    rect(bx, by, fw, 4, '#a83028');
    rect(bx, by+11, fw, 1, 'rgba(0,0,0,0.5)');
    const pu=0.5+0.5*Math.sin(t*3.1);
    rect(bx+fw-2, by, 2, 12, 'rgb('+(200*pu+40|0)+','+(70*pu|0)+','+(58*pu|0)+')');
  }
  // notches every quarter, so the bar reads as a length not a blob
  for(let i=1;i<4;i++) rect(bx+Math.round(bw*i/4), by, 1, 12, 'rgba(0,0,0,0.55)');
  centered('FALLEN HUNTER', W/2, by-1, 11, '#1a0a08');
  centered('FALLEN HUNTER', W/2, by-2, 11, '#d8c8a8');
  drawCount(Math.ceil(HUNTER.hp), bx+bw-6-String(Math.ceil(HUNTER.hp)).length*4, by+15, '#c08a7a');
}
function onHunterDown(){
  hunterSfx('die');
  camShake=Math.max(camShake,2.2);
  gainXP(120); onKill(20);
  const q = questById('elphric');
  startDialogue(P, 'Nestor', [
    {text:'It goes down slowly, the way a man does. Not the way the others went down.'},
    {text:'The coat is ours. Waning Light, hemmed in the old way, the way they stopped doing before I took my oath.'},
    {text:'...I know this emblem. I have seen it across a table.'},
    {text:'Elphric. Six months, and every one of us was told he had simply walked off north and not come back.'},
    {text:'He did not walk off. He came down here. And something down here kept him.'},
    {text:'Herbert needs to hear this. So does the Order.'}
  ]);
  dialogue.onEnd = ()=>{
    HUNTER.mourned = true;
    if(q.state==='hidden'){
      q.state='active';
      banner('ELPHRIC', 'REPORT BACK TO HERBERT', 'gold');
      sfx('quest');

}

function drawSewer2Ground(){
  ctx.fillStyle='#06080a'; ctx.fillRect(0,0,W,H);
  SEWER2_ROOMS.forEach(m=>{

  SEWER2_ROOMS.forEach(m=>{

function drawSewer2Minimap(){
  rect(MM_X-2, MM_Y-2, MM_S+4, MM_S+4, 'rgba(5,7,7,0.9)');

    const a=pt(m.x,m.y), b=pt(m.x+m.w,m.y+m.h);
    rect(a.x,a.y,Math.max(1,b.x-a.x),Math.max(1,b.y-a.y),'#222c2a');
    rect(a.x,a.y,Math.max(1,b.x-a.x),1,'#2f3d39');
  });
  SEWER2_TORCHES.forEach(b=>{ const q=pt(b.x,b.y);
    rect(q.x-1,q.y-1,2,2,'rgba(90,180,220,'+(0.5+0.4*Math.sin(t*3+b.ph)).toFixed(2)+')'); });
  if(hunterAlive() && HUNTER.aggro){ const q=pt(HUNTER.x,HUNTER.y);
    rect(q.x-2,q.y-2,4,4,'rgba(90,224,122,'+(0.55+0.45*Math.sin(t*6)).toFixed(2)+')'); }
  const e=pt(SEWER2_ENTRY.x, SEWER2_ENTRY.y);
  rect(e.x-2,e.y-2,4,4,'rgba(120,150,180,0.8)');
  const me=pt(P.x,P.y), pulse=0.6+0.4*Math.sin(t*3.4);
  rect(me.x-2, me.y-2, 5, 5, 'rgba(0,0,0,0.7)');
  rect(me.x-1, me.y-1, 3, 3, 'rgb('+(230*pulse|0)+','+(215*pulse|0)+','+(160*pulse|0)+')');
}
// LIGHTING LAYER: BEFORE the composite. A scrap of paper in the grass obeys the
// dark like everything else - you find these by carrying light over them, which
// is the point. Only the Crystalized Tear breaks that rule, and it breaks it on
// purpose. They do get a small pre-composite carve (below, in drawLighting) so
// a torch passing nearby lifts them out of the ground rather than hiding them.
function drawNote(n){
  if(n.found) return;
  const x=Math.round(n.x-cam.x), y=Math.round(n.y-cam.y);
  if(x<-20||x>W+20||y<-20||y>H+20) return;
  const rr=rng(n.seed);
  const flut = Math.sin(t*1.3+n.seed)*0.6;      // a corner lifting in the wind
  rect(x-5, y+1, 11, 2, 'rgba(0,0,0,0.42)');
  // the sheet, slightly rumpled, never pure white against a grimdark palette
  rect(x-5, y-6, 10, 8, '#8a8570');
  rect(x-5, y-6, 10, 1, '#a39d84');
  rect(x-5, y-6, 1, 8, '#9a9480');
  rect(x+4, y-6, 1, 8, '#6e6a59');
  rect(x-5, y+1, 10, 1, '#5c584a');
  // a folded corner that catches the light
  rect(x+2, y-6+flut, 3, 3, '#b0a98e');
  rect(x+2, y-6+flut, 3, 1, '#c4bc9e');
  // ink: three short ruled strokes, deliberately illegible at this size
  for(let i=0;i<3;i++){
    const w = 4 + Math.floor(rr()*4);
    rect(x-3, y-4+i*2, w, 1, 'rgba(40,34,24,0.7)');
  }
  rect(x-3, y+0, 3, 1, 'rgba(40,34,24,0.55)');
}
// LIGHTING LAYER: BEFORE the composite. Masonry and timber obey the dark; the
// wall is only visible where a brazier or the player's light reaches it, which
// is what makes the village feel enclosed rather than merely bounded.
const WALL_D='#1e1c19', WALL_M='#2a2723', WALL_L='#343029', WALL_H='#3e392f';
function drawVillageWall(){
  const x0=Math.max(0, Math.floor(cam.x/24)*24-24), x1=cam.x+W+24;
  const y0=Math.max(0, Math.floor(cam.y/24)*24-24), y1=cam.y+H+24;
  const IN=WALL_IN, T=WALL_T, OUT=WALL_IN-WALL_T;
  // one course of dressed blocks, offset every other row
  const course=(wx, wy, w, h, seed)=>{
    const sx=wx-cam.x, sy=wy-cam.y;
    if(sx>W+30||sx+w<-30||sy>H+30||sy+h<-30) return;
    rect(sx, sy, w, h, WALL_M);
    const rows=Math.ceil(h/10);
    for(let r=0;r<rows;r++){
      const ry=sy+r*10;
      for(let i=0;i<Math.ceil(w/22)+1;i++){
        const bx=sx+i*22-((r%2)*11);
        const rr=rng(((wx+i*37)*73856093 ^ (wy+r*17)*19349663)>>>0);
        const v=rr();
        rect(Math.max(sx,bx), ry, Math.min(21, sx+w-bx), 9,
          v<0.34?WALL_D : v<0.68?WALL_M : WALL_L);
        rect(Math.max(sx,bx), ry, Math.min(21, sx+w-bx), 1, WALL_H);
      }
      rect(sx, ry+9, w, 1, '#141210');
    }
    // capstone lip along the inner face, and the shadow it throws inward
    rect(sx, sy+h-3, w, 3, WALL_L);
    rect(sx, sy+h-3, w, 1, WALL_H);
    for(let i=0;i<7;i++) rect(sx, sy+h+i, w, 1, 'rgba(0,0,0,'+((1-i/7)*0.44).toFixed(3)+')');
  };
  // north, split around the gate
  course(0, OUT, NORTH_GATE.x, T, 1);
  course(NORTH_GATE.x+NORTH_GATE.w, OUT, WORLD-(NORTH_GATE.x+NORTH_GATE.w), T, 2);
  // south
  course(0, WORLD-IN, WORLD, T, 3);
  // west and east, drawn as vertical bands
  const band=(wx, wy, w, h)=>{
    const sx=wx-cam.x, sy=wy-cam.y;
    if(sx>W+30||sx+w<-30) return;
    rect(sx, sy, w, h, WALL_M);
    for(let r=0;r<Math.ceil(h/10);r++){
      const ry=sy+r*10;
      const rr=rng(((wx*7919) ^ ((wy+r*10)*104729))>>>0), v=rr();
      rect(sx, ry, w, 9, v<0.34?WALL_D : v<0.68?WALL_M : WALL_L);
      rect(sx, ry, w, 1, WALL_H);
      rect(sx, ry+9, w, 1, '#141210');
    }
  };
  band(OUT, Math.max(0,y0), T, Math.min(WORLD, y1)-Math.max(0,y0));
  band(WORLD-IN, Math.max(0,y0), T, Math.min(WORLD, y1)-Math.max(0,y0));
  // corner towers, so the corners do not read as a mitre joint
  [[OUT,OUT],[WORLD-IN,OUT],[OUT,WORLD-IN],[WORLD-IN,WORLD-IN]].forEach(c=>{
    const sx=c[0]-cam.x-6, sy=c[1]-cam.y-6;
    if(sx>W+40||sx+42<-40||sy>H+40||sy+42<-40) return;
    rect(sx, sy, T+12, T+12, WALL_L);
    rect(sx, sy, T+12, 2, WALL_H);
    rect(sx, sy, 2, T+12, WALL_H);
    rect(sx+T+10, sy, 2, T+12, WALL_D);
    for(let i=0;i<4;i++) rect(sx+3+i*10, sy-5, 7, 6, WALL_L);   // crenellations
  });
}
// The one way in or out. Two leaves of banded timber under a stone arch.
function drawNorthGate(){
  const g=NORTH_GATE;
  const x=Math.round(g.x-cam.x), y=Math.round(g.y-cam.y);
  if(x<-120||x>W+120||y<-80||y>H+80) return;
  // stone jambs either side
  [[x-14,'#343029'],[x+g.w-2,'#2a2723']].forEach(j=>{
    rect(j[0], y-6, 16, g.h+10, j[1]);
    rect(j[0], y-6, 16, 2, WALL_H);
    for(let r=0;r<4;r++) rect(j[0], y-6+r*10, 16, 1, '#141210');
  });
  // the arch over the top
  rect(x-14, y-14, g.w+28, 9, WALL_L);
  rect(x-14, y-14, g.w+28, 2, WALL_H);
  rect(x-14, y-6, g.w+28, 2, '#141210');
  const half=g.w/2;
  if(g.open){
    // the road beyond, running off into nothing
    rect(x+1, y, g.w-2, g.h, '#07090c');
    for(let i=0;i<6;i++)
      rect(x+3+i, y, g.w-6-i*2, 1, 'rgba(90,104,124,'+(0.13-i*0.02).toFixed(3)+')');
    rect(x+half-9, y+g.h-4, 18, 4, '#171a17');           // the track itself
    // both leaves swung outward against the jambs, foreshortened
    [0,1].forEach(side=>{
      const lx = side ? x+g.w-9 : x+1;
      for(let p=0;p<3;p++){
        const px = lx + (side ? p*3 : p*3);
        rect(px, y+1, 3, g.h-2, p===0 ? '#42311d' : '#31240f');
        rect(px, y+1, 3, 1, '#503b23');
      }
      rect(lx, y+5, 8, 3, '#2c2f33');
      rect(lx, y+g.h-11, 8, 3, '#2c2f33');
    });
    // the drawn bar, leaning against the jamb where it was set down
    rect(x-12, y+4, 3, g.h-6, '#33373c');
    rect(x-12, y+4, 3, 1, '#4a5058');
    return;
  }
  // two timber leaves, banded and studded, shut
  [0,1].forEach(side=>{
    const lx = x + side*half;
    rect(lx+1, y, half-2, g.h, '#3a2b19');
    for(let p=0;p<Math.ceil(half/9);p++){
      const px=lx+2+p*9;
      rect(px, y, 8, g.h, p%2 ? '#42311d' : '#372817');
      rect(px, y, 8, 1, '#503b23');
      rect(px+7, y, 1, g.h, '#241a0e');
    }
    // iron bands
    [y+5, y+g.h-11].forEach(by=>{
      rect(lx+1, by, half-2, 4, '#2c2f33');
      rect(lx+1, by, half-2, 1, '#434850');
      for(let s=0;s<3;s++) rect(lx+6+s*Math.max(8,(half-14)/2), by+1, 2, 2, '#5c636c');
    });
    // ring handle on the inner edge of each leaf
    const hx = side ? lx+4 : lx+half-8;
    rect(hx, y+g.h/2-2, 4, 4, '#2c2f33');
    rect(hx+1, y+g.h/2-1, 2, 2, '#0d0f11');
  });
  rect(x+half-1, y, 2, g.h, '#1c1409');
  if(g.unlocked){
    // Herbert has had it unbarred: the bar is gone from its brackets and the
    // empty sockets are the visual cue that it will open now.
    rect(x+6, y+g.h/2-3, 5, 5, '#22262a');
    rect(x+g.w-11, y+g.h/2-3, 5, 5, '#22262a');
    rect(x+7, y+g.h/2-2, 3, 3, '#0a0c0e');
    rect(x+g.w-10, y+g.h/2-2, 3, 3, '#0a0c0e');
    const gl = 0.5+0.5*Math.sin(t*2.2);
    rect(x+half-1, y+g.h/2-1, 2, 2, 'rgb('+(180*gl+50|0)+','+(150*gl+40|0)+','+(70*gl|0)+')');
  } else {
    // barred shut
    rect(x+6, y+g.h/2-3, g.w-12, 5, '#33373c');
    rect(x+6, y+g.h/2-3, g.w-12, 1, '#4a5058');
    rect(x+half-3, y+g.h/2-5, 6, 9, '#22262a');   // the lock housing
    rect(x+half-1, y+g.h/2-1, 2, 3, '#0a0c0e');
  }
}

function loop(now){
  const dt = Math.min(0.05,(now-last)/1000); last=now; t+=dt;

  if(anyPanel()){ P.moving=false; interactPressed=false; }
  else if(dialogue){
    dialogue.age+=dt;
    if(interactPressed && dialogue.age>0.35) advanceDialogue();
    interactPressed=false; P.moving=false;
  } else {
    let ix=0, iy=0;
    if(keys['arrowleft']||keys['a']) ix-=1;
    if(keys['arrowright']||keys['d']) ix+=1;
    if(keys['arrowup']||keys['w']) iy-=1;
    if(keys['arrowdown']||keys['s']) iy+=1;
    const mag=Math.hypot(ix,iy);
    P.moving = mag>0.1 && !PL.dead;
    // FACING FOLLOWS THE CURSOR, not the direction of travel, and it updates
    // while standing still - that is the whole point. You aim, then swing, which
    // is what makes circling a skeleton workable instead of a wrestling match
    // with the arrow keys.
    //
    // It defers in three cases: mid-swing (ATK owns the facing), while a panel or
    // dialogue owns the pointer, and before the mouse has ever entered the canvas
    // - `mouse` starts at (-99,-99), and facing up-left on load would be wrong.
    // In those cases it falls back to the direction of travel, as before.
    if(!ATK.active){
      const inside = mouse.x>=0 && mouse.y>=0 && mouse.x<=W && mouse.y<=H;
      const mdx = mouse.x-(P.x-cam.x), mdy = mouse.y-(P.y-cam.y);
      if(inside && !anyPanel() && !dialogue && Math.hypot(mdx,mdy) > 6){
        P.dir = faceDir(mdx, mdy);            // a small dead zone, or it jitters
      } else if(mag>0.1){
        P.dir = faceDir(ix/mag, iy/mag);
      }
    }
    if(P.moving){
      ix/=mag; iy/=mag;
      P.step+=dt;
      // -20% while the bow is up, on top of the existing mid-swing slow, then
      // the stamina multipliers: shift runs 50% faster, an empty bar walks 30%
      // slower. They cannot both apply - runningNow() requires !tired.
      const sp=P.spd*(ATK.active?0.42:1)*(bowActive()?BOW_SLOW:1)
              *(runningNow()?RUN_MULT:1)*(STAM.tired?TIRED_MULT:1);
      const nx=P.x+ix*sp*dt, ny=P.y+iy*sp*dt;
      if(!blocked(nx,P.y)) P.x=nx;
      if(!blocked(P.x,ny)) P.y=ny;
    }
  }

  updateStamina(dt);
  if(ATK.cd>0) ATK.cd=Math.max(0,ATK.cd-dt);
  leanX=0; leanY=0;
  if(ATK.active){
    // The swing itself runs at staminaRate(), so an exhausted swing takes 30%
    // longer to wind, land and recover rather than merely starting later.
    P.dir=ATK.dir; ATK.t+=dt*staminaRate();
    const A=DIRA[ATK.dir], cs=Math.cos(A), sn=Math.sin(A);
    if(ATK.phase==='wind'){
      const p=ATK.t/ATK_WIND; leanX=-cs*2.4*p; leanY=-sn*2.4*p;
      if(ATK.t>=ATK_WIND){ ATK.phase='strike'; ATK.t=0; camShake=1.0; }
    } else if(ATK.phase==='strike'){
      const p=ATK.t/ATK_STRIKE; leanX=cs*3.3*p; leanY=sn*3.3*p;
      if(ATK.t>=ATK_STRIKE){ ATK.phase='recover'; ATK.t=0; }
    } else {
      const p=1-ATK.t/ATK_REC; leanX=cs*3.3*p*0.6; leanY=sn*3.3*p*0.6;
      if(ATK.t>=ATK_REC){ ATK.phase='idle'; ATK.active=false; }
    }
  }
  if(camShake>0) camShake=Math.max(0,camShake-dt*7);

  const uiPaused = anyPanel();
  if(!uiPaused && AREA.name==='village'){
    NPCS.forEach(n=>{ if(!dialogue||dialogue.npc!==n) updateNPC(n,dt); });
    GHOSTS.forEach(g=>updateGhost(g,dt));
    updateOwls(dt);
    if(HANGED.cut && HANGED.fall<1.2) HANGED.fall+=dt;
  }
  if(!uiPaused && AREA.name==='undercroft'){
    SKELETONS.forEach(k=>updateSkeleton(k,dt));
    ZOMBIES.forEach(z=>updateZombie(z,dt));
    updateDrips(dt);
  }
  if(!uiPaused && AREA.name==='sewer'){
    SEWERS.forEach(k=>updateSkeleton(k,dt));
    updateSewerAmbience(dt);
    stepDrips(dt);
  }
  if(!uiPaused && AREA.name==='sewer2'){
    updateHunter(dt);
    updateSewerAmbience(dt);
    stepDrips(dt);
  }
  if(!uiPaused && AREA.name==='road'){
    updateRoad(dt);
    ROAD_SKELS.forEach(k=>updateRoadSkel(k,dt));
    updateArrows(dt);
    updateCrickets(dt);
  }
  if(!uiPaused) updateShots(dt);       // the player's arrows fly in every area
  if(!uiPaused) DROPS.forEach(d=>d.age+=dt);

  // The old shape was `if(lamp && !uiPaused) drain; else if(...) regen;` which
  // meant an open panel skipped the drain and fell straight into the REGEN
  // branch - you could top the lamp up by sitting in the inventory. Perseverance
  // would have tripled the rate of that. Panels now freeze the meter entirely.
  if(!uiPaused){
    if(heldLight()==='lamp'){
      LAMP.c-=LAMP.drain*dt;
      if(LAMP.c<=0){ LAMP.c=0; lightKind=null; embers.length=0; }
    } else if(LAMP.c<LAMP.max) LAMP.c=Math.min(LAMP.max, LAMP.c+lampRegen()*dt);
  }

  if(PL.hurt>0) PL.hurt=Math.max(0,PL.hurt-dt*1.6);
  if(PL.heal>0) PL.heal=Math.max(0,PL.heal-dt*1.4);
  if(PL.denied>0) PL.denied=Math.max(0,PL.denied-dt*2);
  if(STEAL.t>0 && !uiPaused){
    STEAL.t = Math.max(0, STEAL.t-dt);
    if(!PL.dead) PL.hp = Math.min(PL.max, PL.hp + STEAL_RATE*dt);
  }

  if(ATK.phase==='strike'){
    const pv=swingPivot(), lead=cleaveLead(), sp=cleaveSpan();
    const inArc=(wx,wy,off)=>{
      const gx=wx-cam.x, gy=wy-cam.y-(off||14);
      const dx=gx-pv.x, dy=gy-pv.y, d=Math.hypot(dx,dy);
      if(d<7||d>arcR()+14) return false;
      let ad=Math.atan2(dy,dx)-lead;
      while(ad>Math.PI) ad-=Math.PI*2;
      while(ad<-Math.PI) ad+=Math.PI*2;
      return !(ad>0.30 || ad<-(sp.span+0.30));
    };
    if(AREA.name==='village' && hangedActive() && !HANGED.cut && ATK.hits.indexOf('rope')<0){
      const ra=ropeAnchor();
      if(inArc(ra.x, ra.y, 26)){
        ATK.hits.push('rope');
        HANGED.cut=true; HANGED.fall=0;
        camShake=Math.max(camShake,1.2);
        sfx('hit');
        toast('The rope parts. The body drops.');
      }
    }
    // barrels, before the living things: they are scenery until you hit one
    const dh = decorHere();
    if(dh) dh.forEach(d=>{
      if(d.t!=='barrel' || d.broken || ATK.hits.indexOf(d)>=0) return;
      if(!inArc(d.x, d.y, 10)) return;
      ATK.hits.push(d);
      breakBarrel(d);
    });
    ZOMBIES.forEach(z=>{
      if(z.gone||z.dying>0||ATK.hits.indexOf(z)>=0) return;
      if(!inArc(z.x,z.y,18)) return;
      ATK.hits.push(z);
      z.hp-=weaponDmg(); z.hurt=0.34; z.aggro=true;
      const kd=Math.hypot(z.x-P.x,z.y-P.y)||1;
      const bx=z.x+(z.x-P.x)/kd*8, by2=z.y+(z.y-P.y)/kd*8;
      if(!blocked(bx,by2,9)){ z.x=bx; z.y=by2; }
      camShake=Math.max(camShake,1.3);
      sfx('hit');
      // Zombies are not in the spec's ember table; priced with skeletons, since
      // they are the same tier of undercroft threat. Flagged in the build notes.
      if(z.hp<=0){ z.dying=1.1; z.swing=0; zomSfx('moan',z); gainXP(16); onKill(SE_SKELETON); }
    });
    if(AREA.name==='sewer2' && hunterAlive() && ATK.hits.indexOf(HUNTER)<0
       && inArc(HUNTER.x, HUNTER.y, 18)){
      ATK.hits.push(HUNTER);
      HUNTER.hp -= weaponDmg(); HUNTER.hurt=0.34; HUNTER.aggro=true; HUNTER.seen=true;
      const kd=Math.hypot(HUNTER.x-P.x,HUNTER.y-P.y)||1;
      const bx=HUNTER.x+(HUNTER.x-P.x)/kd*6, by3=HUNTER.y+(HUNTER.y-P.y)/kd*6;
      if(!blocked(bx,by3,9)){ HUNTER.x=bx; HUNTER.y=by3; }   // heavier: less knockback
      camShake=Math.max(camShake,1.5);
      boneSfx('hurt', HUNTER);
      if(HUNTER.hp<=0){ HUNTER.hp=0; HUNTER.dying=1.4; HUNTER.swing=0; }
    }
    activeSkeletons().forEach(k=>{
      if(k.gone||k.dying>0||ATK.hits.indexOf(k)>=0) return;
      if(!inArc(k.x,k.y,16)) return;
      ATK.hits.push(k);
      k.hp-=weaponDmg(); k.hurt=0.34; k.aggro=true;
      const kd=Math.hypot(k.x-P.x,k.y-P.y)||1;
      const bx=k.x+(k.x-P.x)/kd*11, by2=k.y+(k.y-P.y)/kd*11;
      if(!blocked(bx,by2,8)){ k.x=bx; k.y=by2; }
      camShake=Math.max(camShake,1.3);
      boneSfx('hurt',k);
      if(k.hp<=0){ k.dying=0.9; k.swing=0; boneSfx('die',k); gainXP(12); onKill(SE_SKELETON); }
    });
    GHOSTS.forEach(g=>{
      if(g.gone||g.dying>0||ATK.hits.indexOf(g)>=0) return;
      if(ghostAlpha(g)<=0.15) return;
      const gx=g.x-cam.x, gy=g.y-cam.y-18;
      const dx=gx-pv.x, dy=gy-pv.y, d=Math.hypot(dx,dy);
      if(d<7||d>arcR()+14) return;
      let ad=Math.atan2(dy,dx)-lead;
      while(ad>Math.PI) ad-=Math.PI*2;
      while(ad<-Math.PI) ad+=Math.PI*2;
      if(ad>0.30||ad<-(sp.span+0.30)) return;
      ATK.hits.push(g);
      g.committed = true;              // struck: it will not back off again
      g.hp-=weaponDmg(); g.hurt=0.34;
      const kd=Math.hypot(g.x-P.x,g.y-P.y)||1;
      g.x+=(g.x-P.x)/kd*13; g.y+=(g.y-P.y)/kd*13;
      camShake=Math.max(camShake,1.3);
      sfx('hit');
      if(g.hp<=0){
        g.dying=0.55; g.hostile=false; ghostSfx('whimper',g); gainXP(XP_PER_GHOST);
        onKill(SE_WRAITH);
        const q=questById('shades');
        if(q.state==='active'){
          q.count++;
          if(q.count>=q.need){ q.state='ready'; banner('VOW FULFILLED', null, 'red'); sfx('vow'); }
        }
      }
    });
  }

  if(whisper){
    whisper.age+=dt;
    if(whisper.age>=whisper.dur||(interactPressed&&whisper.age>0.6)) whisper=null;
  }
  if(P.moving && !dialogue && !uiPaused) walkTime+=dt;
  if(!whisper && !dialogue && !uiPaused && whisperIdx<whisperOrder.length && walkTime>=WHISPER_INTERVAL){
    walkTime=0; startWhisper();
  }

  if(PL.dead){
    PL.deadT+=dt;
    if(PL.deadT>2.6){
      PL.dead=false; PL.deadT=0; PL.hp=PL.max; PL.hurt=0;
      // DEATH SENDS YOU BACK TO HOLLOWMERE - AND THE AREA HAS TO COME WITH YOU.
      // This set the village spawn COORDINATES without ever setting AREA.name,
      // so dying on the road or in the sewers dropped you at (600,664) while the
      // game still believed you were where you died. In the road that point is
      // outside every ROAD_ROOM, which is to say inside the void, and it reads
      // exactly like being thrown back to the beginning.
      AREA.name='village';
      P.x=600; P.y=664; P.dir=0;
      if(blocked(P.x,P.y,6)) unstick(P,6);
      DRIPS.length=0;
      STAM.c=STAM_N; STAM.tired=false; STAM.idle=STAM_DELAY;
      ATK.active=false; ATK.phase='idle'; ATK.cd=0;
      GHOSTS.forEach(g=>{ if(!g.gone){ g.hostile=false; g.committed=false; g.exp=0; g.hp=GHOST_HP;
        g.x=g.hx; g.y=g.hy; g.spd=14+Math.random()*10; } });
      embers.length=0;
    }
  }
  updateAmbience();          // rain above, the hum below
  ORB_L.fill = PL.hp/PL.max;
  ORB_R2.fill = LAMP.c/LAMP.max;

  let near=null, nd=45, nearDrop=null, ndd=36, nearHerbert=false;
  let nearRope=false, nearWell=false, nearChest=false;
  let nearShopDoor=false, nearOndrick=false, nearGrate=false;
  let nearAldric=false, nearGate=false, nearNote=null;
  let nearCavern=false, nearBackGate=false;
  const clearOthers = ()=>{ near=null; nearHerbert=false; };
  const uiOpen = anyPanel();
  if(!dialogue && !PL.dead && !uiOpen){
    if(AREA.name==='village'){
      NPCS.forEach(n=>{ const d=Math.hypot(n.x-P.x,n.y-P.y); if(d<nd){ nd=d; near=n; } });
      const dh = Math.hypot(HERBERT.x-P.x, HERBERT.y-P.y);
      if(dh < 48 && dh <= nd + 14){ nearHerbert = true; near = null; nd = dh; }
      if(hangedActive() && HANGED.cut && !HANGED.taken && HANGED.fall>0.8){
        const ra=ropeAnchor();
        if(Math.hypot(ra.x-P.x, ra.y-P.y) < 40){ nearRope=true; clearOthers(); }
      }
      const sd = shopDoor();
      if(!nearRope && Math.hypot(sd.x-P.x, sd.y-P.y) < 40){ nearShopDoor=true; clearOthers(); }
      const gs = gateStand();
      if(!nearRope && !nearShopDoor && Math.hypot(P.x-gs.x, P.y-gs.y) < 46){
        nearGate=true; clearOthers();
      }
      const dw = Math.hypot(STONES[1].x-P.x, (STONES[1].y+18)-P.y);
      if(!nearRope && !nearShopDoor && !nearGate && dw < 46){ nearWell=true; clearOthers(); }
    } else if(AREA.name==='undercroft'){
      const ds = Math.hypot(SHAFT.x-P.x, (SHAFT.y+10)-P.y);
      if(ds < 44) nearWell = true;
      if(!CHEST.taken && Math.hypot(CHEST.x-P.x, (CHEST.y+8)-P.y) < 46){ nearChest=true; nearWell=false; }
      if(Math.hypot(SEWER_GRATE.x-P.x, GRATE_STAND.y-P.y) < 40){
        nearGrate=true; nearWell=false; nearChest=false;
      }
    } else if(AREA.name==='sewer'){
      if(Math.hypot(SEWER_STAND.x-P.x, SEWER_STAND.y-P.y) < SEWER_EXIT_R) nearWell = true;
      if(!ALDRIC.taken && Math.hypot(ALDRIC.x-P.x, (ALDRIC.y-6)-P.y) < 42){
        nearAldric=true; nearWell=false;
      }
      if(Math.hypot(DEEP_STAND.x-P.x, DEEP_STAND.y-P.y) < 40){
        nearGrate=true; nearWell=false; nearAldric=false;
      }
    } else if(AREA.name==='sewer2'){
      if(Math.hypot(SEWER2_STAND.x-P.x, SEWER2_STAND.y-P.y) < 40) nearWell = true;
    } else if(AREA.name==='shop'){
      if(Math.hypot(ONDRICK.x-P.x, (ONDRICK.y+22)-P.y) < 44) nearOndrick = true;
      if(Math.hypot(SHOP_DOOR.x-P.x, (SHOP_ROOM.y+SHOP_ROOM.h+4)-P.y) < 34){
        nearShopDoor = true; nearOndrick = false;
      }
    } else {
      const dh = Math.hypot(HERBERT.x-P.x, HERBERT.y-P.y);
      if(dh < 48){ nearHerbert = true; nd = dh; }
      if(Math.hypot(HOUSE_DOOR.x-P.x, (HOUSE_ROOM.y+HOUSE_ROOM.h+4)-P.y) < 34){
        nearWell = true; nearHerbert = false;
      }
    }
    if(AREA.name==='road'){
      const cs2 = ruinStand();
      if(Math.hypot(cs2.x-P.x, cs2.y-P.y) < 40) nearCavern = true;
      // the way back to Hollowmere, at the southern end
      if(P.y > ROAD_H-70) nearBackGate = true;
    }
    // Notes exist in several areas now, and win ties against everything else:
    // they are small, and standing on one in a crowd should still pick it up.
    let nnd = 30;
    notesHere().forEach(n=>{ if(n.found) return;
      const d=Math.hypot(n.x-P.x, (n.y-4)-P.y);
      if(d<nnd){ nnd=d; nearNote=n; } });
    if(nearNote){
      near=null; nearHerbert=false; nearRope=false; nearWell=false;
      nearShopDoor=false; nearGate=false; nearGrate=false; nearAldric=false;
    }
    DROPS.forEach(dr=>{ const d=Math.hypot(dr.x-P.x,dr.y-P.y); if(d<ndd){ ndd=d; nearDrop=dr; } });
  }
  const anyTarget = near||nearHerbert||nearRope||nearWell||nearChest
    ||nearShopDoor||nearOndrick||nearGrate||nearAldric||nearGate||nearNote
    ||nearCavern||nearBackGate;
  if(nearDrop && anyTarget && ndd<=nd){
    near=null; nearHerbert=false; nearRope=false; nearWell=false; nearChest=false;
    nearShopDoor=false; nearOndrick=false; nearGrate=false; nearAldric=false;
    nearGate=false; nearNote=null; nearCavern=false; nearBackGate=false;
  } else if(anyTarget && nearDrop) nearDrop=null;
  if(interactPressed){
    if(nearCavern){
      // Inert by design: a hook for later content, and nothing else.
      startDialogue(P, 'Nestor', [{text:"It's sealed with magic, I can't open it, yet"}]);
    } else if(nearBackGate){
      backToVillage();
    } else if(nearNote){
      takeNote(nearNote); nearNote=null;
    } else if(nearDrop){
      takeDrop(nearDrop);          // refuses and leaves it lying there when full
      nearDrop=null;
    } else if(nearRope){
      if(!addItem('rope','Frayed rope')) refusePickup();
      else { HANGED.taken=true; toast('Rope added to your inventory'); sfx('pickup'); }
    } else if(nearAldric){
      readLetter();
    } else if(nearGrate && AREA.name==='sewer'){
      descendDeep();                       // the way further down, past Aldric
    } else if(nearGrate){
      if(SEWER_GRATE.open) descendSewer();
      else if(hasItem('key')){
        SEWER_GRATE.open = true;   // permanent: the key is not consumed
        SEWER_KEY.used = true;
        sfx('grate'); camShake=Math.max(camShake,1.4);
        banner('THE GRATE GIVES', 'THE DROWNED RUN', 'red');
      } else {
        startDialogue(P, 'Nestor', [{text:'THE GRATE IS LOCKED'}]);
      }
    } else if(nearGate){
      if(!NORTH_GATE.unlocked){
        startDialogue(P, 'Nestor', [{text:'THE NORTH ROAD IS NOT YET WALKED'}]);
      } else if(!NORTH_GATE.open){
        NORTH_GATE.open = true;
        sfx('gateopen');
        camShake = Math.max(camShake, 1.5);
        BANNER = null;
        banner('THE GATE GIVES', 'THE ROAD TO YOTAN', 'gold');
      } else {
        takeRoad();
      }
    } else if(nearOndrick){
      ONDRICK.dir=faceDir(P.x-ONDRICK.x, P.y-ONDRICK.y);
      P.dir=faceDir(ONDRICK.x-P.x, ONDRICK.y-P.y);
      talkToOndrick();
    } else if(nearShopDoor){
      if(AREA.name==='shop') leaveShop(); else enterShop();
    } else if(nearChest){
      openChest();
    } else if(nearWell){
      if(AREA.name==='village' && !hasItem('rope')){
        startDialogue(P, 'Nestor', [{text:'I cant go down there, I need something to lower me in'}]);
      } else if(AREA.name==='village'){ descend(); }
      else if(AREA.name==='house'){ leaveHouse(); }
      else if(AREA.name==='sewer'){ ascendSewer(); }
      else if(AREA.name==='sewer2'){ ascendDeep(); }
      else ascend();
    } else if(nearHerbert){
      HERBERT.dir=faceDir(P.x-HERBERT.x, P.y-HERBERT.y);
      P.dir=faceDir(HERBERT.x-P.x, HERBERT.y-P.y);
      talkToHerbert();
    } else if(near){
      near.dir=faceDir(P.x-near.x, P.y-near.y);
      near.moving=false; near.wait=6;
      P.dir=faceDir(near.x-P.x, near.y-P.y);
      if(near.line) startDialogue(near, 'Villager', [{text:near.line}]);
      else startDialogue(near, 'Villager', [{text:'...'}], true);
    }
  }
  interactPressed=false;

  cam.x=Math.max(0,Math.min(areaW()-W,P.x-W/2));
  cam.y=Math.max(0,Math.min(areaH()-H,P.y-H/2));
  if(camShake>0){
    cam.x+=Math.round(Math.sin(t*97)*camShake*2);
    cam.y+=Math.round(Math.cos(t*83)*camShake*1.6);
  }

  const village = AREA.name==='village';
  const house = AREA.name==='house';
  const shop = AREA.name==='shop';
  const sewer = AREA.name==='sewer';
  const sewer2 = AREA.name==='sewer2';
  const road = AREA.name==='road';
  if(house){ drawHouseRoom(); }
  else if(shop){ drawShopRoom(); }
  else if(road){
    drawRoadGround();
    ROAD_GRAVES.forEach(drawRoadGrave);
    drawYotanGate();
  }
  else if(village){
    drawGround();
    drawVillageWall();
    props.forEach(drawProp);
    GRAVES.forEach(drawGrave);
    FENCES.forEach(drawFence);
  } else if(sewer){
    drawSewerGround();
  } else if(sewer2){
    drawSewer2Ground();
  } else {
    drawUnderGround();
  }

  const layers=[];
  if(village){
    HOUSES.forEach(h=>layers.push({y:h.y+h.h, f:()=>drawHouse(h)}));
    TREES.forEach(tr=>layers.push({y:tr.y, f:()=>drawTree(tr)}));
    layers.push({y:STONES[0].y, f:()=>drawPyre(STONES[0])});
    layers.push({y:STONES[1].y, f:()=>drawWell(STONES[1])});
    layers.push({y:STONES[2].y, f:()=>drawCart(STONES[2])});
    BRAZIERS.forEach(b=>layers.push({y:b.y, f:()=>drawBrazier(b)}));
    NPCS.forEach(n=>layers.push({y:n.y, f:()=>drawFigure(n.x,n.y,n.dir,n.step*7,n.moving,n.pal,
      {eyes:'pale', light:null, blade:false})}));
    GHOSTS.forEach(g=>{ const a=ghostAlpha(g);
      if(a>0.02) layers.push({y:g.y, f:()=>drawGhost(g,a)}); });
    layers.push({y:HANGED.y, f:drawHanged});
    layers.push({y:NORTH_GATE.y+NORTH_GATE.h, f:drawNorthGate});
    layers.push({y:STONES[1].y+1, f:drawWellMarker});
    layers.push({y:HERBERT.y, f:()=>{ drawElder(); drawQuestMarker(); }});
  } else if(house){
    CATS.forEach(c=>layers.push({y:c.y, f:()=>drawCat(c)}));
    layers.push({y:HERBERT.y, f:()=>{ drawElder(); drawQuestMarker(); }});
  } else if(shop){
    layers.push({y:ONDRICK.y, f:drawOndrick});
  } else if(sewer){
    SEWER_DECOR.forEach(d=>layers.push({y:d.y, f:()=>drawDecor(d)}));
    SEWER_TORCHES.forEach(b=>layers.push({y:b.y, f:()=>drawSewerTorch(b)}));
    layers.push({y:SEWER_SHAFT.y, f:drawSewerShaft});
    layers.push({y:DEEP_GATE.y, f:drawDeepGate});
    layers.push({y:ALDRIC.y, f:drawAldric});
    SEWERS.forEach(k=>{ if(!k.gone||k.dying>0)
      layers.push({y:k.y, f:()=>{ drawSkeleton(k); drawSkelArc(k); }}); });
  } else if(sewer2){
    SEWER2_DECOR.forEach(d=>layers.push({y:d.y, f:()=>drawDecor(d)}));
    SEWER2_TORCHES.forEach(b=>layers.push({y:b.y, f:()=>drawSewerTorch(b)}));
    layers.push({y:SEWER2_ENTRY.y, f:drawSewer2Entry});
    layers.push({y:HUNTER.y, f:drawFallenHunter});
  } else if(road){
    ROAD_TREES.forEach(tr=>layers.push({y:tr.y, f:()=>drawTree(tr)}));
    layers.push({y:RUIN.y+RUIN.h, f:drawRuin});
    YOTAN_TORCHES.forEach(b=>layers.push({y:b.y, f:()=>drawYotanTorch(b)}));
    YOTAN_GUARDS.forEach(g=>layers.push({y:g.y, f:()=>drawYotanGuard(g)}));
    ROAD_SKELS.forEach(k=>{ if((!k.gone||k.dying>0) && k.rise>0)
      layers.push({y:k.y, f:()=>{ drawSkeleton(k); if(!k.archer) drawSkelArc(k); }}); });
  } else {
    layers.push({y:SEWER_GRATE.y, f:drawGrate});
    if(!CHEST.taken || CHEST.open) layers.push({y:CHEST.y, f:drawChest});
    ZOMBIES.forEach(z=>{ if(!z.gone||z.dying>0) layers.push({y:z.y, f:()=>drawZombie(z)}); });
    UNDER_DECOR.forEach(d=>layers.push({y:d.y, f:()=>drawDecor(d)}));
    UNDER_TORCHES.forEach(b=>layers.push({y:b.y, f:()=>drawUnderTorch(b)}));
    layers.push({y:SHAFT.y, f:drawShaft});
    SKELETONS.forEach(k=>{ if(!k.gone||k.dying>0)
      layers.push({y:k.y, f:()=>{ drawSkeleton(k); drawSkelArc(k); }}); });
  }
  notesHere().forEach(n=>{ if(!n.found) layers.push({y:n.y, f:()=>drawNote(n)}); });
  DROPS.forEach(d=>layers.push({y:d.y, f:()=>drawDrop(d)}));
  let torch=null;
  layers.push({y:P.y, f:()=>{ torch=drawFigure(P.x+leanX,P.y+leanY,P.dir,P.step*9,P.moving,PAL_P,
    {eyes:true, light:heldLight(), blade:true}); }});
  if(ATK.active && !bowActive()) layers.push({y:P.y+0.5, f:drawCleave});
  layers.sort((a,b)=>a.y-b.y).forEach(l=>l.f());

  if(!torch) torch={x:P.x-cam.x, y:P.y-cam.y-22, kind:null};
  updateEmbers(dt, torch); drawEmbers();
  if(near) drawPrompt(near);
  if(nearHerbert) drawPrompt(HERBERT);
  if(nearRope) drawPrompt({x:ropeAnchor().x, y:ropeAnchor().y+10});
  if(nearWell) drawPrompt(AREA.name==='village' ? {x:STONES[1].x, y:STONES[1].y-40}
    : AREA.name==='house' ? {x:HOUSE_DOOR.x, y:HOUSE_ROOM.y+HOUSE_ROOM.h+4}
    : AREA.name==='sewer' ? {x:SEWER_SHAFT.x, y:SEWER_SHAFT.y+18}
    : {x:SHAFT.x, y:SHAFT.y-4});
  if(nearChest) drawPrompt({x:CHEST.x, y:CHEST.y-16});
  if(nearOndrick) drawPrompt({x:ONDRICK.x, y:ONDRICK.y+4});
  if(nearShopDoor) drawPrompt(AREA.name==='shop'
    ? {x:SHOP_DOOR.x, y:SHOP_ROOM.y+SHOP_ROOM.h+4}
    : {x:shopDoor().x, y:shopDoor().y-16});
  if(nearGrate) drawPrompt({x:SEWER_GRATE.x, y:SEWER_GRATE.y-14});
  if(nearAldric) drawPrompt({x:ALDRIC.x, y:ALDRIC.y-14});
  if(nearGate) drawPrompt({x:NORTH_GATE.x+NORTH_GATE.w/2, y:NORTH_GATE.y+NORTH_GATE.h+8});
  if(nearNote) drawPrompt({x:nearNote.x, y:nearNote.y+4});
  if(nearDrop) drawPrompt({x:nearDrop.x, y:nearDrop.y+6});
  if(nearCavern) drawPrompt({x:RUIN.x+RUIN.w/2, y:RUIN.y+RUIN.h+6});
  if(nearBackGate) drawPrompt({x:ROAD_CX, y:ROAD_H-40});
  // The road leaves the village's weather behind: the same fade that thins the
  // rain BED thins the visible rain, so what you hear and what you see agree.
  if(village){ updateRain(dt); drawSplashes(); drawRain(1,1); drawFog(); }
  else if(road){
    const wv = roadWeather();
    if(wv > 0.02){ updateRain(dt); drawSplashes(); drawRain(wv, 1); }
    drawFog();
  }
  else if(!indoors()) drawDrips();
  drawLighting(torch);
  drawTearShimmer();          // self-luminous by design - see the note on the fn
  drawShopSign();             // self-luminous by design - see the note on the fn
  // LIGHTING LAYER: AFTER the composite, and this one is a FAIRNESS rule rather
  // than a look. The archer holds 110-210px, which is outside your light, so
  // both it and its arrows were being swallowed by the dark - and an arrow you
  // cannot see is not an arrow you can dodge, which is the whole spec for it.
  // Arrows and the archer's eyes are therefore self-luminous.
  if(AREA.name==='road'){
    ARROWS.forEach(drawArrow);
    drawArcherTell();
  }
  SHOTS.forEach(drawArrow);   // yours too, so the 12-tile range stays readable
  if(village) drawRain(0.16,3);
  else if(road && roadWeather()>0.02) drawRain(0.16*roadWeather(), 3);
  drawVignette();
  drawVoiceDim();             // self-luminous by design - see the note on the fn
  drawHurtOverlay();
  if(dialogue) drawDialogue();
  if(whisper) drawWhisper();
  drawHunterBar();
  // The character sheet now reaches down to y332 and would clip the tops off
  // both orbs. It already shows HP, lamp, and the belt slots, so the HUD is
  // redundant while it is open rather than merely covered.
  // THE ACTION BAR STAYS VISIBLE WHILE THE PACK IS OPEN.
  //
  // Hotbar slots 1-9 ARE backpack slots 0-8 - the same array - and invClick has
  // always routed a click on the bar through pickPlace. The only thing missing
  // was the bar itself: it was hidden whenever the panel opened, so there was
  // nothing to drag an item onto or pull one off. Drawing it makes the exchange
  // work in both directions with no new machinery, and it shows at a glance
  // which pack slots the number keys are bound to.
  if(!INV.open){ drawStamina(); drawOrbs(); }
  drawHotbar();
  if(AREA.name==='village') drawMinimap();
  else if(AREA.name==='undercroft') drawUnderMinimap();
  else if(AREA.name==='sewer') drawSewerMinimap();
  else if(AREA.name==='sewer2') drawSewer2Minimap();
  if(TOAST){ TOAST.age+=dt; if(TOAST.age>=TOAST.dur) TOAST=null; }
  drawToast();
  if(BANNER){ BANNER.age+=dt; if(BANNER.age>=BANNER.dur) BANNER=null; }
  drawBanner();
  if(INV.open) drawInventory();
  if(JOURNAL.open) drawJournal();
  if(HINTS.open) drawHints();
  if(SKILLPANE.open) drawSkills();
  if(SHOP.open) drawShop();
  if(SCROLL.open && SCROLL.quest) drawQuestScroll();
  if(ENDING.open) drawEnding();     // last, so it sits over everything
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
